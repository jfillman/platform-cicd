# observability/grafana/kustomization.yaml
#
# Turns each dashboard JSON into a labeled ConfigMap the Grafana sidecar auto-discovers
# and loads - no manual Grafana UI import step, dashboards are versioned as code like
# everything else in this repo. Targets the `observability` namespace because that's
# where kind-observe's existing Grafana (and its sidecar) already runs - see
# ../grafana/values.yaml. On a from-scratch cluster using that values.yaml instead,
# change this to platform-observability to match.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

configMapGenerator:
  - name: dashboard-pipelines-overview
    files: [dashboards/pipelines-overview.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-pipeline-detail
    files: [dashboards/pipeline-detail.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-dora
    files: [dashboards/dora.json]
    options: { labels: { grafana_dashboard: "1" } }
  # Phase 3 item 5: 5 CI/CD-dashboard variants + 5 DORA-dashboard variants, built as a
  # "dashboard competition" for the user to pick favorites from - see the plan's Phase 3
  # item 5 entry. Each is a self-contained design (not incremental iterations of one
  # dashboard), so all 10 stay side by side rather than replacing pipelines-overview.json/
  # dora.json above.
  - name: dashboard-cicd-mission-control
    files: [dashboards/cicd-mission-control.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-cicd-reliability
    files: [dashboards/cicd-reliability.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-cicd-performance
    files: [dashboards/cicd-performance.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-cicd-governance
    files: [dashboards/cicd-governance.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-cicd-fleet-overview
    files: [dashboards/cicd-fleet-overview.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-dora-quadrant
    files: [dashboards/dora-quadrant.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-dora-executive
    files: [dashboards/dora-executive.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-dora-trends
    files: [dashboards/dora-trends.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-dora-comparison
    files: [dashboards/dora-comparison.json]
    options: { labels: { grafana_dashboard: "1" } }
  - name: dashboard-dora-deepdive
    files: [dashboards/dora-deepdive.json]
    options: { labels: { grafana_dashboard: "1" } }
