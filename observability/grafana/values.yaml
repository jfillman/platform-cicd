# observability/grafana/values.yaml
#
# NOT APPLIED on kind-observe - a Grafana instance already runs there (bundled with the
# existing kube-prometheus-stack release), already using the exact same sidecar
# ConfigMap-discovery convention (label grafana_dashboard: "1") this file configures,
# and already has Prometheus/Tempo/Loki datasources provisioned with UIDs (prometheus/
# tempo/loki) matching what our dashboard JSONs reference - see docs/bootstrap.md.
# hack/bootstrap.sh does not install this chart on kind-observe; the dashboard
# ConfigMaps themselves are rendered by charts/platform-cicd-control-plane's own
# templates/grafana/dashboards-configmap.yaml (part of the control-plane Helm release,
# not a separate step) into the observability namespace, where the existing Grafana's
# sidecar picks them up automatically.
#
# Kept as the reference config for a cluster that doesn't already have Grafana. Helm
# values overlay for the upstream grafana/grafana chart, run standalone (not bundled
# with kube-prometheus-stack - see ../kube-prometheus-stack/values.yaml).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    folder: /tmp/dashboards
  datasources:
    enabled: true
    label: grafana_datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.platform-observability.svc.cluster.local:9090
        isDefault: true
      - name: Tempo
        type: tempo
        url: http://tempo.platform-observability.svc.cluster.local:3100
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      - name: Loki
        type: loki
        url: http://loki-gateway.platform-observability.svc.cluster.local
        # See ../loki/values.yaml "KNOWN GAP" note - trace-to-logs correlation is
        # provisioned here ahead of the log-shipping mechanism actually landing.

persistence:
  enabled: true
  size: 5Gi

adminPassword: "" # supplied via ExternalSecret at deploy time - never committed
