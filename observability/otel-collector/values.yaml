# observability/otel-collector/values.yaml
#
# Helm values overlay for the upstream opentelemetry-collector chart
# (open-telemetry/opentelemetry-helm-charts), deployed as the single in-cluster
# ingestion point every pipeline step's otel-cli invocation talks to
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.platform-observability.svc.cluster.local:4318).
#
# The spanmetrics connector derives RED-style Prometheus metrics (request rate, error
# rate, duration histogram) directly from incoming spans, bucketed by our own
# platform.stage/platform.chain_id attributes. Per the design review (Q5): this is used
# as a secondary cross-check for stage-duration percentiles feeding the pipeline-detail
# dashboard, NOT as the source of truth for the four core DORA numbers - those come from
# the CDEvents stream via platform/dora-exporter, a channel whose failure is loud
# instead of silent. See docs/dora-metrics.md.
mode: deployment
replicaCount: 2

config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20

  connectors:
    spanmetrics:
      histogram:
        explicit:
          buckets: [100ms, 500ms, 1s, 5s, 15s, 30s, 1m, 5m, 15m, 30m, 1h]
      dimensions:
        - name: platform.stage
        - name: platform.chain_id
        - name: governance.stub
      metrics_flush_interval: 15s

  exporters:
    otlp/tempo:
      endpoint: tempo.platform-observability.svc.cluster.local:4317
      tls: { insecure: true }
    prometheusremotewrite:
      endpoint: http://prometheus-kube-prometheus-prometheus.platform-observability.svc.cluster.local:9090/api/v1/write
    loki:
      endpoint: http://loki-gateway.platform-observability.svc.cluster.local/loki/api/v1/push

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo, spanmetrics]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [loki]

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }
