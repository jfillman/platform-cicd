# observability/kube-prometheus-stack/values.yaml
#
# NOT APPLIED on kind-observe - a kube-prometheus-stack release already runs there
# (Helm release "kube-prometheus-stack" in the observability namespace, see
# docs/bootstrap.md "Why kind-observe" for the full inventory). hack/bootstrap.sh does
# not install this chart when targeting kind-observe.
#
# This file is kept as the reference config for standing this platform up on a cluster
# that does NOT already have an observability stack. Two things this platform
# specifically needs beyond the chart's defaults: remote-write receive enabled (so the
# OTel Collector's spanmetrics connector and Tempo's metrics-generator can push into
# Prometheus instead of being scraped), and the Grafana dependency disabled - this
# platform provisions dashboards into a Grafana it doesn't also try to own the whole
# lifecycle of.
#
# The Tekton controller ServiceMonitor this file used to inline as
# `additionalServiceMonitors` now lives at ../kind-observe/tekton-servicemonitor.yaml -
# extracted to a standalone manifest specifically because kind-observe's existing
# Prometheus has empty selectors (matches everything) and needed no chart-value wiring
# at all, just `kubectl apply`.
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    retention: 15d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

grafana:
  enabled: false
