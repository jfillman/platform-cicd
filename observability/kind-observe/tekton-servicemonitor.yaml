# observability/kind-observe/tekton-servicemonitor.yaml
#
# Standalone ServiceMonitor for Tekton's own controller metrics
# (tekton_pipelines_controller_pipelinerun_duration_seconds etc. - the source for
# pipelines-overview.json's "live + historical PipelineRun list" panels). Applied
# directly rather than via the kube-prometheus-stack Helm chart (see
# ../kube-prometheus-stack/values.yaml - unused on kind-observe, that stack is already
# installed there) because the existing Prometheus CR on kind-observe has
# serviceMonitorSelector: {} and serviceMonitorNamespaceSelector: {} - empty selectors
# match everything cluster-wide, so a standalone ServiceMonitor object anywhere is
# picked up automatically with no further wiring. Verify this still holds if the
# existing Prometheus install's selectors ever get tightened.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tekton-pipelines-controller
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: platform-cicd
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: tekton-pipelines-controller }
  namespaceSelector:
    matchNames: [tekton-pipelines]
  endpoints:
    - port: http-metrics
      interval: 30s
