# observability/tempo/values.yaml
#
# NOT APPLIED on kind-observe - a Tempo release already runs there (Helm release
# "tempo" in the observability namespace, using Minio as its S3-compatible backend,
# which is a nicer setup than the local-disk config below). hack/bootstrap.sh does not
# install this chart when targeting kind-observe.
#
# Kept as the reference config for a cluster that doesn't already have Tempo. Helm
# values overlay for the upstream grafana/tempo chart (single-binary mode - the
# distributed chart is overkill until pipeline volume actually demands it). This is
# where every unified build->test->deploy->release trace lands - see docs/tracing.md.
tempo:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  # Retention deliberately short in Phase 1 - long-lived trace storage (object storage
  # backend) is a Phase 2+ concern once run volume is real, not a local-disk default.
  compactor:
    compaction:
      block_retention: 72h

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-kube-prometheus-prometheus.platform-observability.svc.cluster.local:9090/api/v1/write

persistence:
  enabled: true
  size: 20Gi
