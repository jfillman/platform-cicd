# platform/broker/manifests/eventlistener.yaml
#
# The single shared internal broker for inter-stage chaining (build->test->deploy-
# >release), replacing both the old platform's per-purpose EventListener split AND its
# JWT-minting server. Discovers per-tenant Trigger CRs living in each tenant's own
# namespace via namespaceSelector - see tenant-triggers-template.yaml - rather than one
# EventListener pod per tenant (rejected in design review as an unnecessary ongoing
# operational tax at "many tenants" scale; see docs/chaining.md).
#
# RBAC note: this EventListener's own ServiceAccount can only WATCH Trigger/
# TriggerBinding/TriggerTemplate objects cluster-wide - it holds no rights to create
# PipelineRuns anywhere itself. When a Trigger fires, Tekton Triggers creates the
# resulting PipelineRun using THAT Trigger's own `spec.serviceAccountName` (the
# tenant's own least-privilege SA - see tenant-triggers-template.yaml), not this
# EventListener's identity. Tekton Triggers implements that hand-off via scoped
# ServiceAccount impersonation: each tenant's onboarding grants this broker SA
# `impersonate` on exactly that one named SA in that one namespace (see the RBAC block
# in tenant-triggers-template.yaml) - a world apart from the old platform's single
# cluster-wide `impersonate` on every ServiceAccount plus a cluster-admin binding.
# VERIFY against the pinned Tekton Triggers version in Phase 0: confirm this is still
# the exact mechanism (vs. a token-based hand-off) before treating this comment as fact.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdevents-broker
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdevents-broker-read-triggers
rules:
  - apiGroups: ["triggers.tekton.dev"]
    # eventlisteners and interceptors (namespaced, v1alpha1 - distinct from the
    # cluster-scoped clusterinterceptors) were missing from an earlier version of this
    # list - the sink controller watches its own EventListener object and any
    # Interceptor CRs to react to config changes, and crash-loops without list/watch on
    # both ("... is forbidden ... at the cluster scope", caught live via pod logs, not
    # anticipated in review).
    resources: ["triggers", "triggerbindings", "triggertemplates", "clustertriggerbindings", "clusterinterceptors", "eventlisteners", "interceptors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdevents-broker-read-triggers
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cdevents-broker-read-triggers }
subjects:
  - kind: ServiceAccount
    name: cdevents-broker
    namespace: platform-system
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: cdevents-broker
  namespace: platform-system
spec:
  serviceAccountName: cdevents-broker
  # NamespaceSelector lives directly on EventListenerSpec, NOT nested under a
  # "triggerSelector" field - an earlier version of this file had it wrong (nested,
  # copying a shape from the old platform's OpenShift Pipelines-era manifests without
  # checking it against this project's actual current API). Confirmed against
  # tektoncd/triggers' EventListenerSpec Go type directly, not guessed - see
  # docs/chaining.md.
  namespaceSelector:
    matchNames: ["*"]
  resources:
    kubernetesResource:
      replicas: 3
      serviceType: ClusterIP
      spec:
        template:
          spec:
            containers:
              - resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { memory: 128Mi }
# Tekton Triggers auto-creates a Service named el-cdevents-broker in this namespace -
# that's the address catalog/tasks/send-cdevent.yaml's CDEVENTS_BROKER_URL points at.
