# platform/broker/manifests/app-build-cache-pvc-template.yaml
#
# TEMPLATE - one copy applied per app at onboarding (not once per tenant - see below).
# Replace <TENANT>, <APP_NAME>, and <STORAGE_SIZE> throughout.
#
# Backs build-source.yaml's build-cache volume (Phase 3 item 8.3) - a real, persistent
# PVC, not the ephemeral per-run `source` workspace every Pipeline already has.
#
# One PVC per APP, not one shared PVC per tenant: cicd.yaml's build.cache.size is a
# per-app t-shirt-size choice (small/medium/large/xlarge -> 1Gi/2.5Gi/5Gi/8Gi, same
# dictionary as the old cd-pipelines-user Helm chart's buildSpec.cacheSize - see
# docs/cicd-yaml-reference.md), and a single shared PVC can't honor two different apps
# wanting two different sizes. <STORAGE_SIZE> is the already-resolved Gi value (the
# dictionary lookup happens once, at onboarding-template-substitution time, alongside the
# existing <TENANT>/<APP_NAME>/<IMAGE_REPO> substitutions - there's no Helm/templating
# engine in this platform's tenant-resource path yet to do the lookup live, see Phase 3
# item 7's still-deferred onboarding-as-a-Helm-chart discussion).
#
# ReadWriteOnce is sufficient (and simpler than RWX, which the default kind storage class
# doesn't support anyway) since this platform's whole cluster is single-node.
#
# No live resize support: kind-observe's default `standard` StorageClass has
# allowVolumeExpansion: false (confirmed live via `kubectl get storageclass`) - changing
# build.cache.size later means deleting and recreating this PVC (losing its cached
# content, not a big deal for a cache), not a transparent resize. Worth revisiting if a
# storage class with expansion support is ever adopted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-cache-<APP_NAME>
  namespace: <TENANT>
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: <STORAGE_SIZE>
