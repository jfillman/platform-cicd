# platform/broker/manifests/tenant-triggers-template.yaml
#
# TEMPLATE - one copy of this gets applied per tenant at onboarding (hand-applied for
# Phase 1 pilots; a Crossplane Application composition renders it in Phase 3, see
# docs/onboarding.md). Replace <TENANT> and <APP_NAME> throughout. This is what makes
# the shared broker in eventlistener.yaml work for this tenant: two Trigger CRs living
# in the tenant's own namespace (auto-discovered via the broker's namespaceSelector),
# each using this tenant's own least-privilege ServiceAccount to create the next-stage
# PipelineRun - the broker itself never creates a PipelineRun with its own identity.
#
# Idempotency: PipelineRun names are deterministic (derived from the CDEvent's own id,
# which is itself deterministically derived from the emitting PipelineRun's name + event
# type - see catalog/lib/cdevents.sh). At-least-once delivery redelivering the same
# CDEvent therefore either creates the PipelineRun once or hits an AlreadyExists on
# redelivery, which Tekton Triggers treats as a non-fatal duplicate, not a second run.

---
# --- Tenant identity -------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: <TENANT>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: <TENANT>
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Deliberately absent: no `apps/deployments` rule here - there is no app Deployment
  # living in the tenant namespace itself (that's <TENANT>-<ENV>, a different
  # namespace - see tenant-env-rbac-template.yaml, applied once per environment). Also
  # deliberately absent: no impersonate, no wildcard verbs/resources, no cluster-scoped
  # rules, no other cross-namespace access. This is the entire blast radius of a
  # compromised pipeline-runner identity for this one tenant, within its own namespace.
---
# Binds the SA to its own Role above - an earlier version of this file defined the Role
# but never bound it to anything, leaving pipeline-runner with zero actual permissions
# despite the Role existing (caught live: PaC's generated PipelineRuns would have failed
# immediately on create, not in review - a Role with no RoleBinding is a no-op, easy to
# miss because `kubectl apply` doesn't warn about it).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  namespace: <TENANT>
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pipeline-runner }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: <TENANT>
---
# --- Scoped impersonation grant for the shared broker -----------------------
# Lets the broker's ServiceAccount (platform-system/cdevents-broker) create the next-
# stage PipelineRun AS this tenant's own pipeline-runner SA, and ONLY this one, and
# ONLY in this namespace. Compare to the old platform's single cluster-wide
# `impersonate` on every ServiceAccount - this is one narrow, per-tenant, auditable,
# individually-revocable grant instead. See eventlistener.yaml's RBAC note.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-broker-impersonate-pipeline-runner
  namespace: <TENANT>
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["pipeline-runner"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-broker-impersonate-pipeline-runner
  namespace: <TENANT>
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-broker-impersonate-pipeline-runner }
subjects:
  - kind: ServiceAccount
    name: cdevents-broker
    namespace: platform-system

---
# --- Stage 2: build succeeded -> fire test -----------------------------------
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: cdevents-artifact-published
  namespace: <TENANT>
spec:
  params:
    - { name: image-ref, value: "$(body.subject.content.image)" }
    - { name: git-revision, value: "$(body.subject.content.revision)" }
    - { name: chain-id, value: "$(body.context.chainId)" }
    - { name: traceparent, value: "$(body.customData.platform.traceparent)" }
    - { name: pipeline-run-name, value: "test-$(body.context.id)" }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fire-test
  namespace: <TENANT>
spec:
  params:
    - name: image-ref
    - name: git-revision
    - name: chain-id
    - name: traceparent
    - name: pipeline-run-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name) # deterministic - see idempotency note above
      spec:
        pipelineRef:
          resolver: cluster
          params:
            - { name: kind, value: pipeline }
            - { name: name, value: test }
            - { name: namespace, value: platform-catalog }
        params:
          - { name: git-url, value: "https://github.com/<TENANT>/<APP_NAME>" }
          - { name: git-revision, value: $(tt.params.git-revision) }
          - { name: image-ref, value: $(tt.params.image-ref) }
          - { name: tenant, value: <TENANT> }
          - { name: app-name, value: <APP_NAME> }
          - { name: flow-traceparent, value: $(tt.params.traceparent) }
          - { name: chain-id, value: $(tt.params.chain-id) }
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
        taskRunTemplate: { serviceAccountName: pipeline-runner }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: on-build-success
  namespace: <TENANT>
spec:
  serviceAccountName: pipeline-runner
  interceptors:
    - ref: { name: cdevents-broker-auth, kind: ClusterInterceptor }
      params: [{ name: audience, value: cdevents-broker }]
    - ref: { name: cel, kind: ClusterInterceptor }
      params:
        - name: filter
          value: >-
            body.context.type == 'dev.cdevents.artifact.published.0.3.0' &&
            extensions.tenant_namespace == '<TENANT>' &&
            body.context.source.startsWith('/platform-cicd/<TENANT>/')
  bindings:
    - { ref: cdevents-artifact-published }
  template:
    ref: fire-test

---
# --- Stage 3: test succeeded -> fire deploy ----------------------------------
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: cdevents-testcaserun-finished
  namespace: <TENANT>
spec:
  params:
    - { name: outcome, value: "$(body.subject.content.outcome)" }
    - { name: image-ref, value: "$(body.subject.content.image)" }
    - { name: git-revision, value: "$(body.subject.content.revision)" }
    - { name: chain-id, value: "$(body.context.chainId)" }
    - { name: traceparent, value: "$(body.customData.platform.traceparent)" }
    - { name: pipeline-run-name, value: "deploy-$(body.context.id)" }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fire-deploy
  namespace: <TENANT>
spec:
  params:
    - name: image-ref
    - name: git-revision
    - name: chain-id
    - name: traceparent
    - name: pipeline-run-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name)
      spec:
        pipelineRef:
          resolver: cluster
          params:
            - { name: kind, value: pipeline }
            - { name: name, value: deploy }
            - { name: namespace, value: platform-catalog }
        params:
          - { name: git-url, value: "https://github.com/<TENANT>/<APP_NAME>" }
          - { name: git-revision, value: $(tt.params.git-revision) }
          - { name: image-ref, value: $(tt.params.image-ref) }
          - { name: env, value: dev }
          - { name: tenant, value: <TENANT> }
          - { name: app-name, value: <APP_NAME> }
          - { name: flow-traceparent, value: $(tt.params.traceparent) }
          - { name: chain-id, value: $(tt.params.chain-id) }
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
        taskRunTemplate: { serviceAccountName: pipeline-runner }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: on-test-success
  namespace: <TENANT>
spec:
  serviceAccountName: pipeline-runner
  interceptors:
    - ref: { name: cdevents-broker-auth, kind: ClusterInterceptor }
      params: [{ name: audience, value: cdevents-broker }]
    - ref: { name: cel, kind: ClusterInterceptor }
      params:
        - name: filter
          value: >-
            body.context.type == 'dev.cdevents.testcaserun.finished.0.3.0' &&
            body.subject.content.outcome == 'Succeeded' &&
            extensions.tenant_namespace == '<TENANT>' &&
            body.context.source.startsWith('/platform-cicd/<TENANT>/')
  bindings:
    - { ref: cdevents-testcaserun-finished }
  template:
    ref: fire-deploy
