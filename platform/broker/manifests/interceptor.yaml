# platform/broker/manifests/interceptor.yaml
#
# Deploys the TokenReview-based interceptor (../cmd/token-review-interceptor) and
# registers it as a Tekton Triggers ClusterInterceptor named "cdevents-broker-auth".
# RBAC here is deliberately narrow: this ServiceAccount can create TokenReviews
# (cluster-scoped by necessity - that API has no namespaced form) and nothing else. It
# cannot read/write PipelineRuns, Secrets, or anything else in any tenant namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdevents-broker-auth
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdevents-broker-auth-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdevents-broker-auth-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdevents-broker-auth-tokenreview
subjects:
  - kind: ServiceAccount
    name: cdevents-broker-auth
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdevents-broker-auth
  namespace: platform-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: cdevents-broker-auth }
  template:
    metadata:
      labels: { app: cdevents-broker-auth }
    spec:
      serviceAccountName: cdevents-broker-auth
      securityContext:
        runAsNonRoot: true
        # Explicit numeric UID, matching distroless's documented UID for its "nonroot"
        # user (see cmd/token-review-interceptor/Dockerfile's USER nonroot:nonroot).
        # Without this, kubelet can't verify runAsNonRoot against a non-numeric USER
        # name in the image and refuses to start the container at all
        # (CreateContainerConfigError) - caught live, not in review.
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: interceptor
          image: ghcr.io/platform-cicd/token-review-interceptor:latest
          # IfNotPresent, not the default (Always for a `:latest` tag) - this image is
          # `kind load docker-image`-d locally on kind-observe, not actually pushed to
          # ghcr.io. Default pull policy would make kubelet ignore the loaded image and
          # try (and fail) to pull from a registry that doesn't have it - caught live as
          # ImagePullBackOff, not in review.
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8443, name: https }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tls, mountPath: /etc/interceptor/tls, readOnly: true }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
      volumes:
        - name: tls
          secret:
            # Provisioned by cert-manager (Phase 0 dependency) - see
            # ../../../docs/bootstrap.md. A Tekton Triggers ClusterInterceptor requires
            # HTTPS with a CA the Triggers controller trusts.
            secretName: cdevents-broker-auth-tls
---
apiVersion: v1
kind: Service
metadata:
  name: cdevents-broker-auth
  namespace: platform-system
spec:
  selector: { app: cdevents-broker-auth }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cdevents-broker-auth-tls
  namespace: platform-system
spec:
  secretName: cdevents-broker-auth-tls
  dnsNames:
    - cdevents-broker-auth.platform-system.svc
    - cdevents-broker-auth.platform-system.svc.cluster.local
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: ClusterInterceptor
metadata:
  name: cdevents-broker-auth
spec:
  clientConfig:
    service:
      name: cdevents-broker-auth
      namespace: platform-system
      path: /
      port: 443
    # caBundle is deliberately left empty here, not "populated by cert-manager's
    # ca-injector" as an earlier draft of this file claimed - that was wrong. cert-
    # manager's CA injector only supports MutatingWebhookConfiguration,
    # ValidatingWebhookConfiguration, CRD conversion webhooks, and APIServices; Tekton
    # Triggers' ClusterInterceptor.spec.clientConfig.caBundle isn't one of the types it
    # knows how to inject into. hack/bootstrap.sh patches this field directly after
    # cert-manager issues platform-ca-secret (see cluster-issuer.yaml) - see the
    # "patch ClusterInterceptor caBundle" step there. If you apply this file by hand
    # instead of via bootstrap.sh, you must run that patch yourself or the interceptor
    # will never be trusted by the Triggers controller.
