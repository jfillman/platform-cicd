# platform/governance/tenant-policy-config-template.yaml
#
# TEMPLATE - one copy applied per tenant at commit-signing onboarding (Phase 3 item 2,
# see docs/commit-signing.md). Replace <TENANT>, <APP_NAME> throughout.
#
# allowed-commit-signers is a plain, human-editable list of emails - not a pre-built
# regex - so onboarding/updating a tenant's allowed signers never means hand-writing
# regex syntax. catalog/tasks/verify-commit-signature.yaml builds the
# --certificate-identity-regexp gitsign needs from this list at runtime.
#
# Lives in the tenant's own namespace, not argocd or platform-system, so the PaC-
# triggered policy-check Task (already running under this tenant's own Repository CR
# context, same namespace) can read it same-namespace - no cross-namespace RBAC needed,
# matching how every other per-tenant credential/config in this platform is scoped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: <APP_NAME>-policy-config
  namespace: <TENANT>
data:
  # One email per line. Comments (#) and blank lines are ignored by the Task that reads
  # this - see verify-commit-signature.yaml.
  allowed-commit-signers: |
    # Add one email per line, e.g.:
    # dev@example.com
---
# Lets this tenant's own pipeline-runner SA read exactly this one named ConfigMap -
# pipeline-runner's existing Role (platform/broker/manifests/tenant-triggers-
# template.yaml) grants nothing on configmaps at all today, confirmed by re-reading that
# file before adding this, not assumed. resourceNames-scoped, same shape as every other
# narrowly-scoped grant in this platform (e.g. pr-token-refresher-cronjob.yaml's own
# single-Secret Role).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-policy-config-read-<APP_NAME>
  namespace: <TENANT>
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["<APP_NAME>-policy-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-policy-config-read-<APP_NAME>
  namespace: <TENANT>
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-policy-config-read-<APP_NAME> }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: <TENANT>
