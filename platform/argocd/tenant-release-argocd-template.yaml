# platform/argocd/tenant-release-argocd-template.yaml
#
# TEMPLATE - one copy applied per tenant at release-stage onboarding (same hand-applied
# pattern as tenant-triggers-template.yaml; a Crossplane composition renders both in
# Phase 3 - see docs/onboarding.md). Replace <TENANT>, <APP_NAME>, and
# <GITOPS_REPO_URL> throughout (the gitops repo URL, e.g.
# https://github.com/jfillman/gitops-nodejs-demo-app).
#
# Scoped AppProject rather than reusing the cluster's existing `default` project
# (unscoped - any Application in it can sync anything, from any source, anywhere) -
# consistent with how every other identity in this platform is narrowly scoped
# (TokenReview broker auth, per-tenant impersonation grants, read-only Tekton
# Dashboard). This tenant's Application can only ever source from its own one gitops
# repo and only ever deploy into its own one staging namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: <TENANT>
  namespace: argocd
spec:
  description: Release-stage (staging) deployments for <TENANT>, scoped to its own GitOps repo and namespace only.
  sourceRepos:
    - <GITOPS_REPO_URL>
  destinations:
    - namespace: <TENANT>-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: [] # no cluster-scoped resources - Deployment/Service only, both namespaced
  namespaceResourceWhitelist:
    - { group: "apps", kind: Deployment }
    - { group: "", kind: Service }
---
apiVersion: v1
kind: Namespace
metadata:
  name: <TENANT>-staging
---
# No pipeline-runner RBAC needed in this namespace, unlike <TENANT>-<ENV> for dev (see
# tenant-env-rbac-template.yaml) - the release Pipeline never touches the cluster
# directly for this tier, only ArgoCD's own (already cluster-capable) identity does,
# once a human has approved the GitOps PR. See docs/release.md.
#
# platform.io/dora-track: "true" - a stable, explicit marker the DORA exporter's
# informer filters on (platform/dora-exporter), so it only ever processes Applications
# that are actually part of this platform's tenant model - the argocd namespace also
# holds unrelated Applications (e.g. podinfo-demo-app) this exporter has no business
# reading. See docs/dora-metrics.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <APP_NAME>-staging
  namespace: argocd
  labels:
    platform.io/dora-track: "true"
spec:
  project: <TENANT>
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: <APP_NAME>/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: <TENANT>-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Lets this tenant's own pipeline-runner SA (mark-release-pending.yaml) stamp/clear DORA
# tracking annotations on exactly its own <APP_NAME>-staging Application - resourceNames-
# scoped, same shape as pr-token-refresher-cronjob.yaml's own narrowly-scoped Role in
# this same argocd namespace. No access to any other tenant's Application, and no access
# to anything else Application-shaped in argocd at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-dora-tracking-<APP_NAME>
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["<APP_NAME>-staging"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-dora-tracking-<APP_NAME>
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-dora-tracking-<APP_NAME> }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: <TENANT>
