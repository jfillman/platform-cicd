# platform/argocd/pr-token-refresher-cronjob.yaml
#
# TEMPLATE - one copy applied per tenant. Replace <TENANT>, <APP_NAME>, <GITHUB_OWNER>.
#
# ArgoCD's ApplicationSet pullRequest generator needs a static Secret to read a GitHub
# token from (its own controller polls independently - see
# tenant-ephemeral-envs-argocd-template.yaml's comment on this). Rather than a new
# long-lived PAT, this CronJob periodically mints a fresh, single-repo-scoped GitHub App
# installation token via the shared broker's /github-installation-token endpoint (see
# platform/broker/cmd/token-review-interceptor/github_app.go, docs/release.md) - same
# infrastructure and trust model already built for the release stage, not a new
# credential class. 20 minutes comfortably inside a GitHub App installation token's
# 1-hour lifetime.
#
# Runs as a dedicated ServiceAccount in the TENANT's own namespace (not argocd) -
# authorization for minting the token depends on the caller's own namespace owning a
# Repository CR for <APP_NAME> (see main.go's verifyTenantOwnsRepo), which only exists
# in the tenant namespace. A second, narrowly-scoped RoleBinding in argocd grants this
# same identity permission to write exactly one named Secret there - nothing else in
# argocd, consistent with "no new elevated identity" (ArgoCD's own applicationset-
# controller still does all Application/namespace creation - this identity never touches
# Applications or any other tenant's resources).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pr-env-token-refresher
  namespace: <TENANT>
---
# Lets this SA write (but not read arbitrary/list) exactly one named Secret in argocd.
# `create` can't be resourceName-scoped (the object doesn't exist yet at authorization
# time), so it's granted unscoped but still restricted to the `secrets` resource type in
# this one namespace; get/update/patch are scoped to the one Secret name by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-pr-token-refresher-<APP_NAME>
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["<APP_NAME>-pr-generator-token"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-pr-token-refresher-<APP_NAME>
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-pr-token-refresher-<APP_NAME> }
subjects:
  - kind: ServiceAccount
    name: pr-env-token-refresher
    namespace: <TENANT>
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: <APP_NAME>-pr-token-refresher
  namespace: <TENANT>
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: pr-env-token-refresher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: github-token-broker-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: github-token-broker-token
                      audience: github-installation-token
                      expirationSeconds: 600
          containers:
            - name: refresh
              image: ghcr.io/jfillman/platform-cicd-toolbox:latest
              imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: github-token-broker-token
                  mountPath: /var/run/secrets/platform
                  readOnly: true
              env:
                - name: GITHUB_TOKEN_BROKER_URL
                  value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  sa_token="$(cat /var/run/secrets/platform/github-token-broker-token)"
                  resp="$(curl --fail --silent --show-error --max-time 15 \
                    -X POST "${GITHUB_TOKEN_BROKER_URL}" \
                    -H "Authorization: Bearer ${sa_token}" \
                    -H "Content-Type: application/json" \
                    -d '{"owner":"<GITHUB_OWNER>","repo":"<APP_NAME>"}')"
                  token="$(jq -er '.token' <<<"${resp}")"
                  kubectl create secret generic <APP_NAME>-pr-generator-token \
                    -n argocd --from-literal=token="${token}" \
                    --dry-run=client -o yaml | kubectl apply -f -
