# platform/dora-exporter/manifests/servicemonitor.yaml
#
# Matches observability/kind-observe/tekton-servicemonitor.yaml's exact pattern - a
# standalone ServiceMonitor, no Helm-chart wiring needed. The existing Prometheus CR on
# kind-observe has empty serviceMonitorSelector/serviceMonitorNamespaceSelector (matches
# everything cluster-wide), confirmed live precedent via that same file's own comment -
# so this is picked up automatically. Verify this still holds if that Prometheus
# install's selectors are ever tightened.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dora-exporter
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: platform-cicd
spec:
  selector:
    matchLabels: { app: dora-exporter }
  namespaceSelector:
    matchNames: [platform-system]
  endpoints:
    - port: metrics
      interval: 30s
