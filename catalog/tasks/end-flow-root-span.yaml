# catalog/tasks/end-flow-root-span.yaml
#
# Pipeline-level wrapper around otel-span-send that closes the FLOW-ROOT span
# (covering the entire build->test->deploy->release run), not a stage span - see
# docs/tracing.md "Shape: flat, not nested". Called exactly once, from whichever
# stage is currently last in the flow's fixed chain. Phase 1's chain ends at deploy,
# so only catalog/pipelines/deploy.yaml's finally block calls this - when Phase 2
# adds a release stage after deploy, this call must move from deploy.yaml to
# release.yaml, or the flow-root span will close early (at deploy's finish time, not
# the flow's real end).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: end-flow-root-span
  labels:
    platform.io/catalog: "true"
spec:
  params:
    - name: flow-name
      type: string
    - name: flow-traceparent
      type: string
    - name: flow-start-time
      type: string
    - name: status
      type: string
      default: "Succeeded"
      description: Pass $(tasks.status) from the calling Pipeline's finally block.
  steps:
    - name: end-span
      ref:
        resolver: cluster
        params:
          - { name: kind, value: stepaction }
          - { name: name, value: otel-span-send }
          - { name: namespace, value: platform-catalog }
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      params:
        - { name: name, value: $(params.flow-name) }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: start-time, value: $(params.flow-start-time) }
        - { name: status, value: $(params.status) }
