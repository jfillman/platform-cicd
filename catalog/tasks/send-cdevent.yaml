# catalog/tasks/send-cdevent.yaml
#
# Thin wrapper Task around catalog/lib/cdevents.sh. Every Pipeline's `finally` block
# calls this once to announce stage completion to the shared broker, which is what
# drives the next stage's PipelineRun (see platform/broker/). PLATFORM_CHAIN_ID and
# PLATFORM_TRACEPARENT are passed as params, not discovered inside this Task, so a
# single flow's identifiers stay consistent across every independently-triggered
# PipelineRun in the chain.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: send-cdevent
  labels:
    platform.io/catalog: "true"
spec:
  params:
    - name: event-type
      type: string
      description: e.g. dev.cdevents.artifact.published.0.3.0
    - name: subject-content-json
      type: string
      default: "{}"
    - name: chain-id
      type: string
    - name: traceparent
      type: string
    - name: namespace
      type: string
    - name: pipeline-run-name
      type: string
  # Audience-bound projected ServiceAccount token, verified by the broker's TokenReview
  # interceptor (platform/broker/cmd/token-review-interceptor) - there is no platform-
  # minted credential anywhere in this Task. Declared here, not via any cluster-wide
  # default, because Tekton has no mechanism to auto-mount a volume into every Task's
  # containers - only the one Task that actually calls the broker needs it.
  volumes:
    - name: broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: broker-token
              audience: cdevents-broker
              expirationSeconds: 600
  steps:
    - name: send
      image: ghcr.io/platform-cicd/toolbox:latest
      imagePullPolicy: IfNotPresent  # kind-loaded locally, not actually pushed to ghcr.io
      volumeMounts:
        - name: broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: CDEVENTS_BROKER_URL
          # el-<eventlistener-name> is the Service Tekton Triggers auto-creates for the
          # EventListener in platform/broker/manifests/eventlistener.yaml.
          value: http://el-cdevents-broker.platform-system.svc.cluster.local:8080
        - name: NAMESPACE
          value: $(params.namespace)
        - name: TEKTON_PIPELINE_RUN
          value: $(params.pipeline-run-name)
        - name: PLATFORM_CHAIN_ID
          value: $(params.chain-id)
        - name: PLATFORM_TRACEPARENT
          value: $(params.traceparent)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/cdevents.sh"
        cdevent_send "$(params.event-type)" "$(params.pipeline-run-name)" '$(params.subject-content-json)'
