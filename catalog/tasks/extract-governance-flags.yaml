# catalog/tasks/extract-governance-flags.yaml
#
# Extracts the four governance toggles from cicd.yaml's `governance` block so the
# calling Pipeline can `when`-guard each stub gate individually. All four gates are
# stubs in this phase of the platform - see catalog/stepactions/governance-stub.yaml.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-governance-flags
  labels:
    platform.io/catalog: "true"
spec:
  params:
    - name: config-json
      type: string
  results:
    - name: sast
    - name: image-scan
    - name: policy-check
    - name: sbom
  steps:
    - name: extract
      image: ghcr.io/platform-cicd/toolbox:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CFG='$(params.config-json)'
        jq -r '.governance.sast // false' <<< "${CFG}" | tee "$(results.sast.path)"
        jq -r '.governance.imageScan // false' <<< "${CFG}" | tee "$(results.image-scan.path)"
        jq -r '.governance.policyCheck // false' <<< "${CFG}" | tee "$(results.policy-check.path)"
        jq -r '.governance.sbom // false' <<< "${CFG}" | tee "$(results.sbom.path)"
