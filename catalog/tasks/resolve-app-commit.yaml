# catalog/tasks/resolve-app-commit.yaml
#
# Shared by governance checks that run as PR-triggered Checks on a tenant's GITOPS repo
# but need to inspect the APP repo's own promoted commit (source code, not manifests) -
# sast-scan (Phase 3 item 8.4), and intended for reuse by image-scan (8.5)/sbom (8.7)
# once those need the same resolution.
#
# Mirrors verify-commit-signature.yaml's own trailer-extraction/narrow-fetch logic
# (Phase 3 item 2 sub-item 1) - deliberately NOT refactored to share code with that
# already-verified, security-sensitive Task. A little duplication here is a safer
# tradeoff than re-touching and re-verifying a working signature-verification path for an
# unrelated feature.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-app-commit
  labels:
    platform.io/catalog: "true"
spec:
  description: Clones a tenant's gitops-repo PR head commit, extracts the X-App-Repo/X-App-Commit trailers open-release-pr.yaml embeds, and fetches just that one app-repo commit into the `source` workspace.
  workspaces:
    - name: source
      description: Populated with the resolved app-repo commit's tree - NOT the gitops repo's own content.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's {{ repo_url }}.
    - name: revision
      type: string
      description: The gitops PR's head commit - PaC's {{ revision }}.
  results:
    - name: app-repo
    - name: app-commit
  steps:
    - name: resolve
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        workdir="$(mktemp -d)"
        git clone --quiet "${REPO_URL}" "${workdir}/gitops"
        cd "${workdir}/gitops"
        git checkout --quiet "${REVISION}"

        commit_body="$(git log -1 --format=%B)"
        app_repo="$(grep -E '^X-App-Repo: ' <<<"${commit_body}" | sed -E 's/^X-App-Repo: //')"
        app_commit="$(grep -E '^X-App-Commit: ' <<<"${commit_body}" | sed -E 's/^X-App-Commit: //')"

        if [[ -z "${app_repo}" || -z "${app_commit}" ]]; then
          echo "error: commit ${REVISION} is missing X-App-Repo/X-App-Commit trailers - cannot determine which app commit to check" >&2
          exit 1
        fi
        echo "Resolved app commit: ${app_repo}@${app_commit}"
        echo -n "${app_repo}" | tee "$(results.app-repo.path)"
        echo -n "${app_commit}" | tee "$(results.app-commit.path)"

        cd "$(workspaces.source.path)"
        # PVC-backed workspace files aren't necessarily owned by this step's own uid -
        # modern git refuses to operate on a directory it doesn't consider safely owned
        # (real error hit live: "fatal: detected dubious ownership in repository").
        # mktemp dirs (used above for the gitops clone) don't hit this since they're
        # owned by the current container user; a Tekton workspace can be written by a
        # different pod/uid, so it needs the exception explicitly.
        git config --global --add safe.directory "$(workspaces.source.path)"
        git init --quiet
        git fetch --quiet --depth 1 "${app_repo}" "${app_commit}"
        git checkout --quiet FETCH_HEAD
