# catalog/rbac/catalog-read-only.yaml
#
# Every tenant's pipeline-runner SA needs to READ Pipelines/Tasks/StepActions in
# platform-catalog via Tekton's cluster resolver (see onboarding-templates/.tekton/ and
# platform/broker/manifests/tenant-triggers-template.yaml, both of which reference
# {kind: pipeline, name: ..., namespace: platform-catalog}). Bound to the
# system:serviceaccounts group (every ServiceAccount cluster-wide) rather than granted
# per-tenant at onboarding, because the catalog holds no secrets and read access to
# Pipeline/Task/StepAction *definitions* isn't tenant-sensitive - only WRITE access to
# this namespace is restricted (nothing binds tenants write here at all).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-read-only
  namespace: platform-catalog
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks", "stepactions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-read-only
  namespace: platform-catalog
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: catalog-read-only }
subjects:
  - kind: Group
    name: system:serviceaccounts
    apiGroup: rbac.authorization.k8s.io
