# catalog/stepactions/otel-stage-span-start.yaml
#
# Starts a stage-level span (build/test/deploy/release), parented directly to the
# flow-root traceparent - NOT to the previous stage's span. Stages are siblings under
# one trace, never nested, because they don't overlap in time; nesting would make
# Tempo render misleading durations. See docs/tracing.md.
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: otel-stage-span-start
  labels:
    platform.io/catalog: "true"
spec:
  image: ghcr.io/platform-cicd/toolbox:latest
  params:
    - name: stage-name
      type: string
      description: One of build, test, deploy, release.
    - name: flow-traceparent
      type: string
      description: Root traceparent for the whole flow (from otel-flow-root-start, or carried in the triggering CDEvent for stages after the first).
    - name: chain-id
      type: string
      description: CDEvents chainId correlating this stage to the rest of the flow.
  results:
    - name: stage-traceparent
      description: traceparent of this stage's span. Thread through this stage's own Task params for step-level child spans.
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  # See otel-flow-root-start.yaml's comment - $(params.x) can't be substituted directly
  # into a StepAction's script, only passed in as positional args.
  args:
    - "$(params.stage-name)"
    - "$(params.flow-traceparent)"
    - "$(params.chain-id)"
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    source "${PLATFORM_LIB}/otel.sh"
    otel_stage_span_start "$1" "$2" "$3" \
      | tee "$(step.results.stage-traceparent.path)"
