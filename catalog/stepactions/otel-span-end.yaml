# catalog/stepactions/otel-span-end.yaml
#
# Ends the current stage/flow-root background span. Referenced from each Pipeline's
# `finally` block so a span is closed whether its stage succeeded or failed - a Task
# that starts a span MUST have a corresponding finally step that ends it, or the trace
# is left dangling in Tempo.
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: otel-span-end
  labels:
    platform.io/catalog: "true"
spec:
  image: ghcr.io/platform-cicd/toolbox:latest
  params:
    - name: status
      type: string
      description: Tekton's own aggregate status string for the stage - pass $(tasks.status) from the calling Pipeline's finally block directly, no translation needed.
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    source "${PLATFORM_LIB}/otel.sh"
    otel_span_end "$(params.status)"
