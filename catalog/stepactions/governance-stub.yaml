# catalog/stepactions/governance-stub.yaml
#
# Deliberate, structural fix for the old platform's "governance theater": that system
# had gates (QA, gatekeeper, image-scan-check, SAST-check) that were `exit 0` one-liners
# reported to developers with the same visual confidence as the gates that actually ran.
#
# This platform makes stub-ness a first-class, machine-readable fact instead of hiding
# it in a script body: every stubbed governance gate MUST call this StepAction, which
# emits its own real child span (parented to the current stage span) carrying
# governance.stub=true as a span attribute. Grafana's pipeline-detail dashboard renders
# any span carrying this attribute as visually distinct (grey/hatched) from real results
# - see observability/grafana/dashboards/pipeline-detail.json. When a real implementation
# lands for a gate (Phase 3), delete the call to this StepAction from that Task; nothing
# else about the Pipeline shape needs to change.
#
# This used to attach the governance.stub fact as an OTel span *event* on the (then
# background-daemon) stage span, via otel_mark_governance_stub. That daemon was
# unreachable from this StepAction's own Pod (see otel.sh's file header) - the event
# never landed anywhere, and even if it had, TraceQL's `name =` matches spans, not span
# events, so pipeline-detail.json's governance panel could never have found it either
# way. A real, standalone child span (otel_child_span) fixes both problems at once.
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: governance-stub
  labels:
    platform.io/catalog: "true"
spec:
  image: ghcr.io/platform-cicd/toolbox:latest
  params:
    - name: gate-name
      type: string
      description: e.g. sast, image-scan, policy-check, sbom.
    - name: flow-traceparent
      type: string
      description: Root traceparent for the whole flow - gives this span its trace id.
    - name: stage-span-id
      type: string
      description: The current stage's own span id (from otel_stage_span_begin) - this stub's span is parented to it.
  results:
    - name: outcome
      description: Always "stub" in this phase of the platform - never "passed"/"failed", which would misrepresent a stub as a real enforcement result.
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  # See otel-flow-root-start.yaml's comment - $(params.x) can't be substituted directly
  # into a StepAction's script, only passed in as positional args.
  args:
    - "$(params.gate-name)"
    - "$(params.flow-traceparent)"
    - "$(params.stage-span-id)"
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    source "${PLATFORM_LIB}/otel.sh"
    echo "[governance-stub] gate=$1 - no real check implemented yet, see docs/governance-stubs.md" >&2
    otel_child_span "governance:$1" "$2" "$3" "governance.gate=$1,governance.stub=true" -- true
    echo -n "stub" | tee "$(step.results.outcome.path)"
