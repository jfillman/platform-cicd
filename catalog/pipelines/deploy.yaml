# catalog/pipelines/deploy.yaml
#
# Third stage of the Phase 1 flow. Fired by the shared broker on the test Pipeline's
# dev.cdevents.testcaserun.finished (outcome=success) event. Phase 1 scope deploys to a
# single lower environment (dev) via direct kubectl - see the note in
# catalog/tasks/deploy-manifests.yaml about why upper-environment GitOps-PR promotion is
# explicitly deferred to a later phase rather than half-built here.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy
  labels:
    platform.io/catalog: "true"
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: image-ref
      type: string
    - name: env
      type: string
      default: dev
    - name: tenant
      type: string
    - name: app-name
      type: string
    - name: flow-traceparent
      type: string
    - name: chain-id
      type: string
  workspaces:
    - name: source
  tasks:
    - name: clone-repo
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: tekton }
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: version, value: "0.9" }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }

    - name: validate-config
      runAfter: [clone-repo]
      taskRef: { name: validate-cicd-config }
      workspaces:
        - { name: source, workspace: source }

    - name: start-deploy-stage-span
      runAfter: [validate-config]
      taskRef: { name: start-stage-span }
      params:
        - { name: stage-name, value: deploy }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: chain-id, value: $(params.chain-id) }

    - name: extract-governance-flags
      runAfter: [validate-config]
      taskRef: { name: extract-governance-flags }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }

    - name: policy-check
      runAfter: [extract-governance-flags]
      when:
        - { input: $(tasks.extract-governance-flags.results.policy-check), operator: in, values: ["true"] }
      taskRef: { name: governance-gate-stub }
      params: [{ name: gate-name, value: policy-check }]

    - name: deploy
      runAfter: [policy-check, start-deploy-stage-span]
      taskRef: { name: deploy-manifests }
      params:
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: tenant, value: $(params.tenant) }
        - { name: app-name, value: $(params.app-name) }

  finally:
    - name: end-deploy-stage-span
      taskRef: { name: end-stage-span }
      params: [{ name: status, value: $(tasks.status) }]

    - name: notify
      taskRef: { name: notify-slack }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: stage-name, value: deploy }
        - { name: status, value: $(tasks.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tenant, value: $(params.tenant) }

    - name: send-cdevent
      when:
        - { input: $(tasks.status), operator: in, values: ["Succeeded", "Completed"] }
      taskRef: { name: send-cdevent }
      params:
        - { name: event-type, value: "dev.cdevents.service.deployed.0.3.0" }
        - name: subject-content-json
          value: >-
            {"environment": {"id": "$(params.env)"}, "artifactId": "$(params.image-ref)"}
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
