# catalog/pipelines/build.yaml
#
# First stage of every flow. Always a fresh flow root - build is the only stage
# triggered directly by a git event (via Pipelines-as-Code); every later stage is
# triggered by a CDEvent this stage's `finally` block emits. See docs/tracing.md and
# docs/chaining.md. Referenced from each app's onboarding-generated .tekton/*.yaml via
# Tekton's cluster resolver - app repos never contain a copy of this Pipeline.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build
  labels:
    platform.io/catalog: "true"
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: image-repo
      type: string
    - name: tenant
      type: string
    - name: app-name
      type: string
  workspaces:
    - name: source
  # Pipeline-level IMAGE_URL/IMAGE_DIGEST results - Tekton Chains' own "type hinting"
  # convention for identifying which image a PipelineRun's provenance/signature belongs
  # to (confirmed live: without these, Chains logs "No image subject to attest ...
  # Skipping upload to registry" and silently produces no OCI signature at all, despite
  # otherwise reporting chains.tekton.dev/signed: "true" - a real, non-obvious gap this
  # surfaced, not a hypothetical). IMAGE_URL is the bare repo name (no tag - confirmed
  # against Tekton's own docs example); must be $(tasks.*.results.*), not $(params.*) -
  # Tekton's admission webhook rejects a Pipeline result whose value is a plain param
  # reference, so build-image.yaml grew a trivial new `image-repo` result just to give
  # this a task-result expression to point at. IMAGE_DIGEST is build-image's own
  # already-`sha256:`-prefixed result - see docs/image-signing.md.
  results:
    - name: IMAGE_URL
      value: $(tasks.build-image.results.image-repo)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.image-digest)
  tasks:
    - name: clone-repo
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: git-clone }
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: version, value: "1.7.0" }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }

    - name: validate-config
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: validate-cicd-config }
          - { name: namespace, value: platform-catalog }
      workspaces:
        - { name: source, workspace: source }

    - name: start-flow
      runAfter: [validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-flow-root-span }
          - { name: namespace, value: platform-catalog }

    - name: start-build-stage-span
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }

    # Deeper CDEvents coverage (Phase 3 item 1, see docs/chaining.md): a generic
    # pipelinerun.started signal, independent of build's own domain-specific
    # artifact.published event below. Fires here, not earlier, because build is the flow
    # root - chain-id/traceparent don't exist until start-flow generates them, unlike
    # test/deploy/release where they already arrive as incoming params. This means
    # build's pipelinerun.started fires a few tasks later than the other three stages' -
    # a documented, accepted asymmetry, not an oversight.
    - name: pipelinerun-started
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"build\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    - name: resolve-agent-image
      runAfter: [validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-build-agent-image }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }

    - name: extract-governance-flags
      runAfter: [validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-governance-flags }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }

    - name: unit-test
      runAfter: [resolve-agent-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: run-tests }
          - { name: namespace, value: platform-catalog }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: agent-image, value: $(tasks.resolve-agent-image.results.agent-image) }

    - name: build-image
      runAfter: [unit-test, start-build-stage-span]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: build-image }
          - { name: namespace, value: platform-catalog }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: agent-image, value: $(tasks.resolve-agent-image.results.agent-image) }

    - name: sast-scan
      runAfter: [build-image]
      when:
        - { input: $(tasks.extract-governance-flags.results.sast), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: governance-gate-stub }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: gate-name, value: sast }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

    - name: image-scan
      runAfter: [build-image]
      when:
        - { input: $(tasks.extract-governance-flags.results.image-scan), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: governance-gate-stub }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: gate-name, value: image-scan }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

    - name: generate-sbom
      runAfter: [build-image]
      when:
        - { input: $(tasks.extract-governance-flags.results.sbom), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: governance-gate-stub }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: gate-name, value: sbom }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: stage-span-id, value: $(tasks.start-build-stage-span.results.span-id) }

  finally:
    - name: end-build-stage-span
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-stage-span }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: stage-name, value: build }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: span-id, value: $(tasks.start-build-stage-span.results.span-id) }
        - { name: start-time, value: $(tasks.start-build-stage-span.results.start-time) }
        - { name: status, value: $(tasks.status) }

    - name: notify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: notify-slack }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: stage-name, value: build }
        - { name: status, value: $(tasks.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tenant, value: $(params.tenant) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: image-repo, value: $(params.image-repo) }

    - name: send-cdevent
      when:
        - { input: $(tasks.status), operator: in, values: ["Succeeded", "Completed"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: event-type, value: "dev.cdevents.artifact.published.0.3.0" }
        - { name: subject-type, value: "artifact" }
        - { name: subject-content-json, value: "{\"image\": \"$(tasks.build-image.results.image-ref)\", \"revision\": \"$(params.git-revision)\", \"git-url\": \"$(params.git-url)\", \"env\": \"dev\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # Deeper CDEvents coverage (Phase 3 item 1) - generic completion signal, deliberately
    # NOT gated on success like the domain-specific event above: "the pipeline finished"
    # is true whether it succeeded or failed, and a uniform completion signal that only
    # reports success isn't a uniform signal at all. See docs/chaining.md.
    - name: pipelinerun-finished
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.finished.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"build\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tekton-status, value: $(tasks.status) }
