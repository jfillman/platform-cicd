# catalog/pipelines/sast-check.yaml
#
# Real (not stub) SAST governance check - Phase 3 item 8.4, redesigned into a shift-left
# shape after a real, user-caught redundancy: this originally re-ran Semgrep against the
# promoted commit's source at release time, duplicating work build.yaml's own sast-scan
# Task already did (and already gated the build on - Phase 3 item 8.4's DAG fix makes
# build-image wait on it). The commit's source never changes, so a re-scan could only
# ever reproduce the same result at real cost (both wall-clock time and Semgrep's own
# registry-fetch overhead), not catch anything new the way image-scan-check.yaml's
# re-scan legitimately can (vulnerability databases update continuously; source code at
# a fixed commit does not).
#
# Now resolves the promoted image (same mechanism image-scan-check.yaml uses - both need
# "which image is this PR promoting", just do different things with it) and looks up
# whether that image's own SLSA provenance attestation shows sast-scan passed at build
# time - a real, cryptographically-verified fact, not a re-run. See
# verify-sast-attestation.yaml's own header for the full design and the
# not-configured-means-pass handling for tenants with governance.sast: false.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sast-check
  labels:
    platform.io/catalog: "true"
spec:
  description: Resolves the promoted image from a gitops PR's staging manifest, then verifies sast-scan's real, attested build-time outcome for it.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
  tasks:
    - name: extract-promoted-image
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-promoted-image }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: verify-sast-attestation
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-sast-attestation }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }
