# catalog/pipelines/policy-check.yaml
#
# Minimal single-task Pipeline wrapping verify-commit-signature.yaml (Phase 3 item 2,
# docs/commit-signing.md) - the real (not stub) policy-check gate. Referenced from a
# tenant's GitOps repo's own .tekton/pull-request-policy-check.yaml, matching the exact
# structural shape governance-check.yaml already established for the three still-stub
# gates (sast/image-scan/sbom) - one Check per file, dedicated Pipeline per real gate,
# not a shared do-everything Pipeline.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: policy-check
  labels:
    platform.io/catalog: "true"
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: tenant
      type: string
    - name: app-name
      type: string
  tasks:
    - name: verify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-commit-signature }
          - { name: namespace, value: platform-catalog }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: tenant, value: $(params.tenant) }
        - { name: app-name, value: $(params.app-name) }
