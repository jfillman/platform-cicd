# hack/kind-config.yaml
#
# NOT used by hack/bootstrap.sh, which targets the existing shared kind-observe cluster
# instead. Kept for standing up a dedicated, isolated cluster: disables kind's default
# CNI (kindnet doesn't enforce NetworkPolicy) so Calico can be installed instead - a
# hard prerequisite if this platform's NetworkPolicy layer should actually do anything.
# See docs/admin/installation.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-cicd
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
