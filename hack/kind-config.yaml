# hack/kind-config.yaml
#
# NOT USED by hack/bootstrap.sh, which targets the existing shared kind-observe cluster
# instead - see docs/bootstrap.md "Why kind-observe, not a fresh cluster". Kept as the
# config for standing up a dedicated, isolated cluster if you ever want one instead of
# sharing kind-observe: disables kind's default CNI (kindnet does NOT enforce
# NetworkPolicy) so Calico can be installed in its place - a hard prerequisite for a
# from-scratch cluster if you want this platform's NetworkPolicy defense-in-depth layer
# to actually do anything (see docs/bootstrap.md's NetworkPolicy gap note for why
# kind-observe itself doesn't have this).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-cicd
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
