# hack/values-kind-dev.yaml
#
# Per-cluster overrides for charts/platform-cicd-control-plane, wired in by
# hack/bootstrap.sh via VALUES_FILE when installing the kind-dev instance
# (CONTEXT=kind-dev KIND_CLUSTER_NAME=dev VALUES_FILE=hack/values-kind-dev.yaml
# ./hack/bootstrap.sh). See charts/platform-cicd-control-plane/values.yaml's own
# fulcio/tenantsRepoUrl comments for why these specifically can't be hardcoded in the
# chart templates the way the rest of this platform's config is.
#
# fulcio.issuerCACert: kind-dev's own kube-root-ca.crt "ca.crt" content, read live
# 2026-08-15 (`kubectl --context kind-dev get configmap kube-root-ca.crt -n default -o
# jsonpath='{.data.ca\.crt}'`). NOT kind-observe's - confirmed live the two differ.
#
# fulcio.rootCert: the public half of a freshly, independently generated Fulcio root CA
# for kind-dev (openssl req -x509 -newkey ed25519, docs/image-signing.md's documented
# procedure) - deliberately not a copy of kind-observe's trust root. The matching
# private key + passphrase were used only to create the fulcio-secret and
# fulcio-server-config Secrets directly on kind-dev (kubectl create secret) and were
# never written to this repo or persisted anywhere else.
#
# tenantsRepoUrl: a new, dedicated, empty-to-start repo
# (https://github.com/jfillman/platform-cicd-kind-dev-tenants) - NOT platform-cicd's own
# tenants/ directory, which kind-observe's instance still reads and which already holds
# real, live tenants (nodejs-demo-app, cicd-flow-test-app) that must not get onboarded
