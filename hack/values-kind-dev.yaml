# clusterName (2026-08-16): derives tenantsRepoUrl
# (https://github.com/jfillman/platform-cicd-kind-dev-tenants.git) and
# tenantOnboardingApplicationSetName (platform-cicd-tenant-onboarding, the collision-safe
# name - see that ApplicationSet's own header comment) automatically - see
# charts/platform-cicd-control-plane/values.yaml's own comments. Replaces what used to be
# two separately hand-typed fields here; confirmed via a helm template diff that this
# produces byte-identical output to the explicit fields it replaces.
clusterName: kind-dev

# See charts/platform-cicd-control-plane/templates/broker/interceptor.yaml's own header
# comment - a truly fresh cluster needs hack/bootstrap.sh's --create-namespace instead of
# the chart's own Namespace resource, since Helm can't reconcile both for the same
# namespace.
selfManageNamespace: false

# tektonChainsNamespace (2026-08-16): kind-dev runs Tekton via tektoncd/operator
# (gitops-cluster-dev/50-platform-cicd/tekton-operator/), which installs every component
# (Pipelines/Triggers/Chains/Dashboard/PaC) into ONE targetNamespace rather than each
# component's own conventional namespace - real, confirmed live against a throwaway
# operator install, not assumed. tekton-pipelines here must match that TektonConfig's own
# spec.targetNamespace exactly, or verify-image-provenance.yaml/verify-sast-attestation.yaml's
# cosign identity-regexp check (security-critical - verifies the signature really came
# from the real Chains controller) would fail every real build.
tektonChainsNamespace: tekton-pipelines
