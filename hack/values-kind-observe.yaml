# hack/values-kind-observe.yaml
#
# kind-observe's own historical values, made explicit 2026-08-16 when
# charts/platform-cicd-control-plane/values.yaml stopped hardcoding
# tenantsRepoUrl/tenantOnboardingApplicationSetName as chart-wide literal defaults in
# favor of deriving them from clusterName for any NEW cluster (see that file's own
# comments). kind-observe predates that convention and is the one deliberate exception:
# rather than relying on derivation happening to reproduce its current values, its
# historical values are pinned here explicitly, byte-identical to before this change -
# confirmed via a helm template diff against the pre-change chart. Auto-discovered by
# hack/bootstrap.sh (no VALUES_FILE flag needed) whenever CONTEXT=kind-observe, its
# default - a plain `./hack/bootstrap.sh` is unchanged by this file existing.
tenantsRepoUrl: https://github.com/jfillman/platform-cicd.git
tenantOnboardingApplicationSetName: tenant-onboarding
