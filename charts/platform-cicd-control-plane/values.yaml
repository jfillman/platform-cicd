# charts/platform-cicd-control-plane/values.yaml

# The shared toolbox image every hook Job / bash-based Task in this platform uses -
# kept as one value here (rather than hardcoded per-file) so a version bump is a single
# values change, matching how catalog/toolbox/Dockerfile is already versioned separately
# from the code that consumes it.
toolboxImage: ghcr.io/jfillman/platform-cicd-toolbox:latest

# Overlay onto Tekton Chains' own `chains-config` ConfigMap (installed empty by default -
# confirmed live, nothing to clobber) - applied via `kubectl patch --type merge` by
# templates/hooks/chains-config-patch-job.yaml, not `kubectl apply` replacing the whole
# object, matching this platform's existing patch-not-replace convention for
# third-party-owned config.
#
# signers.x509.fulcio.address/issuer values are cluster-specific, confirmed live against
# the real fulcio-server Service and its own real /api/v2/configuration response - not
# copied from any example. See templates/sigstore/fulcio-config.yaml for why the issuer
# has the ".cluster.local" suffix.
#
# signers.x509.identity.token.file points at /var/run/sigstore/cosign/oidc-token -
# Tekton Chains' controller Deployment already ships a projected ServiceAccount token
# volume at exactly this path with audience "sigstore" out of the box - no patch needed
# to add it.
#
# artifacts.pipelinerun.storage is "oci" (provenance attached to the produced image in
# the registry, standard cosign/SLSA convention) - confirmed live the seemingly-simpler
# "tekton" (annotations on the object itself) breaks: a real PipelineRun's full in-toto/
# SLSA payload exceeded Kubernetes' hard 256KiB total-annotations cap.
#
# artifacts.taskrun.storage is deliberately EMPTY (disabled) - Chains' per-TaskRun OCI
# artifact processing scans every TaskRun's own step container images, and this
# platform's shared toolbox image is kind-loaded only, never pushed to a real registry,
# so its "image ID" has no registry name component to combine with a digest - every
# TaskRun using it failed signing otherwise. We only ever consume PIPELINE-level
# provenance, so disabling this removes a whole buggy, unused path.
#
# transparency.enabled: "false" is load-bearing, not a placeholder - Chains' own default
# transparency.url is the PUBLIC rekor.sigstore.dev; leaving this unset would mean this
# Fulcio-only setup (Rekor/Trillian/MySQL deliberately deferred) silently attempts to
# upload every signature to the public transparency log. See docs/image-signing.md.
chains:
  configPatch:
    signers.x509.fulcio.enabled: "true"
    signers.x509.fulcio.address: "http://fulcio-server.fulcio-system.svc"
    signers.x509.fulcio.issuer: "https://kubernetes.default.svc.cluster.local"
    signers.x509.fulcio.provider: "filesystem"
    signers.x509.identity.token.file: "/var/run/sigstore/cosign/oidc-token"
    artifacts.taskrun.storage: ""
    artifacts.pipelinerun.storage: "oci"
    artifacts.oci.storage: "oci"
    transparency.enabled: "false"

# Phase 3 item 7: External Secrets Operator is platform infrastructure, not just a
# bootstrap-time install - every chart in this platform should consume secret material
# via ExternalSecret, not a hand-applied raw Secret, wherever a real backend can back it.
# ESO itself has zero configured backends today. This ClusterSecretStore is the
# pragmatic bridge: ESO's own built-in `kubernetes` provider, pointed at one dedicated,
# narrowly-RBAC'd namespace the user alone writes real Secrets into via
# `kubectl create secret` exactly as today (no chat-pasted credentials, no change to
# that existing convention) - every ExternalSecret elsewhere just mirrors/syncs from
# there. Deliberately not a real external vault; the actual backend (Vault, a cloud
# secrets manager, or eventually community Infisical once Dream IDP exists) is a future,
# separately-decided swap - this only needs to change here, in one values file, not in
# every chart that consumes an ExternalSecret.
secretStore:
  name: platform-secret-store
  kind: ClusterSecretStore
  sourceNamespace: platform-secrets

# Per-Application secret stores (docs/app-secrets.md) - a DIFFERENT mechanism from
# secretStore above, not another entry in it: an Application's own secrets (Slack
# webhook, SAST creds, ...) come from that ONE Application's own backend, not the
# platform-wide shared namespace registry-credentials uses, so each needs its own
# ClusterSecretStore with its own remoteNamespace. ClusterSecretStore is cluster-scoped
# (no `spec.kubernetes.remoteNamespace` templating possible at the app-chart level the
# way a namespaced SecretStore would allow), so these are rendered HERE, once per
# Application, from this list - not by the per-Application app chart itself.
#
# remoteNamespace is always <type>-<appName>-dev - reusing the Application's own
# existing dev environment namespace as its secret backend (no new namespace
# convention), per the user's explicit direction. Each list entry becomes one
# ClusterSecretStore named "<type>-<appName>-secret-store" -
# charts/platform-cicd-app/templates/secrets/app-secrets-external-secret.yaml computes
# and references that exact same name, so adding an app here and installing that app's
# own chart with a matching `secrets:` list in its cicd.yaml are the only two steps
# needed - no name to keep in sync by hand beyond type+appName, which both charts
# already require anyway.
#
# Empty by default - adding an Application here (and re-running `helm upgrade` on this
# chart) is a deliberate, manual, one-time-per-Application step, matching this
# platform's existing "manual by design" secrets philosophy above (populating
# platform-secrets is exactly as manual).
appSecretStores: []
