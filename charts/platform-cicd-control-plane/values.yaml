# charts/platform-cicd-control-plane/values.yaml

# The shared toolbox image every hook Job / bash-based Task in this platform uses -
# kept as one value here (rather than hardcoded per-file) so a version bump is a single
# values change, matching how catalog/toolbox/Dockerfile is already versioned separately
# from the code that consumes it.
toolboxImage: ghcr.io/jfillman/platform-cicd-toolbox:latest

# See templates/broker/interceptor.yaml's own header comment on its Namespace resource
# for the full reasoning (2026-08-15) - true keeps kind-observe's existing, already-
# working behavior unchanged.
selfManageNamespace: true

# Real registry-published image, same reasoning as toolboxImage above - see
# templates/dora-exporter/deployment.yaml's own comment for the gap this closes
# (2026-08-15).
doraExporterImage: ghcr.io/jfillman/platform-cicd-dora-exporter:latest

# This platform's own repo - the tenant-onboarding ApplicationSet (templates/argocd/
# tenant-onboarding-applicationset.yaml) reads tenants/*.yaml from here (its generator
# source) AND renders the platform-cicd-app chart straight from here at main HEAD.
#
# .github/workflows/app-chart-ci.yaml's `publish` job also pushes that same chart to
# ghcr.io/jfillman/charts/platform-cicd-app on every push - real, working, verified
# live - but the ApplicationSet doesn't pull from there (yet): ArgoCD's semver-range
# targetRevision resolution genuinely doesn't work against OCI Helm sources (confirmed
# live, argoproj/argo-cd#9528 - not a config mistake). See that ApplicationSet's own
# header for the full story and why this is folded into the already-flagged
# proper-release-workflow follow-up instead of worked around here.
platformCicdRepoUrl: https://github.com/jfillman/platform-cicd.git

# Cluster-agnostic derivation input (2026-08-16, feedback_cluster_agnostic_idp memory):
# tenantsRepoUrl/tenantOnboardingApplicationSetName below are DERIVED from this by
# convention for any cluster that doesn't explicitly override them - see
# templates/argocd/tenant-onboarding-applicationset.yaml's own header for the exact
# `default` expressions. Set this to the cluster's own name (e.g. "kind-dev") for any
# NEW cluster instead of hand-typing both derived fields separately.
#
# kind-observe deliberately does NOT set this - it predates the convention and keeps
# its own historical, explicitly-overridden values (hack/values-kind-observe.yaml) as
# literal strings instead, so it's provably zero-behavior-change rather than relying on
# derivation happening to produce the same output.
clusterName: ""

# Which repo/path the tenant-onboarding ApplicationSet's generator scans for
# tenants/*/identity.yaml (templates/argocd/tenant-onboarding-applicationset.yaml) and
# which templates/argocd/onboarding-appproject.yaml allowlists as a sourceRepo.
# Deliberately separate from platformCicdRepoUrl above (2026-08-15, installing a second
# instance of this chart on kind-dev): that value also drives the SAME ApplicationSet's
# chart-source repoURL, which legitimately should stay this platform's one shared repo
# on every cluster this chart is installed on - but the tenant LIST must not, or a
# second cluster's install would onboard the first cluster's real, live tenants too.
#
# Empty by default (2026-08-16) - derived from clusterName above
# (https://github.com/jfillman/platform-cicd-<clusterName>-tenants.git) unless
# explicitly set here, which is what every cluster except kind-observe should now rely
# on rather than hand-typing this URL per cluster.
tenantsRepoUrl: ""

# See templates/argocd/tenant-onboarding-applicationset.yaml's own header comment for
# the real name collision this guards against and why it's a value, not an in-place
# rename (2026-08-15).
#
# Empty by default (2026-08-16) - derived as "platform-cicd-tenant-onboarding" unless
# explicitly set here. kind-observe is the one deliberate exception, explicitly
# overridden to the original bare "tenant-onboarding" so it needs zero cutover, ever,
# for this fix (see hack/values-kind-observe.yaml) - every other cluster gets the
# collision-safe name automatically now, not by remembering to type it.
tenantOnboardingApplicationSetName: ""

