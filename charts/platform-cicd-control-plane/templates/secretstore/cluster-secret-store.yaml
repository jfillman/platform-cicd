# templates/secretstore/cluster-secret-store.yaml (docs/admin/secrets-management.md)
#
# External Secrets Operator is platform infrastructure. ESO's built-in `kubernetes`
# provider mirrors real Secrets from one dedicated, narrowly-RBAC'd namespace
# (secretStore.sourceNamespace) that the user alone writes to via `kubectl create
# secret`. Store name/kind are values so swapping the actual backend later (Vault, a
# cloud secrets manager, eventually Infisical) is a one-file change, not a rewrite of
# every chart that consumes a secret.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.secretStore.sourceNamespace }}
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "secretstore"
    platform.io/purpose: eso-kubernetes-provider-source
---
# ClusterSecretStore needs read (get/list/watch) on Secrets in its source namespace -
# granted to ESO's own controller SA, not a new identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "secretstore"
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.secretStore.sourceNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .Values.secretStore.sourceNamespace }}
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
