# templates/secretstore/cluster-secret-store.yaml (Phase 3 item 7 - see
# docs/secrets-management.md)
#
# External Secrets Operator is platform infrastructure - see the rationale in this
# chart's values.yaml. ESO's own built-in `kubernetes` provider mirrors real Secrets
# from one dedicated, narrowly-RBAC'd namespace (Values.secretStore.sourceNamespace) -
# the user alone writes real Secret material there via `kubectl create secret`, exactly
# as every credential in this platform already works today. Every ExternalSecret
# elsewhere in this platform (control-plane or app chart) references this store by
# name/kind, both exposed as values so swapping the actual backend later (Vault, a cloud
# secrets manager, eventually community Infisical once Dream IDP exists) is a values
# change in this one file, not a rewrite of every chart that consumes a secret.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.secretStore.sourceNamespace }}
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "secretstore"
    platform.io/purpose: eso-kubernetes-provider-source
---
# The kubernetes-provider ClusterSecretStore needs read (get/list/watch) on Secrets in
# its source namespace, granted to ESO's own controller ServiceAccount - not a new
# identity, ESO already runs with a ClusterRole for exactly this pattern across
# whichever namespaces a SecretStore/ClusterSecretStore names. Scoped by namespace via
# the store's own `spec.kubernetes.remoteNamespace`, not cluster-wide.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "secretstore"
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.secretStore.sourceNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .Values.secretStore.sourceNamespace }}
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
