# templates/secretstore/app-secret-stores.yaml - see docs/app-secrets.md and values.yaml
# (appSecretStores) for the full rationale.
#
# One ClusterSecretStore per Application in .Values.appSecretStores - real per-app
# isolation now comes from a secretsPath scoped to that Application inside the control
# plane's OWN Infisical project (infisical-project.yaml/cluster-secret-store.yaml's
# platform-cicd-kind-dev), not from treating that Application's own <type>-<appName>-dev
# namespace as its secret backend (the old kubernetes-provider mechanism this replaced -
# real per-app Secrets no longer need to be hand-created in a namespace that's
# otherwise CI/deploy infrastructure, not a vault). Deliberately NOT a reference to
# idp-service-catalog's own per-(app,cluster) SecretStore XRD project for this same
# app: that would couple an app's CI secrets (Slack webhook, SAST token) to it having
# already been onboarded through idp's NodeJSApplication XR, which isn't true for
# every platform-cicd tenant today. Same hostAPI/auth/project as the platform-wide
# store, just a narrower secretsScope.secretsPath.
#
# Name formula (<type>-<appName>-secret-store) MUST match what platform-cicd-app's
# app-secrets-external-secret.yaml computes independently - the two charts are separate
# Helm releases with no shared _helpers.tpl, so this is a convention both sides compute
# from the same inputs, not a value passed between them. Unchanged from before this
# backend swap.
{{- range .Values.appSecretStores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .type }}-{{ .appName }}-secret-store
  labels:
    {{- include "platform-cicd-control-plane.labels" $ | nindent 4 }}
    platform.io/subcomponent: "secretstore"
    platform.io/app: {{ .appName }}
spec:
  provider:
    infisical:
      hostAPI: {{ $.Values.secretStore.infisical.hostAPI | quote }}
      auth:
        kubernetesAuthCredentials:
          identityId:
            name: {{ $.Values.secretStore.infisical.credentialsSecretName }}
            namespace: platform-system
            key: identityId
      secretsScope:
        projectSlug: {{ $.Values.secretStore.infisical.projectSlug }}
        environmentSlug: shared
        secretsPath: {{ printf "/%s/%s/" .type .appName }}
{{- end }}
