# templates/secretstore/app-secret-stores.yaml - see docs/app-secrets.md and this
# chart's own values.yaml (appSecretStores) for the full rationale.
#
# One ClusterSecretStore per Application listed in .Values.appSecretStores, each
# pointed at that Application's own <type>-<appName>-dev namespace - a real Kubernetes
# Secret living there (created by hand, same "manual by design" convention as
# platform-secrets - see docs/secrets-management.md) is that Application's backend
# secret store, per the user's explicit direction to reuse the existing dev namespace
# rather than invent a new one.
#
# Same kubernetes-provider shape as the platform-wide ClusterSecretStore
# (templates/secretstore/cluster-secret-store.yaml) - caProvider + serviceAccount auth,
# ESO's own documented same-cluster pattern, not invented here. No new RBAC: ESO's own
# installed ClusterRole (external-secrets-controller) already grants get/list/watch on
# Secrets with no namespace restriction (confirmed live via `kubectl get clusterrole
# external-secrets-controller -o yaml`) - a new remoteNamespace per entry costs nothing
# extra.
#
# Name formula (<type>-<appName>-secret-store) MUST match what
# charts/platform-cicd-app/templates/secrets/app-secrets-external-secret.yaml computes
# independently in the app chart - the two charts are separate Helm releases with no
# shared _helpers.tpl, so this is a convention both sides compute from the same
# type+appName inputs, not a value passed between them.
{{- range .Values.appSecretStores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .type }}-{{ .appName }}-secret-store
  labels:
    {{- include "platform-cicd-control-plane.labels" $ | nindent 4 }}
    platform.io/subcomponent: "secretstore"
    platform.io/app: {{ .appName }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .type }}-{{ .appName }}-dev
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .type }}-{{ .appName }}-dev
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
{{- end }}
