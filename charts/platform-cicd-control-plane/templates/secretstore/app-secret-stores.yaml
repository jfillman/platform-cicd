# templates/secretstore/app-secret-stores.yaml - see docs/app-secrets.md and values.yaml
# (appSecretStores) for the full rationale.
#
# One ClusterSecretStore per Application in .Values.appSecretStores, pointed at that
# Application's own <type>-<appName>-dev namespace - a real Secret created there by hand
# (docs/admin/secrets-management.md convention) is that Application's backend secret
# store, per the user's direction to reuse the existing dev namespace.
#
# Same kubernetes-provider shape as the platform-wide ClusterSecretStore. No new RBAC
# needed - ESO's own installed ClusterRole already grants get/list/watch on Secrets
# cluster-wide.
#
# Name formula (<type>-<appName>-secret-store) MUST match what platform-cicd-app's
# app-secrets-external-secret.yaml computes independently - the two charts are separate
# Helm releases with no shared _helpers.tpl, so this is a convention both sides compute
# from the same inputs, not a value passed between them.
{{- range .Values.appSecretStores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .type }}-{{ .appName }}-secret-store
  labels:
    {{- include "platform-cicd-control-plane.labels" $ | nindent 4 }}
    platform.io/subcomponent: "secretstore"
    platform.io/app: {{ .appName }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .type }}-{{ .appName }}-dev
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .type }}-{{ .appName }}-dev
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
{{- end }}
