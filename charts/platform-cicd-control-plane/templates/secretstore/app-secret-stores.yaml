# templates/secretstore/app-secret-stores.yaml - see docs/app-secrets.md and values.yaml
# (appSecretStores) for the full rationale.
#
# One ClusterSecretStore per Application in .Values.appSecretStores - a real, DIFFERENT
# Infisical project from the platform-wide platform-cicd-kind-dev one
# (infisical-project.yaml/cluster-secret-store.yaml): every secret an Application
# declares via cicd.yaml's `secrets:` is that Application's OWN - app owners already
# manage it in their own idp-service-catalog-provisioned Infisical project
# (`<appName>-<devClusterName>`, the exact same project/environment
# idp-application's own external-secret.yaml/notify-external-secret.yaml read from -
# not a platform-cicd-owned copy, and never scoped under platform-cicd's own project by
# secretsPath the way an earlier pass here got wrong. 2026-08-19: corrected after
# shipping with the wrong project (platform-cicd-kind-dev, path-scoped) - a real
# design mistake, not a style choice; app secrets were never platform-cicd's to own.
#
# auth/hostAPI/projectSlug below mirror the app's OWN idp-provisioned InfisicalProject
# CR exactly (confirmed live against a real one, e.g. checkout-api's own
# checkout-api-kind-dev ClusterSecretStore) - credentialsSecretName
# (<appName>-<devClusterName>-infisical-creds) and its namespace
# (<type>-<appName>-cicd, the Application's own CI namespace - where idp's
# NodeJSApplication XR-requests mechanism lands the SecretStore XR's credentials
# Secret on the dev cluster) are BOTH computed, not looked up - this store has no
# ExtraResources-style live reference back to idp's own object, it just has to derive
# the same deterministic names idp's own Composition already does. If an Application
# hasn't been onboarded through idp's NodeJSApplication XR yet, that project/identity
# doesn't exist yet either - this store (and any secrets: entry using it) simply stays
# not-ready until it has, the same graceful-degrade shape every other "not configured
# yet" case in this platform already tolerates.
#
# Name formula (<type>-<appName>-secret-store) MUST match what platform-cicd-app's
# app-secrets-external-secret.yaml computes independently - the two charts are separate
# Helm releases with no shared _helpers.tpl, so this is a convention both sides compute
# from the same inputs, not a value passed between them. Unchanged from before this
# backend swap - this object's NAME is a stable platform-cicd convention even though
# what it now points at is entirely idp-owned.
{{- range .Values.appSecretStores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .type }}-{{ .appName }}-secret-store
  labels:
    {{- include "platform-cicd-control-plane.labels" $ | nindent 4 }}
    platform.io/subcomponent: "secretstore"
    platform.io/app: {{ .appName }}
spec:
  provider:
    infisical:
      hostAPI: {{ $.Values.secretStore.infisical.hostAPI | quote }}
      auth:
        kubernetesAuthCredentials:
          identityId:
            name: {{ printf "%s-%s-infisical-creds" .appName $.Values.devClusterName }}
            namespace: {{ printf "%s-%s-cicd" .type .appName }}
            key: identityId
      secretsScope:
        projectSlug: {{ printf "%s-%s" .appName $.Values.devClusterName }}
        environmentSlug: shared
        secretsPath: "/"
{{- end }}
