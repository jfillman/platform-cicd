# templates/secretstore/registry-credentials-cluster-external-secret.yaml
#
# Disseminates the shared GHCR pull credential to every namespace this platform manages,
# automatically - replaces two separate per-app opt-in ExternalSecret templates
# (platform-cicd-app's own identity/registry-credentials-external-secret.yaml, and
# idp-application's optional workload/registry-credentials-external-secret.yaml, both
# deleted) with ONE ClusterExternalSecret rendered here.
#
# Namespace selection is by label (ClusterExternalSecret has no namespace-name-pattern
# mode), not by <type>-<appName>-<suffix> naming - platform.io/managed-secrets: "true"
# is applied by ArgoCD's own managedNamespaceMetadata on every namespace this platform
# creates (see templates/argocd/tenant-onboarding-applicationset.yaml's own
# syncPolicy, and idp-service-catalog's mirrored tenant-onboarding ApplicationSets on
# every cluster) - re-applied on every sync, so it lands on already-existing
# namespaces too, not just newly-created ones.
#
# externalSecretName/refreshTime are ClusterExternalSecret's own fields (distinct from
# the generated ExternalSecret's own spec below it) - confirmed against ESO's real
# ClusterExternalSecret CRD schema (external-secrets/application.yaml's vendored
# reference), not guessed.
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: registry-credentials
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "secretstore"
spec:
  externalSecretName: registry-credentials
  namespaceSelectors:
    - matchLabels:
        platform.io/managed-secrets: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.secretStore.name }}
      kind: {{ .Values.secretStore.kind }}
    target:
      name: registry-credentials
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: registry-credentials-dockerconfigjson
