# platform/broker/manifests/interceptor.yaml
#
# Deploys the TokenReview-based interceptor, registered as ClusterInterceptor
# "cdevents-broker-auth". RBAC is narrow: create TokenReviews (cluster-scoped by
# necessity), and read-only list/get on PaC Repository CRs (to check a caller owns the
# gitops repo it's requesting a GitHub token for, since this service also mints scoped
# GitHub App installation tokens for release - see docs/release.md). No access to
# PipelineRuns/Secrets/Repository writes in any Application namespace.
#
# github-app-creds is a copy of pipelines-as-code-secret's two fields, needed because
# Secrets are namespace-scoped and this pod lives in platform-system. Create it by hand
# (never paste key material through chat):
#   kubectl get secret pipelines-as-code-secret -n pipelines-as-code -o json \
#     | jq '{apiVersion, kind, type, data: {"github-application-id": .data["github-application-id"], "github-private-key": .data["github-private-key"]}, metadata: {name: "github-app-creds", namespace: "platform-system"}}' \
#     | kubectl apply -f -
#
# Plain HTTP, not HTTPS: a cert-manager self-signed-CA cert (Tekton's usual pattern) was
# tried and hit a hard wall getting the CA into the sink pod's trust store (blocked by
# the EventListener CRD's admission webhook). TokenReview-verified caller identity is the
# real trust boundary regardless - see docs/admin/chaining.md.
{{- if .Values.selfManageNamespace }}
# Real conflict: Helm's --create-namespace (or ArgoCD's CreateNamespace=true
# syncOption) and this chart's own Namespace resource for the SAME namespace are
# mutually exclusive in Helm v3.21.3 - --create-namespace produces a namespace with no
# Helm release-tracking metadata, which this resource then can't import.
# selfManageNamespace defaults true (Helm-owned); a cluster whose ArgoCD Application
# already sets CreateNamespace=true should set it false instead.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdevents-broker-auth-tokenreview
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["pipelinesascode.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdevents-broker-auth-tokenreview
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdevents-broker-auth-tokenreview
subjects:
  - kind: ServiceAccount
    name: cdevents-broker-auth
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: cdevents-broker-auth }
  template:
    metadata:
      labels: { app: cdevents-broker-auth }
    spec:
      serviceAccountName: cdevents-broker-auth
      securityContext:
        runAsNonRoot: true
        # Explicit numeric UID matching distroless's "nonroot" user - kubelet can't
        # verify runAsNonRoot against a non-numeric USER name and refuses to start the
        # container otherwise.
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: interceptor
          image: ghcr.io/jfillman/platform-cicd-token-review-interceptor:latest
          # Public image on ghcr.io, not kind-loaded. Previously referenced a
          # nonexistent ghcr.io/platform-cicd org and only ran via a stale kind-loaded
          # image.
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTP }
          volumeMounts:
            - name: github-app-creds
              mountPath: /etc/github-app
              readOnly: true
      volumes:
        - name: github-app-creds
          secret:
            secretName: github-app-creds
---
apiVersion: v1
kind: Service
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
spec:
  selector: { app: cdevents-broker-auth }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: ClusterInterceptor
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
spec:
  clientConfig:
    service:
      name: cdevents-broker-auth
      namespace: platform-system
      path: /
      port: 8080
