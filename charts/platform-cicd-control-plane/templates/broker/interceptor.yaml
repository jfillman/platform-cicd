# platform/broker/manifests/interceptor.yaml
#
# Deploys the TokenReview-based interceptor (../cmd/token-review-interceptor) and
# registers it as a Tekton Triggers ClusterInterceptor named "cdevents-broker-auth".
# RBAC here is deliberately narrow: this ServiceAccount can create TokenReviews
# (cluster-scoped by necessity - that API has no namespaced form), and - since this
# service also mints scoped GitHub App installation tokens for the release stage, see
# docs/release.md - list/get PaC Repository CRs cluster-wide (read-only, used only to
# check a caller's own Application namespace actually owns the gitops repo it's asking a
# token for). It cannot read/write PipelineRuns, Secrets, or anything else in any
# Application's namespace, and cannot write Repository CRs either.
#
# github-app-creds (github-application-id/github-private-key) is a COPY of the same two
# fields already in pipelines-as-code-secret (pipelines-as-code namespace) - Kubernetes
# Secrets are namespace-scoped, so this Pod (platform-system) can't mount that Secret
# directly. Create the copy yourself (never pastes the actual key material through this
# chat - see docs/release.md):
#   kubectl get secret pipelines-as-code-secret -n pipelines-as-code -o json \
#     | jq '{apiVersion, kind, type, data: {"github-application-id": .data["github-application-id"], "github-private-key": .data["github-private-key"]}, metadata: {name: "github-app-creds", namespace: "platform-system"}}' \
#     | kubectl apply -f -
#
# Plain HTTP, not HTTPS - see the header comment in
# ../cmd/token-review-interceptor/main.go for why this isn't an oversight: a
# cert-manager-issued self-signed-CA certificate here (the standard pattern, matching
# how Tekton's own built-in ClusterInterceptors are configured) was tried and
# extensively debugged live against a real cluster - confirmed the CA genuinely issued
# the serving cert, ruled out stale caching, ruled out creation-vs-patch timing, and hit
# a hard wall trying to get the CA into the sink pod's own trust store (blocked by the
# EventListener CRD's admission webhook, then silently reverted when patched directly
# onto the generated Deployment). TokenReview-verified caller identity remains the real
# trust boundary here regardless - see docs/chaining.md.
{{- if .Values.selfManageNamespace }}
# Real conflict found live 2026-08-15 (first true from-scratch install of this chart, on
# kind-dev): Helm's --create-namespace flag and a chart's own self-declared Namespace
# resource for that SAME namespace are mutually exclusive in this Helm version (v3.21.3)
# - --create-namespace produces a namespace with zero Helm release-tracking metadata,
# which this resource then can't "import" ("exists and cannot be imported... missing key
# app.kubernetes.io/managed-by"). kind-observe's platform-system is already cleanly
# owned by THIS resource (confirmed live) from whenever it first bootstrapped
# successfully - selfManageNamespace defaults true so that stays exactly as-is. kind-dev
# (and any future from-scratch install) sets it false and relies on hack/bootstrap.sh's
# --create-namespace flag instead (a safe no-op if the namespace already exists, per
# Helm's own docs - unconditionally added there, not gated on this value).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdevents-broker-auth-tokenreview
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["pipelinesascode.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdevents-broker-auth-tokenreview
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdevents-broker-auth-tokenreview
subjects:
  - kind: ServiceAccount
    name: cdevents-broker-auth
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: cdevents-broker-auth }
  template:
    metadata:
      labels: { app: cdevents-broker-auth }
    spec:
      serviceAccountName: cdevents-broker-auth
      securityContext:
        runAsNonRoot: true
        # Explicit numeric UID, matching distroless's documented UID for its "nonroot"
        # user (see cmd/token-review-interceptor/Dockerfile's USER nonroot:nonroot).
        # Without this, kubelet can't verify runAsNonRoot against a non-numeric USER
        # name in the image and refuses to start the container at all
        # (CreateContainerConfigError) - caught live, not in review.
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: interceptor
          image: ghcr.io/jfillman/platform-cicd-token-review-interceptor:latest
          # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh
          # 4/6. Real fix 2026-08-16: this used to reference ghcr.io/platform-cicd/... -
          # that org doesn't exist (confirmed live, `docker pull` -> "manifest unknown"),
          # so it was never actually pushable; only ever ran via kind-loaded images.
          # IfNotPresent kept regardless - same convention as every other
          # registry-published image in this chart (toolboxImage, doraExporterImage).
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTP }
          volumeMounts:
            - name: github-app-creds
              mountPath: /etc/github-app
              readOnly: true
      volumes:
        - name: github-app-creds
          secret:
            secretName: github-app-creds
---
apiVersion: v1
kind: Service
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
  namespace: platform-system
spec:
  selector: { app: cdevents-broker-auth }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: ClusterInterceptor
metadata:
  name: cdevents-broker-auth
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "broker"
spec:
  clientConfig:
    service:
      name: cdevents-broker-auth
      namespace: platform-system
      path: /
      port: 8080
