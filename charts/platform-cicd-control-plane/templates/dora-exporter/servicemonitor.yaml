# platform/dora-exporter/manifests/servicemonitor.yaml
#
# Standalone ServiceMonitor - kind-observe's Prometheus CR has empty
# serviceMonitorSelector/serviceMonitorNamespaceSelector (matches everything
# cluster-wide, see observability/kind-observe/tekton-servicemonitor.yaml), so this is
# picked up with no extra wiring. Revisit if that Prometheus install's selectors are
# ever tightened.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dora-exporter
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "dora-exporter"
  namespace: platform-system
spec:
  selector:
    matchLabels: { app: dora-exporter }
  namespaceSelector:
    matchNames: [platform-system]
  endpoints:
    - port: metrics
      interval: 30s
