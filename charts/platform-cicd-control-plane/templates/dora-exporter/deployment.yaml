# platform/dora-exporter/manifests/deployment.yaml
#
# Deploys the DORA exporter (../cmd/dora-exporter) - a plain metrics-serving Deployment,
# not registered as anything Tekton-specific (unlike token-review-interceptor's
# ClusterInterceptor registration), since it only watches ArgoCD Applications and serves
# /metrics for Prometheus to scrape. See docs/dora-metrics.md.
#
# 1 replica, not 2 like cdevents-broker-auth - this is a metrics accumulator with
# acceptable-loss in-memory state on restart (a brief gap in coverage while it re-syncs
# its informer cache, not incorrect data - Add events replay every currently-matching
# Application on startup, see main.go), not a request-serving path on the critical
# chaining path that needs HA the way the broker's own interceptor does.
#
# RBAC is a namespaced Role, not a ClusterRole - genuinely narrower than every other
# cluster-scoped component in this platform (stalled-pipeline-detector, the TTL sweep),
# because every Application this exporter ever needs to read lives in the single argocd
# namespace, regardless of which Application it belongs to. get/list/watch to observe
# status; patch is the one
# deliberate widening beyond read-only, to clear its own platform.io/dora-* tracking
# annotations once it's reacted to them - Kubernetes RBAC can't scope patch down to
# "annotations only", so this identity can technically modify any field on any
# Application in argocd, narrowed by namespace and resource type, not by field. Same
# honest framing already applied to the stalled-pipeline detector's own patch grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dora-exporter
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "dora-exporter"
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dora-exporter
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "dora-exporter"
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dora-exporter
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "dora-exporter"
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dora-exporter }
subjects:
  - kind: ServiceAccount
    name: dora-exporter
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-exporter
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "dora-exporter"
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: dora-exporter }
  template:
    metadata:
      labels: { app: dora-exporter }
    spec:
      serviceAccountName: dora-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # distroless "nonroot" user's documented numeric UID - see cmd/dora-exporter/Dockerfile
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: exporter
          image: ghcr.io/platform-cicd/dora-exporter:latest
          imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6 - see token-review-interceptor's identical note
          ports: [{ containerPort: 8080, name: metrics }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics, scheme: HTTP }
---
apiVersion: v1
kind: Service
metadata:
  name: dora-exporter
  # ServiceMonitor's selector.matchLabels matches against THIS Service's own
  # metadata.labels, not spec.selector (which only selects the pods it fronts) - caught
  # live via Prometheus's own /api/v1/status/config: the generated scrape job's first
  # relabel_configs rule keeps only targets where
  # __meta_kubernetes_service_label_app=dora-exporter, sourced from here. Without this,
  # every real target got silently dropped despite matching on every other criterion.
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "dora-exporter"
    app: dora-exporter
  namespace: platform-system
spec:
  selector: { app: dora-exporter }
  ports: [{ name: metrics, port: 8080, targetPort: metrics }]
