# platform/sigstore/fulcio-root-configmap.yaml
#
# Public half of fulcio-secret, split out deliberately: fulcio-secret holds cert.pem AND
# key.pem together, and RBAC can't scope access to one key within a Secret - granting
# any Application `get` on fulcio-secret would hand them the private signing key too.
# This ConfigMap holds only the public cert (already discoverable via Fulcio's own
# /api/v2/configuration), so it's safe to expose broadly.
#
# Consumed by verify-image-provenance.yaml as the --ca-roots trust anchor for cosign
# verify/verify-attestation (docs/provenance-policy.md).
#
# Templated from .Values.fulcio.rootCert - the public half of whatever fulcio-secret was
# generated with. Genuinely cluster-specific: each cluster gets its own independently
# generated root CA (docs/image-signing.md), never copied from another cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulcio-root-ca
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "sigstore"
  namespace: platform-catalog
data:
  cert.pem: |
    {{- .Values.fulcio.rootCert | trim | nindent 4 }}
---
# Broad but narrowly-scoped by resourceName: this ConfigMap holds genuinely public data,
# so granting read to every ServiceAccount cluster-wide (rather than enumerating each
# Application) is a reasonable trade.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-fulcio-root-ca-read
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "sigstore"
  namespace: platform-catalog
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["fulcio-root-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-fulcio-root-ca-read
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "sigstore"
  namespace: platform-catalog
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-fulcio-root-ca-read }
subjects:
  - kind: Group
    name: system:serviceaccounts
    apiGroup: rbac.authorization.k8s.io
