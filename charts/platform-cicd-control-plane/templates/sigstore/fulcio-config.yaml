# platform/sigstore/fulcio-config.yaml
#
# Non-sensitive half of Fulcio's config: a `type: kubernetes` OIDC issuer letting Fulcio
# validate a Kubernetes-projected SA token directly against this cluster's API server
# (TokenReview-style, no SPIFFE/SPIRE, no public exposure - matches sigstore/fulcio's own
# verify-k8s.yml CI test, including the config.yaml/server.yaml file split).
#
# issuer-url must exactly match signers.x509.fulcio.issuer in Tekton Chains' chains-config
# or Chains' identity token gets rejected (docs/image-signing.md). It's the LONGER
# "https://kubernetes.default.svc.cluster.local" form, not upstream's shorter example -
# this cluster's OIDC discovery returns that form, and Go's OIDC client requires an exact
# match. Re-verify if repointing at a different cluster.
#
# ca-cert must be set explicitly (this cluster's kube-root-ca.crt): Fulcio's
# auto-trust-cluster-CA shortcut only applies when the issuer key is the *exact* literal
# "https://kubernetes.default.svc" - our issuer key is the longer form above, so the
# shortcut doesn't fire and this is the documented escape hatch instead.
#
# Templated from .Values.fulcio.issuerCACert - genuinely cluster-specific, differs per
# cluster (the issuer-url string itself does not - every cluster's OIDC discovery returns
# the same .cluster.local form).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulcio-config
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "sigstore"
  namespace: fulcio-system
data:
  config.yaml: |
    oidc-issuers:
      https://kubernetes.default.svc.cluster.local:
        issuer-url: "https://kubernetes.default.svc.cluster.local"
        client-id: "sigstore"
        type: "kubernetes"
        ca-cert: |
          {{- required "fulcio.issuerCACert must be set - see hack/generate-cluster-values.sh (docs/admin/installation.md)" .Values.fulcio.issuerCACert | trim | nindent 10 }}
        # kube-root-ca.crt content as of implementation time - needs refreshing if the
        # cluster's serving CA is ever rotated (accepted maintenance burden of inlining).
