# platform/sigstore/fulcio-deployment.yaml
#
# Self-hosted Fulcio (Phase 3 item 2, sub-item 2 - see docs/image-signing.md). Deliberately
# a plain Deployment/Service, not Knative (sigstore-scaffolding's own "getting started"
# path deploys Fulcio as a Knative Service behind Kourier ingress - built for external test
# clients authenticating like a human/CI job, not our case: every caller here is in-cluster
# and reaches Fulcio via plain Service DNS). Shape matches Fulcio's own real
# config/deployment.yaml almost exactly (confirmed live from the upstream repo, not
# reconstructed from memory), with two deliberate deviations:
#
# - replicas: 1, resources trimmed to 100Mi/50m (matching Fulcio's own CI test's exact
#   reduction from its production defaults of 3 replicas / 1G / 0.5 CPU each - this is a
#   single-organization dev/test platform, not a target for that kind of HA footprint,
#   and the cluster is already memory-constrained - see the plan's Concrete-pieces
#   section).
# - Service type ClusterIP, not LoadBalancer - kind-observe has no LoadBalancer
#   controller (confirmed, an already-documented gap elsewhere in this platform), and
#   nothing outside the cluster needs to reach Fulcio anyway.
#
# The FULCIO_SERVE_GCP_PRIVATE_CA_PARENT env var / "private-ca" ConfigMap in upstream's
# manifest is googleca-specific plumbing, irrelevant to the fileca backend used here -
# deliberately omitted, not an oversight.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fulcio-system
  name: fulcio-server
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "sigstore"
    app: fulcio-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulcio-server
  template:
    metadata:
      labels:
        app: fulcio-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "2112"
    spec:
      containers:
        - name: fulcio-server
          image: ghcr.io/sigstore/fulcio:v1.8.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5555
            - containerPort: 5554
            - containerPort: 2112 # metrics
          args: ["serve", "-c", "/etc/fulcio-config/server.yaml"]
          volumeMounts:
            - name: fulcio-config
              mountPath: /etc/fulcio-config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: fulcio-server-config
              mountPath: /etc/fulcio-config/server.yaml
              subPath: server.yaml
              readOnly: true
            - name: fulcio-secret
              mountPath: /etc/fulcio-secret
              readOnly: true
            - name: oidc-info
              mountPath: /var/run/fulcio
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5555
            initialDelaySeconds: 5
          readinessProbe:
            grpc:
              port: 5554
            initialDelaySeconds: 5
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65533
            capabilities:
              drop: ["all"]
      volumes:
        - name: fulcio-config
          configMap:
            name: fulcio-config
        - name: fulcio-server-config
          secret:
            secretName: fulcio-server-config
        - name: fulcio-secret
          secret:
            secretName: fulcio-secret
        # Lets Fulcio trust this cluster's own API server TLS cert when it validates a
        # `type: kubernetes` token against it - kube-root-ca.crt is a well-known
        # ConfigMap Kubernetes auto-populates in every namespace, not something this
        # platform creates itself. Matches Fulcio's own upstream manifest exactly.
        - name: oidc-info
          projected:
            sources:
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
                      mode: 0666
---
apiVersion: v1
kind: Service
metadata:
  namespace: fulcio-system
  name: fulcio-server
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "sigstore"
spec:
  selector:
    app: fulcio-server
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5555
    - name: grpc
      protocol: TCP
      port: 5554
      targetPort: 5554
