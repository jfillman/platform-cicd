# templates/argocd/tenant-onboarding-applicationset.yaml
#
# Replaces the manual `helm upgrade --install <type>-<app-name>-cicd
# charts/platform-cicd-app -f cicd.yaml -f platform-identity.yaml` onboarding step
# (docs/onboarding.md) with ArgoCD ownership. Lives in this chart, not
# charts/platform-cicd-app itself - a chart can't define the ApplicationSet that
# generates its own Application.
#
# IMPORTANT for future editors: this file's `template:` block uses ArgoCD
# ApplicationSet's OWN Go-template syntax (goTemplate: true - `.platformIdentity.*`
# etc, resolved by ArgoCD at generate-time), which collides with Helm's own Go-template
# engine (this file is rendered by Helm first, at install/upgrade time) - same collision
# charts/platform-cicd-app/templates/argocd/ephemeral-envs.yaml already documents and
# solves. Every ArgoCD template expression below is escaped as a literal
# double-curly-brace string for Helm to emit verbatim, for ArgoCD to evaluate later - do
# not "simplify" these.
#
# Generator scans tenants/*/identity.yaml only - one Application per tenant, driven
# purely by that operator-owned file (see tenants/cicd-flow-test-app/identity.yaml's own
# header for the full per-tenant layout and why identity.yaml stays a tracked file here
# rather than anything read from the app repo).
#
# Source 0 pulls the chart from an OCI registry (GHCR), not this git repo directly -
# .github/workflows/app-chart-ci.yaml's `publish` job pushes a new OCI artifact on
# every push to main that touches the chart, and platformChartVersionConstraint
# (values.yaml - ">=0.0.0-0", NOT a bare "*", see that value's own comment for the live
# test proving "*" genuinely fails to match a pre-release-tagged version) auto-tracks
# whichever was published most recently, no manual re-pin needed here. Deliberately
# lightweight/ungated for now (2026-08-11) at the user's explicit direction, moving
# quickly while still in development - a proper versioned/tested/promoted release
# workflow for all three of this platform's own charts is flagged as a follow-up, not
# built here. Chart versions are published as `<Chart.yaml version>-<shortsha>` - a
# hyphen pre-release, not `+build` metadata, deliberately: OCI tags can't contain `+`
# (Helm rewrites it to `_` on push), and older ArgoCD versions don't reverse that
# rewrite before wildcard-matching, breaking auto-tracking silently (a real, confirmed
# ArgoCD bug, argoproj/argo-cd#14097 - avoided by construction, not assumed fixed on
# whatever ArgoCD version ends up running this).
#
# `cicd.yaml` IS read live from the tenant's own app repo (source 1, $ref'd), a
# deliberate, revisited decision - see identity.yaml's header for the full history: an
# earlier version of this file used a tracked copy in tenants/<app>/cicd.yaml instead,
# specifically to avoid ArgoCD needing standing read access to every app repo. That
# tradeoff was reconsidered once the user's broader IDP direction made that access a
# given anyway (a planned self-service folder in each app repo for developer-authored
# Crossplane XRs/CRs, synced by ArgoCD separately - out of scope here, but it means "does
# ArgoCD read this repo" stops being a meaningfully avoidable question). Safety of
# merging a developer-controlled values file into the SAME Application that also carries
# platformIdentity was verified LIVE, not assumed: a real attempt to override
# platformIdentity via a `platformIdentity:` block planted in the values-file input was
# synced and had zero effect on the rendered resources - `helm.valuesObject` (source 0,
# built ONLY from source 0's own generator params, spelled out field-by-field - Go's
# text/template has no built-in YAML-safe serialization for a nested map dropped
# straight into a YAML value position) takes precedence over `helm.valueFiles` (source
# 1's cicd.yaml) for any overlapping key, confirmed by direct inspection of the live
# cluster state, not just a `helm template` diff. `directory: {exclude: "*"}` on source 1
# still matters just as much as it did with the tracked-copy design - without it, every
# *.yaml in the app repo's root (including a future self-service CRD folder, once that
# exists) would be auto-detected and applied as raw manifests by THIS Application, which
# should only ever read cicd.yaml as a values file. That folder needs its own,
# separately-scoped sync path when it's built, not a side effect of this one.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-onboarding
  labels:
    {{- include "platform-cicd-control-plane.labels" . | nindent 4 }}
    platform.io/subcomponent: "argocd"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: {{ .Values.platformCicdRepoUrl }}
        revision: main
        files:
          - path: "tenants/*/identity.yaml"
  template:
    metadata:
      name: "{{ "{{" }}.platformIdentity.appName{{ "}}" }}-cicd"
      labels:
        {{- include "platform-cicd-control-plane.labels" . | nindent 8 }}
        platform.io/subcomponent: "argocd"
      # Cascade-deletes the chart's own resources (RBAC, Triggers, etc.) if a tenant's
      # tenants/*/identity.yaml file is ever removed - same finalizer, same reasoning as
      # ephemeral-envs.yaml's own use of it.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd
    spec:
      project: platform-onboarding
      sources:
        - repoURL: {{ .Values.platformChartOciRepo }}
          chart: {{ .Values.platformChartName }}
          targetRevision: {{ .Values.platformChartVersionConstraint | quote }}
          helm:
            valuesObject:
              platformIdentity:
                appName: "{{ "{{" }}.platformIdentity.appName{{ "}}" }}"
                type: "{{ "{{" }}.platformIdentity.type{{ "}}" }}"
                gitopsRepoUrl: "{{ "{{" }}.platformIdentity.gitopsRepoUrl{{ "}}" }}"
                appRepoUrl: "{{ "{{" }}.platformIdentity.appRepoUrl{{ "}}" }}"
                githubOwner: "{{ "{{" }}.platformIdentity.githubOwner{{ "}}" }}"
                catalogNamespace: "{{ "{{" }}.platformIdentity.catalogNamespace{{ "}}" }}"
            valueFiles:
              # $-ref value files resolve relative to that source's checkout ROOT (the
              # app repo's own root, confirmed live) - cicd.yaml always lives there per
              # docs/user-guide/quickstart.md's own onboarding instructions.
              - $appsrc/cicd.yaml
        - repoURL: "{{ "{{" }}.platformIdentity.appRepoUrl{{ "}}" }}"
          targetRevision: main
          ref: appsrc
          # Without this, ArgoCD's default "directory" source-type auto-detection
          # treats every *.yaml file in this repo as a raw manifest to apply directly -
          # confirmed live in the tracked-copy version of this design: cicd.yaml's own
          # `apiVersion: platform/v1, kind: PipelineConfig` header got synced as if it
          # were a real (nonexistent) CRD instance. This source exists ONLY to be $ref'd
          # for valueFiles above - it should never independently apply anything, doubly
          # true now that it's the tenant's own app repo, which may one day carry a
          # real, separately-synced self-service CRD folder.
          directory:
            exclude: "*"
      destination:
        server: https://kubernetes.default.svc
        # Same convention as charts/platform-cicd-app/templates/_helpers.tpl's own
        # platform-cicd-app.namespace helper (<type>-<appName>-cicd) - can't call that
        # helper from this chart directly (different Helm release/scope), so replicated
        # here. docs/onboarding.md deliberately has no separate tenantNamespace field to
        # keep in sync for exactly this reason - this is the one place besides that
        # helper itself that computes it, and both must agree.
        namespace: "{{ "{{" }}.platformIdentity.type{{ "}}" }}-{{ "{{" }}.platformIdentity.appName{{ "}}" }}-cicd"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
