# charts/platform-cicd-app/values.yaml
#
# Real installs merge three sources, later wins on key collision:
#   helm install <app-name> charts/platform-cicd-app \
#     -f <this file> -f <app-repo>/cicd.yaml -f platform-identity.yaml
#
# platform-identity.yaml supplies platformIdentity: below. It's not authoritative because
# it's loaded last - it's authoritative because `platformIdentity` isn't a key
# schemas/cicd.schema.json permits, so validate-cicd-config's additionalProperties:false
# check rejects any cicd.yaml that tries to define it.
#
# Non-platformIdentity defaults below mirror schemas/cicd.schema.json's own defaults, so
# `helm template`/`helm lint` work standalone without a real cicd.yaml (see
# docs/catalog-versioning.md's fixture-matrix testing).

build:
  agent: nodejs-20
  unitTest:
    enabled: true
  sonar: false
  cache:
    enabled: false
    size: small
  sourceVolume:
    size: small

test:
  enabled: true

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: false
  ttl: 5d

governance:
  sast: false
  imageScan: false
  policyCheck: false
  sbom: false
  allowedCommitSigners: []

notifications:
  slack:
    enabled: false

onboarding:
  sync:
    enabled: true

# Optional named pipeline flows. Each entry defines a root trigger plus an ordered list
# of stages (build -> deploy -> test -> release) without hand-writing Tekton YAML.
#
# Example explicit trigger shape:
# pipelines:
#   ci:
#     trigger:
#       source: git
#       event: push
#       branch: main
#       filePathPattern:
#         - "src/**"
#     steps:
#       - stage: build
#       - stage: deploy
#         env: dev
#
pipelines: {}

# Stage presence is derived from `.Values.pipelines`; the older top-level `pipeline:`
# array is no longer used.

# Optional. Each entry pulls one key out of this Application's own backend secret store
# into an ExternalSecret-synced app-secrets Kubernetes Secret (see docs/app-secrets.md).
# Empty by default - the SecretStore/ExternalSecret templates only render when non-empty.
secrets: []

# Backend secret store location: a Kubernetes Secret in this Application's own dev
# namespace (<type>-<app-name>-dev). The ClusterSecretStore pointed at that namespace is
# rendered by the control-plane chart, not this one - this value only names the backend
# Secret object this chart's ExternalSecret reads from. See docs/app-secrets.md.
appSecretStore:
  secretName: app-secrets    # the one backend Secret in <type>-<app-name>-dev, holding every key any cicd.yaml declares under secrets:

# Platform-wide constants every Application install shares (not per-app identity, so
# kept outside platformIdentity).
toolboxImage: ghcr.io/jfillman/platform-cicd-toolbox:latest

# Must match charts/platform-cicd-control-plane/values.yaml's secretStore.name/kind -
# ClusterSecretStore is cluster-scoped, so this is a cross-chart reference by name. See
# docs/secrets-management.md.
secretStore:
  name: platform-secret-store
  kind: ClusterSecretStore

# Placeholder only - a real install MUST override every field here via
# `-f platform-identity.yaml`. Left empty rather than a fake example so an accidental
# install without that file fails loudly instead of deploying to a plausible-looking
# wrong place. catalogNamespace may be overridden alone, e.g. for a canary Application
# pointed at platform-catalog-canary (docs/catalog-versioning.md).
#
# No `tenantNamespace` field - the Application's namespace is always computed from
# type+appName via _helpers.tpl's namespace/envNamespace helpers, so it can't drift from
# the <type>-<app-name>-<env> convention.
platformIdentity:
  appName: ""
  type: app
  gitopsRepoUrl: ""
  appRepoUrl: ""
  githubOwner: ""
  catalogNamespace: platform-catalog
  # Renders templates/pipelines-as-code/repository.yaml's Repository CR(s). Defaults true;
  # set false to deregister a repo without the chart recreating the CR on next sync.
  registerPipelinesAsCode: true
