# charts/platform-cicd-app/values.yaml
#
# Real installs merge THREE sources, in this order (later wins on any key collision):
#   helm install <app-name> charts/platform-cicd-app \
#     -f <this file, the chart's own defaults - always loaded first> \
#     -f <app-repo>/cicd.yaml \
#     -f platform-identity.yaml
#
# platform-identity.yaml goes LAST and supplies the platformIdentity: key below -
# putting it last isn't what makes it authoritative (see docs/onboarding.md's security
# note: the real guarantee is that `platformIdentity` is not a key schemas/cicd.schema.json
# permits, so validate-cicd-config's existing additionalProperties:false check already
# rejects any cicd.yaml that tries to define it, independent of -f ordering).
#
# The values below (except the platformIdentity stub) mirror schemas/cicd.schema.json's
# own defaults - kept here too, not just in the schema, so `helm template`/`helm lint`
# work standalone against this chart without requiring a real cicd.yaml, matching the
# fixture-matrix testing approach in docs/catalog-versioning.md.

build:
  agent: nodejs-20
  unitTest:
    enabled: true
  sonar: false
  cache:
    enabled: false
    size: small
  sourceVolume:
    size: small

test:
  enabled: true

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: false
  ttl: 5d

governance:
  sast: false
  imageScan: false
  policyCheck: false
  sbom: false
  allowedCommitSigners: []

notifications:
  slack:
    enabled: false

onboarding:
  sync:
    enabled: true

# Optional named pipeline flows. Each entry can define a root trigger plus an ordered
# list of stages. This is a draft rendering model for app-owned sequential flows such as
# build -> deploy -> test -> release without hand-writing Tekton YAML.
#
# Example explicit trigger shape:
# pipelines:
#   ci:
#     trigger:
#       source: git
#       event: push
#       branch: main
#       filePathPattern:
#         - "src/**"
#     steps:
#       - stage: build
#       - stage: deploy
#         env: dev
#
pipelines: {}

# Stage presence is derived from `.Values.pipelines` flow definitions. The older
# top-level `pipeline:` array is no longer used by the chart.

# Optional. Each entry pulls one key out of this Application's own backend secret store
# into an ExternalSecret-synced app-secrets Kubernetes Secret. See
# docs/app-secrets.md and appSecretStore below (which says WHERE that backend store is
# assumed to live). Empty by default - the SecretStore/ExternalSecret templates only
# render at all when this is non-empty.
secrets: []

# WHERE this Application's own backend secret store is: a real Kubernetes Secret living
# in this Application's own EXISTING dev environment namespace (<type>-<app-name>-dev,
# no new namespace convention needed) - see docs/app-secrets.md. The ClusterSecretStore
# pointed at that namespace is rendered by the control-plane chart's own
# appSecretStores list, not this chart - this value only names the backend Secret
# OBJECT within that namespace, which this chart's own ExternalSecret needs to know.
appSecretStore:
  secretName: app-secrets    # the ONE backend Secret object in <type>-<app-name>-dev, holding every key this Application's cicd.yaml might ever declare under secrets:

# Shared platform infrastructure this chart's templates need to reach - not really
# per-app config, kept here (rather than under platformIdentity) since these are
# platform-wide constants every Application install shares, not this-one-Application's
# own identity.
toolboxImage: ghcr.io/jfillman/platform-cicd-toolbox:latest

# Must match charts/platform-cicd-control-plane/values.yaml's own secretStore.name/kind
# exactly - ClusterSecretStore is cluster-scoped (not namespaced), so this is a real
# cross-chart reference by name, not a value either chart owns independently. See
# docs/secrets-management.md.
secretStore:
  name: platform-secret-store
  kind: ClusterSecretStore

# Placeholder only - a real install MUST override every field here via
# `-f platform-identity.yaml` (see Chart.yaml). Left empty rather than a fake example
# value so an accidental `helm install` without that file fails loudly (empty app name,
# empty repo URLs) instead of silently deploying to a plausible-looking wrong place.
# catalogNamespace defaults to the real production catalog release's namespace - override
# this one specific field (only) for a canary Application pointed at
# platform-catalog-canary, see docs/catalog-versioning.md.
#
# No `tenantNamespace` field - the Application's namespace (and every env-scoped
# namespace it gets) is COMPUTED from type+appName via templates/_helpers.tpl's
# platform-cicd-app.namespace/.envNamespace, not set here, so it structurally cannot
# drift from the <type>-<app-name>-<env> convention. See docs/concepts.md.
platformIdentity:
  appName: ""
  type: app
  gitopsRepoUrl: ""
  appRepoUrl: ""
  githubOwner: ""
  catalogNamespace: platform-catalog
  # Renders templates/pipelines-as-code/repository.yaml's Repository CR(s) - see that
  # file's header. Real default (not a placeholder like the fields above): false only
  # makes sense as a deliberate per-app override, e.g. to deregister a repo without the
  # chart recreating the CR on the next sync.
  registerPipelinesAsCode: true
