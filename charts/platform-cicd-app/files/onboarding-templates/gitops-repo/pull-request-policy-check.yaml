# The real policy-check gate: points at the dedicated policy-check Pipeline, which
# verifies the app-repo commit's gitsign signature against this Application's
# allowed-signers list. See docs/commit-signing.md.
#
# repo-url/revision are PaC's own template vars for this gitops repo's PR.
# app-namespace/app-name are static, substituted once at onboarding.
#
# pr-number - see pull-request-sast.yaml (feeds the finally-block PR comment).
#
# timeouts.tasks/finally split - see pull-request-sast.yaml's own header for why
# (finally/comment-pr must never share a budget with the real check tasks). `tasks`
# here is bigger than the other 8m-budget gates because verify-image-provenance.yaml's
# own `ec validate` call now runs with a 10m internal timeout (see that file's own
# 2026-08-23 header) - this must stay comfortably above that or Tekton's own infra
# timeout would cut the task off before ec's more generous internal one even gets a
# chance to.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: policy-check
  annotations:
    # See pull-request-sast.yaml for why this is on-cel-expression (release-branch-only)
    # and why has() guards the pull_request field.
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.pull_request) && body.pull_request.base.ref == "main" && body.pull_request.head.ref.startsWith("release-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: policy-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: pr-number, value: "{{ body.pull_request.number }}" }
    - { name: app-namespace, value: "<APP_NAMESPACE>" }
    - { name: app-name, value: "<APP_NAME>" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    tasks: "11m"
    finally: "2m"
    pipeline: "13m"
