# .tekton/pull-request-sbom.yaml
#
# BOILERPLATE - real (not stub) as of Phase 3 item 8.7. See pull-request-sast.yaml for
# the full pattern explanation. References platform-cicd's dedicated sbom-check
# Pipeline, which resolves the promoted image from the gitops PR's own staging manifest
# and generates+attests a real SBOM for it - see catalog/tasks/generate-sbom.yaml's own
# header.
#
# No <APP_NAMESPACE>/<APP_NAME> substitution and no workspace needed - same as
# pull-request-image-scan.yaml, which this mirrors exactly (both resolve the promoted
# image the same way, then do something different with it).
#
# pr-number - see pull-request-sast.yaml's own comment for why this is here (feeds the
# finally-block PR comment, catalog/tasks/comment-pr-check-result.yaml).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sbom
  annotations:
    # See pull-request-sast.yaml's own annotation comment for why this is on-cel-expression
    # (release-branch-only) rather than on-event/on-target-branch.
    pipelinesascode.tekton.dev/on-cel-expression: 'body.action == "opened" && body.pull_request.base.ref == "main" && body.pull_request.head.ref.startsWith("release-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: sbom-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: pr-number, value: "{{ body.pull_request.number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
