# .tekton/pull-request-sast.yaml
#
# BOILERPLATE - real (not stub), shift-left redesign. See also
# pull-request-image-scan.yaml, pull-request-policy-check.yaml, pull-request-sbom.yaml.
# References platform-cicd's dedicated sast-check Pipeline, which resolves the promoted
# image (same manifest-based resolution pull-request-image-scan.yaml uses) and looks up
# whether sast-scan passed at build time from that image's own SLSA provenance
# attestation - not a re-scan. See platform-cicd's catalog/tasks/verify-sast-
# attestation.yaml for the full design and why re-scanning source at a fixed commit was
# genuinely redundant (caught by the user, not something this design started with).
#
# No <APP_NAMESPACE>/<APP_NAME> substitution and no workspace needed - repo-url/revision come
# from PaC's own template vars; extract-promoted-image.yaml and verify-sast-
# attestation.yaml both clone/query in their own scratch space, no shared Pipeline
# workspace required (unlike this file's own pre-redesign version, which needed one to
# hand source off to a re-scan step).
#
# pr-number ({{ body.pull_request.number }}, PaC's raw webhook body field access - same
# pattern pull-request-merged.yaml already uses) feeds this Pipeline's finally block,
# which posts a real PR comment reporting the check's own outcome (pass or fail) via
# catalog/tasks/comment-pr-check-result.yaml - on top of the GitHub Check PaC already
# reports natively.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sast
  annotations:
    # on-cel-expression, not on-event/on-target-branch - PaC ignores those two entirely
    # once a CEL expression is present (confirmed live), so the branch-base and
    # head-prefix checks below have to carry the whole condition, not just add to it.
    # release-<sha>-<timestamp> is open-release-pr.yaml's own branch-naming convention -
    # this is what actually distinguishes a real release-promotion PR from any other PR
    # against this repo (e.g. the onboarding-resync PR that only touches .tekton/, which
    # has no promoted image to scan and no attestation to verify). Confirmed live: without
    # this, every onboarding-resync PR failed these checks for a real but irrelevant
    # reason (scanning/verifying whatever placeholder or stale image happened to already
    # be in staging/deployment.yaml).
    #
    # NOT restricted to body.action == "opened" - deliberately reverted 2026-08-12
    # (was added 2026-08-11 after open-release-pr.yaml's own second commit, the
    # outcome-reporting hooks push, doubled every one of these 4 checks and posted
    # duplicate PR comments). That restriction fixed the duplicate-comment symptom by
    # suppressing re-verification entirely - which also meant a commit landing AFTER
    # the first one was never independently checked again. Confirmed live this is a
    # real, not just theoretical, gap: GitHub reports zero Check Runs for a PR's actual
    # current HEAD when only its first commit was ever verified, and the PR's own
    # `mergeable_state` came back "unstable" rather than a hard block. Every commit
    # (including a legitimate second one from open-release-pr.yaml, or any other)
    # now gets a real, independent Check Run again. The original duplicate-comment
    # symptom is fixed the right way instead - catalog/tasks/
    # comment-pr-check-result.yaml now edits its own prior comment on this PR in place
    # (a hidden marker identifies which gate's comment is which) rather than always
    # appending a new one, so re-verifying an unchanged commit updates the existing
    # comment instead of spamming a duplicate.
    #
    # has(body.pull_request) - real bug, found live 2026-08-12: merging a release PR
    # (or any push to this repo) fires a `push` webhook to the SAME PaC listener
    # alongside the `pull_request` one, and PaC evaluates every PipelineRun's own
    # on-cel-expression against EVERY webhook delivery it receives for the repo, not
    # just ones shaped like what the expression expects. A push event's body has no
    # `pull_request` key at all, so `body.pull_request.base.ref` failed with a real
    # CEL "no such key" error - reported back as a bot comment on the PR ("errors in
    # your PipelineRun template") that looks like a real platform problem but isn't
    # one; the checks themselves already ran fine off the real pull_request event
    # minutes earlier. has() short-circuits the rest of the expression when the event
    # isn't PR-shaped, so a push event now just doesn't match, silently, the same as
    # any other irrelevant event already did.
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.pull_request) && body.pull_request.base.ref == "main" && body.pull_request.head.ref.startsWith("release-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: sast-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
    - { name: pr-number, value: "{{ body.pull_request.number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
