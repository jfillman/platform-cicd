# STUB - see docs/admin/governance-stubs.md and docs/admin/release-guardrails.md.
# References the shared governance-check Pipeline (gate-name: qa), which calls
# governance-gate-stub - loud "no real check implemented yet" logging + a stub span,
# never a silent pass (ADR-0003). Intended real behavior: verify the required test suite
# actually ran and passed for the commit being promoted (mechanism TBD - likely reading
# the test stage's own recorded outcome rather than re-running tests here). Swap for a
# dedicated Pipeline once that's built - see governance-stubs.md's "Landing a real
# implementation" section; nothing else about this file's shape needs to change.
#
# No <APP_NAMESPACE>/<APP_NAME> substitution or workspace needed - same reasons as
# pull-request-sast.yaml. pr-number feeds the finally-block PR comment.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qa
  annotations:
    # See pull-request-sast.yaml for why this is on-cel-expression (release-branch-only)
    # and why has() guards the pull_request field.
    pipelinesascode.tekton.dev/on-cel-expression: 'has(body.pull_request) && body.pull_request.base.ref == "main" && body.pull_request.head.ref.startsWith("release-")'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: governance-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: gate-name, value: qa }
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: pr-number, value: "{{ body.pull_request.number }}" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    # tasks/finally split - see pull-request-sast.yaml's own header (2026-08-23) for
    # why finally/comment-pr must never share a budget with the real check tasks.
    tasks: "8m"
    finally: "2m"
    pipeline: "10m"
