{{- if eq (include "platform-cicd-app.hasStage" (dict "stages" .Values.pipeline "name" "release")) "true" }}
{{- $appNamespace := include "platform-cicd-app.namespace" . }}
# templates/triggers/fire-release.yaml (from tenant-triggers-template.yaml's Stage 4 -
# rendered only if cicd.yaml's pipeline: declares a "release" stage - this is the exact
# case that was live-confirmed broken: a release PipelineRun fired for an Application
# whose cicd.yaml never declared this stage, because nothing previously read pipeline:
# at all)
#
# No outcome field to check in the CEL filter below (unlike on-test-success) - deploy's
# send-cdevent task is itself gated on $(tasks.status) being Succeeded/Completed before
# it ever fires, so the event's mere existence already implies success.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: cdevents-service-deployed
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
  namespace: {{ $appNamespace }}
spec:
  params:
    - { name: image-ref, value: "$(body.subject.content.artifactId)" }
    - { name: git-url, value: "$(body.subject.content.git-url)" }
    - { name: git-revision, value: "$(body.subject.content.revision)" }
    - { name: chain-id, value: "$(body.context.chainId)" }
    - { name: traceparent, value: "$(body.customData.platform.traceparent)" }
    - { name: flow-start-time, value: "$(body.customData.platform.flow_start_time)" }
    - { name: pipeline-run-name, value: "release-$(body.context.id)" }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fire-release
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
  namespace: {{ $appNamespace }}
spec:
  params:
    - name: image-ref
    - name: git-url
    - name: git-revision
    - name: chain-id
    - name: traceparent
    - name: flow-start-time
    - name: pipeline-run-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name)
      spec:
        pipelineRef:
          resolver: cluster
          params:
            - { name: kind, value: pipeline }
            - { name: name, value: release }
            - { name: namespace, value: {{ .Values.platformIdentity.catalogNamespace }} }
        params:
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
          - { name: image-ref, value: $(tt.params.image-ref) }
          - { name: app-namespace, value: {{ $appNamespace }} }
          - { name: app-name, value: {{ .Values.platformIdentity.appName }} }
          - { name: flow-traceparent, value: $(tt.params.traceparent) }
          - { name: chain-id, value: $(tt.params.chain-id) }
          - { name: flow-start-time, value: $(tt.params.flow-start-time) }
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
        taskRunTemplate: { serviceAccountName: pipeline-runner }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: on-deploy-success
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
  namespace: {{ $appNamespace }}
spec:
  serviceAccountName: pipeline-runner
  interceptors:
    - ref: { name: cdevents-broker-auth, kind: ClusterInterceptor }
      params: [{ name: audience, value: cdevents-broker }]
    - ref: { name: cel, kind: ClusterInterceptor }
      params:
        - name: filter
          value: >-
            body.context.type == 'dev.cdevents.service.deployed.0.3.0' &&
            extensions.app_namespace == '{{ $appNamespace }}' &&
            body.context.source.startsWith('/platform-cicd/{{ $appNamespace }}/')
  bindings:
    - { ref: cdevents-service-deployed }
  template:
    ref: fire-release
{{- end }}
