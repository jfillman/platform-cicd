{{- if eq (include "platform-cicd-app.hasStage" (dict "ctx" . "name" "deploy")) "true" }}
{{- $appNamespace := include "platform-cicd-app.namespace" . }}
# templates/triggers/fire-deploy.yaml (from tenant-triggers-template.yaml's Stage 3 -
# rendered only if cicd.yaml's pipeline: declares a "deploy" stage)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: cdevents-testcaserun-finished
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
  namespace: {{ $appNamespace }}
spec:
  params:
    - { name: outcome, value: "$(body.subject.content.outcome)" }
    - { name: image-ref, value: "$(body.subject.content.image)" }
    - { name: git-url, value: "$(body.subject.content.git-url)" }
    - { name: git-revision, value: "$(body.subject.content.revision)" }
    - { name: chain-id, value: "$(body.context.chainId)" }
    - { name: traceparent, value: "$(body.customData.platform.traceparent)" }
    - { name: flow-start-time, value: "$(body.customData.platform.flow_start_time)" }
    - { name: pipeline-run-name, value: "deploy-$(body.context.id)" }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fire-deploy
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
  namespace: {{ $appNamespace }}
spec:
  params:
    - name: image-ref
    - name: git-url
    - name: git-revision
    - name: chain-id
    - name: traceparent
    - name: flow-start-time
    - name: pipeline-run-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name)
      spec:
        pipelineRef:
          resolver: cluster
          params:
            - { name: kind, value: pipeline }
            - { name: name, value: deploy }
            - { name: namespace, value: {{ .Values.platformIdentity.catalogNamespace }} }
        params:
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
          - { name: image-ref, value: $(tt.params.image-ref) }
          # Hardcoded "dev", matching the pre-Helm template exactly - Phase 1 only ever
          # wired one lower environment to the automated deploy trigger (additional
          # lowerEnvironments/upperEnvironments entries get RBAC provisioned via
          # templates/env/deploy-rbac.yaml but aren't wired to any trigger yet - inventing
          # real multi-environment trigger selection is out of scope for this conversion).
          - { name: env, value: dev }
          - { name: app-namespace, value: {{ $appNamespace }} }
          - { name: app-name, value: {{ .Values.platformIdentity.appName }} }
          - { name: app-type, value: {{ .Values.platformIdentity.type }} }
          - { name: flow-traceparent, value: $(tt.params.traceparent) }
          - { name: chain-id, value: $(tt.params.chain-id) }
          - { name: flow-start-time, value: $(tt.params.flow-start-time) }
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
        taskRunTemplate: { serviceAccountName: pipeline-runner }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: on-test-success
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
  namespace: {{ $appNamespace }}
spec:
  serviceAccountName: pipeline-runner
  interceptors:
    - ref: { name: cdevents-broker-auth, kind: ClusterInterceptor }
      params: [{ name: audience, value: cdevents-broker }]
    - ref: { name: cel, kind: ClusterInterceptor }
      params:
        - name: filter
          value: >-
            body.context.type == 'dev.cdevents.testcaserun.finished.0.3.0' &&
            body.subject.content.outcome == 'Succeeded' &&
            extensions.app_namespace == '{{ $appNamespace }}' &&
            body.context.source.startsWith('/platform-cicd/{{ $appNamespace }}/')
  bindings:
    - { ref: cdevents-testcaserun-finished }
  template:
    ref: fire-deploy
{{- end }}
