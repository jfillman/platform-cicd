# templates/triggers/release-outcome-trigger.yaml (Phase 3 item 4, docs/multi-cluster.md)
#
# Consumes the environment.deployed CDEvent argocd-outcome-relay forwards once a
# cluster-mapped release env's ArgoCD confirms a real sync outcome. Only rendered for
# apps that actually have a cluster-mapped upper env - most apps don't and get nothing
# here.
#
# Unlike every Trigger in flow-triggers.yaml, this one's CEL filter does NOT check
# extensions.app_namespace (the value the broker's TokenReview interceptor sets from
# the CALLER's own verified SA identity) - the caller here is always
# argocd-outcome-relay, running as its own platform-system ServiceAccount, forwarding
# on behalf of potentially any app. That extension would read "platform-system" for
# every one of these events regardless of which app they're actually about, so it
# can't be the per-app discriminator here. Matches on the event's own claimed
# body.subject.content.appNamespace instead - see argocd-outcome-relay/main.go's own
# header for why that's a deliberate, bounded trust difference from the TokenReview
# path, not an oversight.
{{- if eq (include "platform-cicd-app.hasClusterMappedUpperEnv" .) "true" }}
{{- $appNamespace := include "platform-cicd-app.namespace" . }}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: release-outcome-binding
  namespace: {{ $appNamespace }}
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
spec:
  params:
    - { name: pipeline-run-name, value: {{ printf "release-outcome-$(body.context.id)" | quote }} }
    - { name: app-namespace, value: "$(body.subject.content.appNamespace)" }
    - { name: app-name, value: "$(body.subject.content.appName)" }
    - { name: env, value: "$(body.subject.content.env)" }
    - { name: cluster, value: "$(body.subject.content.cluster)" }
    - { name: status, value: "$(body.subject.content.status)" }
    - { name: git-url, value: "$(body.subject.content.gitUrl)" }
    - { name: git-revision, value: "$(body.subject.content.gitRevision)" }
    - { name: pr-url, value: "$(body.subject.content.prUrl)" }
    - { name: config-json, value: "$(body.subject.content.configJson)" }
    - { name: chain-id, value: "$(body.context.chainId)" }
    - { name: flow-start-time, value: "$(body.subject.content.flowStartTime)" }
    - { name: pr-created-at, value: "$(body.subject.content.prCreatedAt)" }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: release-outcome-template
  namespace: {{ $appNamespace }}
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
spec:
  params:
    - name: pipeline-run-name
    - name: app-namespace
    - name: app-name
    - name: env
    - name: cluster
    - name: status
    - name: git-url
    - name: git-revision
    - name: pr-url
    - name: config-json
    - name: chain-id
    - name: flow-start-time
    - name: pr-created-at
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: $(tt.params.pipeline-run-name)
        labels:
          platform.io/subcomponent: "release-outcome"
      spec:
        pipelineRef:
          resolver: cluster
          params:
            - { name: kind, value: pipeline }
            - { name: name, value: release-outcome-notify }
            - { name: namespace, value: {{ .Values.platformIdentity.catalogNamespace }} }
        params:
          - { name: app-namespace, value: $(tt.params.app-namespace) }
          - { name: app-name, value: $(tt.params.app-name) }
          - { name: env, value: $(tt.params.env) }
          - { name: cluster, value: $(tt.params.cluster) }
          # Already Succeeded/Failed by the time it gets here - the relay precomputes
          # both CDEvents' own outcome vocabulary and this Succeeded/Failed one (see
          # argocd-outcome-relay/main.go), since $(tt.params.x) is plain string
          # substitution, not a CEL evaluator - no ternary available in a
          # TriggerTemplate to derive one from the other here.
          - { name: status, value: $(tt.params.status) }
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
          - { name: pr-url, value: $(tt.params.pr-url) }
          - { name: config-json, value: $(tt.params.config-json) }
          - { name: chain-id, value: $(tt.params.chain-id) }
          - { name: flow-start-time, value: $(tt.params.flow-start-time) }
          - { name: pr-created-at, value: $(tt.params.pr-created-at) }
        taskRunTemplate:
          serviceAccountName: pipeline-runner
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: release-outcome
  namespace: {{ $appNamespace }}
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "triggers"
spec:
  serviceAccountName: pipeline-runner
  interceptors:
    - ref: { name: cdevents-broker-auth, kind: ClusterInterceptor }
      params: [{ name: audience, value: cdevents-broker }]
    - ref: { name: cel, kind: ClusterInterceptor }
      params:
        - name: filter
          value: >-
            body.context.type == 'dev.cdevents.environment.deployed.0.1.0' &&
            body.subject.content.appNamespace == '{{ $appNamespace }}'
  bindings:
    - { ref: release-outcome-binding }
  template:
    ref: release-outcome-template
{{- end }}
