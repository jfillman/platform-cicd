# templates/secrets/app-secrets-external-secret.yaml - see docs/app-secrets.md
#
# One ExternalSecret per Application, aggregating EVERY entry cicd.yaml's secrets: list
# declares into ONE target Secret (app-secrets) - not one ExternalSecret per declared
# entry. This is deliberate: a consuming Task (notify-slack.yaml today, a future
# sast-scan Task tomorrow) mounts exactly one Secret name regardless of how many keys
# this Application has ever declared, and adding a new entry to secrets: never means
# wiring a new volume/volumeMount anywhere - only the ExternalSecret's own `data` list
# below grows, via this range.
#
# `key` on each list entry defaults to `name` (see schemas/cicd.schema.json's own
# description) so the common case - the name you want here already matches the name it
# has in your backend store - needs only one field per entry.
#
# References a ClusterSecretStore, NOT a SecretStore this chart renders itself - this
# Application's own backend is <type>-<appName>-dev (its existing dev environment
# namespace, holding a real Secret named .Values.appSecretStore.secretName), and the
# ClusterSecretStore pointed at it is rendered once, per Application, by the
# CONTROL-PLANE chart's own appSecretStores list
# (charts/platform-cicd-control-plane/templates/secretstore/app-secret-stores.yaml) -
# see that file's header for why a cluster-scoped store can't be rendered per-app from
# inside this (also per-app) chart. The name below is computed identically in both
# places from the same type+appName inputs - not a value passed between the two charts,
# since they're independent Helm releases.
#
# Only rendered when secrets: is non-empty - an Application that never uses this
# feature gets no dangling ExternalSecret pointed at a ClusterSecretStore that may not
# exist for it (i.e. control-plane's appSecretStores list doesn't include it yet).
{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "secrets"
  namespace: {{ include "platform-cicd-app.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platformIdentity.type }}-{{ .Values.platformIdentity.appName }}-secret-store
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ $.Values.appSecretStore.secretName }}
        property: {{ .key | default .name }}
    {{- end }}
{{- end }}
