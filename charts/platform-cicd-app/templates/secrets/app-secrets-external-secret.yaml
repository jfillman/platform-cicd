# One ExternalSecret per Application, aggregating every secrets: entry into one target
# Secret (app-secrets) rather than one ExternalSecret per entry, so a consuming Task
# always mounts one Secret name regardless of key count. `key` defaults to `name` for
# the common case where the two already match.
#
# References a ClusterSecretStore this chart does NOT render - it's rendered once per
# Application by the control-plane chart's appSecretStores list, since a cluster-scoped
# store can't be rendered per-app from a per-app chart. The name is computed identically
# in both places from type+appName, not passed between the two independent releases.
#
# No remoteRef.property - the backend is Infisical now (control-plane's own project,
# path-scoped per app), and ESO's `infisical` provider treats `property` as "extract
# this field from a structured/JSON secret value", not "which flat secret to read" -
# confirmed live by idp-service-catalog against a real Infisical instance (every
# Infisical secret here is an ordinary flat value). `key` alone is both necessary and
# sufficient.
#
# slack-webhook-url is special-cased via a per-entry sourceRef.storeRef override (a
# real ESO feature - ExternalSecretData.SourceRef, same mechanism idp-application's own
# external-secret.yaml already uses for its `shared: true` entries): a real mistake
# caught after this chart's Infisical migration first shipped - it briefly expected
# app owners to plant their Slack webhook a SECOND time, under platform-cicd's own
# per-app secretsPath, duplicating the SAME secret idp-application's own
# notify-external-secret.yaml already reads from this app's own idp-managed project
# (<appName>-<cluster> ClusterSecretStore, `shared` environment, same key). Fixed to
# read from THAT store instead - one Slack webhook per app, managed once, in the
# app's own project, not platform-cicd's. Every other secrets: entry (a genuinely
# CI-specific credential like a SAST scan token) still comes from platform-cicd's own
# per-app secretsPath, the default when no override applies.
#
# Only rendered when secrets: is non-empty, to avoid a dangling ExternalSecret pointed
# at a ClusterSecretStore that may not exist yet. See docs/app-secrets.md.
{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "secrets"
  namespace: {{ include "platform-cicd-app.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platformIdentity.type }}-{{ .Values.platformIdentity.appName }}-secret-store
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      {{- if eq .name "slack-webhook-url" }}
      sourceRef:
        storeRef:
          name: {{ printf "%s-%s" $.Values.platformIdentity.appName $.Values.devClusterName }}
          kind: ClusterSecretStore
      {{- end }}
      remoteRef:
        key: {{ .key | default .name }}
    {{- end }}
{{- end }}
