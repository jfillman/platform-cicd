# One ExternalSecret per Application, aggregating every secrets: entry into one target
# Secret (app-secrets) rather than one ExternalSecret per entry, so a consuming Task
# always mounts one Secret name regardless of key count. `key` defaults to `name` for
# the common case where the two already match.
#
# References a ClusterSecretStore this chart does NOT render - it's rendered once per
# Application by the control-plane chart's appSecretStores list, since a cluster-scoped
# store can't be rendered per-app from a per-app chart. The name is computed identically
# in both places from type+appName, not passed between the two independent releases.
#
# No remoteRef.property - the backend is Infisical now, and ESO's `infisical` provider
# treats `property` as "extract this field from a structured/JSON secret value", not
# "which flat secret to read" - confirmed live by idp-service-catalog against a real
# Infisical instance (every Infisical secret here is an ordinary flat value). `key`
# alone is both necessary and sufficient.
#
# Every entry here (including slack-webhook-url) reads from the SAME store,
# <type>-<appName>-secret-store - no per-entry override needed. That store itself
# (control-plane's app-secret-stores.yaml) points at THIS Application's own
# idp-managed Infisical project, not platform-cicd's - see that file's own header for
# why (a real design correction, 2026-08-19: an earlier pass here had every entry,
# including slack-webhook-url, pointed at a platform-cicd-owned project instead).
#
# Only rendered when secrets: is non-empty, to avoid a dangling ExternalSecret pointed
# at a ClusterSecretStore that may not exist yet. See docs/app-secrets.md.
{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "secrets"
  namespace: {{ include "platform-cicd-app.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platformIdentity.type }}-{{ .Values.platformIdentity.appName }}-secret-store
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key | default .name }}
    {{- end }}
{{- end }}
