# Replaces manual `kubectl create secret docker-registry ...` per app with an
# ExternalSecret synced from the control-plane chart's ClusterSecretStore. The real
# credential is still created by hand once, in the shared platform-secrets namespace
# (every Application pushes to the same deployment-wide registry) - never pasted
# through this chart or committed. See docs/admin/secrets-management.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-credentials
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "identity"
  namespace: {{ include "platform-cicd-app.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: registry-credentials
