{{- $hasRelease := eq (include "platform-cicd-app.hasStage" (dict "ctx" . "name" "release")) "true" }}
{{- $hasEphemeral := and .Values.ephemeralEnvironments .Values.ephemeralEnvironments.pullRequest .Values.ephemeralEnvironments.pullRequest.enabled }}
{{- if or $hasRelease $hasEphemeral }}
{{- $appNamespace := include "platform-cicd-app.namespace" . }}
{{- $localUpperEnvs := include "platform-cicd-app.localUpperEnvs" . | fromYamlArray }}
# Unifies what used to be two separate hand-applied files updating the same AppProject
# (release + ephemeral-envs) into one conditionally-rendered template - Helm can't have
# two templates own the same resource in one release. Scoped per-app rather than reusing
# the cluster's unscoped `default` AppProject, consistent with this platform's narrow
# scoping elsewhere.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $appNamespace }}
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "argocd"
  namespace: argocd
spec:
  {{- /* No local upper envs is valid, not a bug, if all are cluster-mapped
  (docs/multi-cluster.md) - those Applications live entirely on another cluster's ArgoCD. */ -}}
  {{- $releaseDesc := "" }}
  {{- if gt (len $localUpperEnvs) 0 }}
    {{- $releaseDesc = printf "Release-stage (%s) deployments for %s" (join ", " $localUpperEnvs) .Values.platformIdentity.appName }}
  {{- else if $hasRelease }}
    {{- $releaseDesc = printf "Release-stage deployments for %s (all upper envs are on a different cluster - see docs/multi-cluster.md)" .Values.platformIdentity.appName }}
  {{- end }}
  description: >-
    {{- if and $hasRelease $hasEphemeral }}
    {{ $releaseDesc }} and PR-based ephemeral-environment deployments.
    {{- else if $hasRelease }}
    {{ $releaseDesc }}, scoped to its own GitOps repo and namespace only.
    {{- else }}
    PR-based ephemeral-environment deployments for {{ .Values.platformIdentity.appName }}.
    {{- end }}
  sourceRepos:
    {{- if $hasRelease }}
    - {{ .Values.platformIdentity.gitopsRepoUrl }}
    {{- end }}
    {{- if $hasEphemeral }}
    - {{ .Values.platformIdentity.appRepoUrl }}
    {{- end }}
  {{- if $hasEphemeral }}
  # Required by ArgoCD's ApplicationSet-in-any-namespace feature so the pr-envs
  # ApplicationSet (ephemeral-envs.yaml), which lives in this app's -cicd namespace
  # rather than argocd's, can reference this project.
  sourceNamespaces:
    - {{ $appNamespace }}
  {{- end }}
  destinations:
    {{- /* Cluster-mapped upper envs get no destination entry - this AppProject only
    governs this cluster's ArgoCD. Explicit [] fallback keeps this a real empty array. */ -}}
    {{- if or (gt (len $localUpperEnvs) 0) $hasEphemeral }}
    {{- range $localUpperEnvs }}
    - namespace: {{ include "platform-cicd-app.envNamespace" (list $ .) }}
      server: https://kubernetes.default.svc
    {{- end }}
    {{- if $hasEphemeral }}
    - namespace: {{ include "platform-cicd-app.envNamespace" (list $ "pr-*") }}
      server: https://kubernetes.default.svc
    {{- end }}
    {{- else }}
    []
    {{- end }}
  clusterResourceWhitelist:
    {{- if $hasEphemeral }}
    # Namespace is cluster-scoped, so it must be whitelisted here (not
    # namespaceResourceWhitelist) or ArgoCD blocks syncing k8s/ephemeral/namespace.yaml.
    - { group: "", kind: Namespace }
    {{- else }}
    []
    {{- end }}
  namespaceResourceWhitelist:
    - { group: "apps", kind: Deployment }
    - { group: "", kind: Service }
{{- end }}
