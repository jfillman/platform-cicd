{{- $hasRelease := eq (include "platform-cicd-app.hasStage" (dict "ctx" . "name" "release")) "true" }}
{{- $hasEphemeral := and .Values.ephemeralEnvironments .Values.ephemeralEnvironments.pullRequest .Values.ephemeralEnvironments.pullRequest.enabled }}
{{- $appNamespace := include "platform-cicd-app.namespace" . }}
{{- $localUpperEnvs := include "platform-cicd-app.localUpperEnvs" . | fromYamlArray }}
# Two separate AppProjects, not one shared across both stages (gitops-strategy.md §2):
# release deployments happen only after a human-approved GitOps PR, so they stay under
# argocd-platform (cluster-admin-scoped, namespace `argocd`); PR-based ephemeral
# environments are app-owner/PR-driven, so they belong under argocd-apps (app-owner-
# facing, namespace `argocd-apps`) instead. An ArgoCD instance only ever looks for an
# AppProject inside its OWN control-plane namespace, so which namespace an AppProject
# lives in is what actually decides which instance's Applications/ApplicationSets can
# reference it - putting these in two namespaces is the whole mechanism. Same name
# ({{ $appNamespace }}) in both is fine: they're namespaced resources, and each instance
# only ever sees its own copy.
#
# Previously a single AppProject in `argocd` served both stages, with ephemeral-envs.yaml
# reconciled by argocd-platform via a `*-cicd` applicationset-namespaces glob - moved back
# out to argocd-apps (its originally-intended owner per gitops-strategy.md §2's "argocd-
# apps ... watches per-app Applications generated by an ApplicationSet") after that
# glob-watch turned out to be unnecessary for anything else: release-application.yaml's
# Applications live directly in `argocd`, not in a tenant `-cicd` namespace, so nothing
# else on argocd-platform needed the wider watch.
{{- if $hasRelease }}
{{- $releaseDesc := "" }}
{{- if gt (len $localUpperEnvs) 0 }}
{{- $releaseDesc = printf "Release-stage (%s) deployments for %s" (join ", " $localUpperEnvs) .Values.platformIdentity.appName }}
{{- else }}
{{- $releaseDesc = printf "Release-stage deployments for %s (all upper envs are on a different cluster - see docs/multi-cluster.md)" .Values.platformIdentity.appName }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $appNamespace }}
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "argocd"
  namespace: argocd
spec:
  description: >-
    {{ $releaseDesc }}, scoped to its own GitOps repo and namespace only.
  sourceRepos:
    - {{ .Values.platformIdentity.gitopsRepoUrl }}
  destinations:
    {{- if gt (len $localUpperEnvs) 0 }}
    {{- range $localUpperEnvs }}
    - namespace: {{ include "platform-cicd-app.envNamespace" (list $ .) }}
      server: https://kubernetes.default.svc
    {{- end }}
    {{- else }}
    []
    {{- end }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "apps", kind: Deployment }
    - { group: "", kind: Service }
---
{{- end }}
{{- if $hasEphemeral }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $appNamespace }}
  labels:
    {{- include "platform-cicd-app.labels" . | nindent 4 }}
    platform.io/subcomponent: "argocd"
  namespace: argocd-apps
spec:
  description: >-
    PR-based ephemeral-environment deployments for {{ .Values.platformIdentity.appName }}.
  sourceRepos:
    - {{ .Values.platformIdentity.appRepoUrl }}
  # Required by ArgoCD's ApplicationSet-in-any-namespace feature so the pr-envs
  # ApplicationSet (ephemeral-envs.yaml), which lives in this app's own -cicd namespace
  # rather than argocd-apps's own, can reference this project.
  sourceNamespaces:
    - {{ $appNamespace }}
  destinations:
    - namespace: {{ include "platform-cicd-app.envNamespace" (list . "pr-*") }}
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # Namespace is cluster-scoped, so it must be whitelisted here (not
    # namespaceResourceWhitelist) or ArgoCD blocks syncing k8s/ephemeral/namespace.yaml.
    - { group: "", kind: Namespace }
  namespaceResourceWhitelist:
    - { group: "apps", kind: Deployment }
    - { group: "", kind: Service }
{{- end }}
