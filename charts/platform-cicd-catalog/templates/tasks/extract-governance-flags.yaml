# catalog/tasks/extract-governance-flags.yaml
#
# Extracts the four governance toggles from cicd.yaml's `governance` block so the
# calling Pipeline can `when`-guard each gate individually. sast is real as of Phase 3
# item 8.4; image-scan/policy-check/sbom are still stubs - see
# catalog/stepactions/governance-stub.yaml.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-governance-flags
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: config-json
      type: string
  results:
    - name: sast
    - name: image-scan
    - name: policy-check
    - name: sbom
  steps:
    - name: extract
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CFG='$(params.config-json)'
        # echo -n, not a bare `jq -r ... | tee` - jq's raw output is newline-terminated,
        # and that trailing newline was silently written into the result value. A real,
        # previously-dormant bug found live: Tekton's `when: { operator: in, values:
        # ["true"] }` does an exact-string match, so a result value of "true\n" never
        # matches "true" - every when-guarded gate below silently never fired even when
        # its cicd.yaml flag was genuinely true. Never caught earlier because no gate had
        # ever actually been enabled in a real run before sast was (Phase 3 item 8.4).
        echo -n "$(jq -r '.governance.sast // false' <<< "${CFG}")" | tee "$(results.sast.path)"
        echo -n "$(jq -r '.governance.imageScan // false' <<< "${CFG}")" | tee "$(results.image-scan.path)"
        echo -n "$(jq -r '.governance.policyCheck // false' <<< "${CFG}")" | tee "$(results.policy-check.path)"
        echo -n "$(jq -r '.governance.sbom // false' <<< "${CFG}")" | tee "$(results.sbom.path)"
