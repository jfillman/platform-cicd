# catalog/tasks/bump-manifest-pr.yaml
#
# Opens a PR bumping the image reference of a plain Kubernetes Deployment manifest
# (not idp-application's Helm values.yaml - see open-release-pr.yaml for that shape).
# For a hand-deployed singleton/cluster-config component (e.g. Backstage on kind-man,
# gitops-cluster-kind-man's 60-backstage/backstage/deployment.yaml) that has no
# gitops-<app-name> repo of its own and no dev/upper promotion flow - see
# idp/docs/backstage-design.md and this app's own cicd.yaml header.
#
# gitopsRepo is NOT derived from app-name by convention (unlike open-release-pr.yaml) -
# it's an explicit param, since the whole point of this Task is targeting a repo that
# ISN'T gitops-<app-name>. Authorization follows the same broker rule as ever
# (verifyAppOwnsRepo, main.go): the calling app's CI namespace must own a PaC
# Repository CR literally named gitopsRepo - see platformIdentity.extraGitopsRepos
# (charts/platform-cicd-app/templates/pipelines-as-code/repository.yaml), a
# tenant-identity-owned grant, not something this Task or the app's own cicd.yaml can
# self-serve.
#
# Same never-persisted-credential mechanism as open-release-pr.yaml: a fresh,
# single-repo-scoped GitHub App installation token minted per-run via
# catalog/lib/github-app.sh, never a standing secret.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bump-manifest-pr
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: image-ref
      type: string
      description: The already-built image reference (by digest or tag) to deploy.
    - name: git-url
      type: string
      description: The app repo's git-url - only its GitHub org/owner is used, to derive the gitops repo's owner (same org as the app repo, per this platform's convention).
    - name: app-name
      type: string
    - name: git-revision
      type: string
    - name: gitops-repo
      type: string
      description: Name (not URL) of the target gitops repo, e.g. "gitops-cluster-kind-man". Required - see this Task's own header for why it's explicit rather than derived.
    - name: manifest-path
      type: string
      description: Path within gitops-repo to the plain Deployment manifest to patch, e.g. "60-backstage/backstage/deployment.yaml".
  results:
    - name: pr-url
      description: URL of the opened (or already-open, on retry) image-bump PR.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: open-pr
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: GIT_URL
          value: $(params.git-url)
        - name: APP_NAME
          value: $(params.app-name)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: GITOPS_REPO
          value: $(params.gitops-repo)
        - name: MANIFEST_PATH
          value: $(params.manifest-path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        if [[ -z "${GITOPS_REPO}" || -z "${MANIFEST_PATH}" ]]; then
          echo "error: gitopsRepo and manifestPath are both required on a gitops-image-bump step in this app's cicd.yaml." >&2
          exit 1
        fi

        # Same owner as the app repo (GIT_URL) - this platform's gitops repos always
        # live in the same GitHub org as the app repo that produces the image.
        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"

        token="$(github_app_installation_token "${owner}" "${GITOPS_REPO}")"

        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${GITOPS_REPO}.git"
        git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"

        branch="image-bump-${APP_NAME}-${GIT_REVISION:0:8}-$(date +%s)"
        git checkout -b "${branch}"

        # Single combined "repo:tag" image field - a raw Deployment manifest's own
        # shape, not the split repository/tag fields idp-application's Helm values use
        # (see open-release-pr.yaml). First container only - every hand-deployed
        # singleton this Task targets today has exactly one.
        yq -i -e ".spec.template.spec.containers[0].image = \"${IMAGE_REF}\"" "${MANIFEST_PATH}"

        git config user.name "platform-cicd release automation"
        git config user.email "release@platform-cicd.invalid"

        commit_message="$(printf 'Bump %s image to %s\n\nX-App-Repo: %s\nX-App-Commit: %s' \
          "${APP_NAME}" "${IMAGE_REF}" "${GIT_URL}" "${GIT_REVISION}")"
        git commit --quiet -am "${commit_message}"
        git push --quiet "${clone_url}" "${branch}"

        repo_short="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/([^/.]+).*#\1/\2#')"
        commit_short="${GIT_REVISION:0:12}"
        pr_body_text="$(printf '**App**: %s\n**Manifest**: `%s`\n**Repo**: [%s](%s)\n**Commit**: [`%s`](%s/commit/%s)\n**Image**: `%s`\n\nMerging this PR triggers ArgoCD to roll out the new image (selfHeal Application). See that repo'"'"'s own README for this component'"'"'s manually-planted secrets/prerequisites, if any.' \
          "${APP_NAME}" "${MANIFEST_PATH}" "${repo_short}" "${GIT_URL}" "${commit_short}" "${GIT_URL}" "${GIT_REVISION}" "${IMAGE_REF}")"
        pr_body="$(jq -n \
          --arg title "Bump ${APP_NAME} image to ${GIT_REVISION}" \
          --arg body "${pr_body_text}" \
          --arg head "${branch}" \
          --arg base "main" \
          '{title: $title, body: $body, head: $head, base: $base}')"

        pr_response="$(curl --fail --silent --show-error \
          -X POST -H "Authorization: Bearer ${token}" \
          -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${owner}/${GITOPS_REPO}/pulls" \
          -d "${pr_body}")"
        pr_url="$(jq -r '.html_url' <<<"${pr_response}")"

        echo "${pr_url}" | tee "$(results.pr-url.path)"
