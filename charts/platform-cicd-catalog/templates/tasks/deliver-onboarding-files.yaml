# templates/tasks/deliver-onboarding-files.yaml (Phase 3 item 7 - see
# docs/onboarding.md's "Keeping onboarding boilerplate in sync" section)
#
# Replaces both the fully-manual copy-paste onboarding process AND the old system's
# ConfigMap+trigger-field re-sync button, with the same design language this platform
# already uses everywhere else for a repo-write operation: mint a fresh, single-repo-
# scoped GitHub App installation token per target repo (never a standing credential),
# open a PR rather than pushing directly to a default branch, and let PaC's own already-
# trusted webhook auth be the thing that decides when this Task should run at all - see
# files/onboarding-templates/app-repo/onboarding-resync.yaml's own header for exactly which
# events trigger it (a cicd.yaml change on the app repo).
#
# Deliberately NOT touching the gitsign-enforced path: policy-check's gitsign
# verification runs only as a Check on the gitops repo's release PR (verifying the
# app-repo commit via X-App-Repo/X-App-Commit trailers - see open-release-pr.yaml) -
# there is no gitsign/policy-check gate wired onto either repo's default branch here, so
# this Task's own machine-generated commits never need to be signed.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deliver-onboarding-files
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: git-url
      type: string
      description: The app repo's own git-url - only its GitHub org/owner is used.
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: github-owner
      type: string
    - name: gitops-repo-url
      type: string
      default: ""
      description: >-
        Optional - only needed if this Application's pipeline declares a release stage
        (see the app chart's own conditional rendering). Empty skips the gitops-repo
        delivery half entirely, not an error.
  # Same audience-bound projected-ServiceAccount-token volume shape already proven in
  # send-cdevent.yaml/open-release-pr.yaml/pr-token-refresher-cronjob.yaml - no new
  # identity, no new RBAC (talking to the broker isn't RBAC-gated). This Task is meant to
  # run as the Application's own existing pipeline-runner SA, not a new one.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
    # charts/platform-cicd-app/templates/configmaps/onboarding-templates.yaml - rendered
    # by the APP chart (one copy per Application), NOT this catalog chart, even though
    # this Task itself is a shared, cluster-resolved definition. A Pod can only
    # volume-mount a ConfigMap from its own namespace, and this Task's Pod always
    # executes in the CALLING PipelineRun's namespace (whichever Application triggered
    # it) - never platform-catalog, regardless of where the Task definition itself was
    # resolved from. A fixed ConfigMap name works here specifically because Kubernetes
    # resolves it within whatever namespace the Pod actually ends up in - the same
    # shared Task definition transparently mounts a DIFFERENT Application's own copy
    # for each Application, no per-tenant Task change needed. See that ConfigMap
    # template's own header for the fuller reasoning (including a discarded
    # cross-namespace-kubectl-read alternative and why it was dropped).
    - name: onboarding-templates-app-repo
      configMap:
        name: onboarding-templates-app-repo
    - name: onboarding-templates-gitops-repo
      configMap:
        name: onboarding-templates-gitops-repo
  steps:
    - name: deliver-app-repo-files
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: onboarding-templates-app-repo
          mountPath: /opt/platform/onboarding-templates/app-repo
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: GIT_URL
          value: $(params.git-url)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
        - name: GITHUB_OWNER
          value: $(params.github-owner)
        - name: GITOPS_REPO_URL
          value: $(params.gitops-repo-url)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        image_repo="ghcr.io/${GITHUB_OWNER}/${APP_NAME}"

        token="$(github_app_installation_token "${owner}" "${repo}")"
        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${repo}.git"
        git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"
        mkdir -p .tekton

        # onboarding-resync.yaml is the one truly platform-required file delivered
        # unconditionally - the app repo's own copy of the trigger that re-invokes this
        # whole mechanism the next time cicd.yaml changes. Everything else (build on
        # push, PR validation, tag releases, ...) is app-specific pipeline BEHAVIOR, not
        # platform plumbing, so it comes entirely from cicd.yaml's own `pipelines:`
        # section below instead of being hardcoded here - there is no more implicit
        # "push to main always builds" default; an app that wants that declares it.
        sed \
          -e "s|<APP_NAMESPACE>|${APP_NAMESPACE}|g" \
          -e "s|<APP_NAME>|${APP_NAME}|g" \
          -e "s|<GITHUB_OWNER>|${GITHUB_OWNER}|g" \
          -e "s|<GITOPS_REPO_URL>|${GITOPS_REPO_URL}|g" \
          "/opt/platform/onboarding-templates/app-repo/onboarding-resync.yaml" > ".tekton/onboarding-resync.yaml"

        # Every other .tekton/ file comes from named flows under cicd.yaml's
        # `pipelines:` section - see docs/user-guide/cicd-yaml-reference.md. Only a flow's
        # git-rooted first step needs a PaC file here; event-chained later steps (test/
        # deploy/release-after-deploy) are fired by the in-cluster CDEvents broker
        # instead - see charts/platform-cicd-app/templates/triggers/flow-triggers.yaml's
        # own header. Regenerated fresh every run (stale removed first) so a flow
        # deleted from cicd.yaml also disappears from .tekton/, not just accumulates.
        rm -f .tekton/flow-*.yaml
        if [[ -f cicd.yaml ]]; then
          pipelines_json="$(yq -o=json '.pipelines // {}' cicd.yaml)"
          source_volume_size_raw="$(yq -r '.build.sourceVolume.size // "small"' cicd.yaml)"
        else
          pipelines_json="{}"
          source_volume_size_raw="small"
        fi
        # T-shirt lookup for build.sourceVolume.size - same dictionary as
        # charts/platform-cicd-app/templates/_helpers.tpl's sourceVolumeSize helper, but
        # necessarily duplicated as bash rather than shared: this script generates YAML
        # committed straight into the APP's own repo at Tekton runtime, outside Helm's
        # render pass entirely, so it has no access to that helper.
        case "${source_volume_size_raw}" in
          small) SOURCE_VOLUME_STORAGE="2Gi" ;;
          medium) SOURCE_VOLUME_STORAGE="5Gi" ;;
          large) SOURCE_VOLUME_STORAGE="10Gi" ;;
          xlarge) SOURCE_VOLUME_STORAGE="20Gi" ;;
          *) SOURCE_VOLUME_STORAGE="2Gi" ;;
        esac

        # PaC's own dynamic-variable syntax (double-brace-wrapped names like repo_url)
        # uses the same delimiter Helm's template engine renders THIS file with - writing
        # it literally here would make Helm try to parse it instead of passing it through
        # (a real error hit once building this: "unexpected '{' in operand", then again
        # as "function \"repo_url\" not defined" the first time this exact comment
        # accidentally spelled it out literally). Built from printf hex escapes instead,
        # so no literal double-brace sequence ever appears in this file's own source text
        # for Helm to trip over - only assembled at runtime, in the delivered file's
        # actual content.
        OB="$(printf '\x7b\x7b')"
        CB="$(printf '\x7d\x7d')"
        GIT_URL_VAR="${OB} repo_url ${CB}"
        GIT_REVISION_VAR="${OB} revision ${CB}"
        # PaC's source_branch dynamic var carries the raw ref for a tag push (e.g.
        # refs/tags/v1.2.3), matching what build-image.yaml's version-extraction step
        # already expects to strip - see that Task's own git-tag param description.
        # Confirmed live against a real tag push (only user of this var now that
        # release.created is gone - see the tag) case's own comment for why).
        GIT_TAG_VAR="${OB} source_branch ${CB}"

        generate_flow_file() {
          local flow_name="$1" event="$2" branch="$3" tag_pattern="$4" file_paths_json="$5" root_stage="$6"
          local root_env="$7" root_suite="$8" root_cluster="$9" root_name="${10}"
          local on_event="" branch_line="" cel_line="" tag_param_line=""
          # deploy/release/test can all be a flow's git-rooted first step (e.g. a tag
          # push deploying straight to prod, or a test-only flow on a scratch branch -
          # see validateFlows's own header). Their Pipelines read env/suite/cluster/name
          # as regular params either way, same as the event-chained path - only emitted
          # when actually set, so build/other stages' generated files don't carry stray
          # empty params. Previously this whole param quartet was missing here entirely:
          # a git-rooted deploy declaring `env: staging` silently deployed to "dev"
          # instead (deploy.yaml's own Tekton-level default), since nothing here ever
          # passed the declared value through - confirmed by reading deploy.yaml's param
          # list, not yet hit in practice since the one git-rooted deploy example in the
          # docs never overrides the default.
          local root_param_lines=""
          if [[ -n "${root_env}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: env, value: \"${root_env}\" }"
          fi
          if [[ -n "${root_suite}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: suite, value: \"${root_suite}\" }"
          fi
          if [[ -n "${root_cluster}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: cluster, value: \"${root_cluster}\" }"
          fi
          if [[ -n "${root_name}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: name, value: \"${root_name}\" }"
          fi
          # PR-validation builds get their own -pr image repo suffix (kept from the old
          # static pull-request.yaml template) so they never collide with a real release
          # tag in the same registry path.
          local effective_image_repo="${image_repo}"

          case "${event}" in
            push)
              on_event="[push]"
              if [[ -n "${branch}" ]]; then
                branch_line="    pipelinesascode.tekton.dev/on-target-branch: \"[${branch}]\""
              fi
              if [[ "${file_paths_json}" != "[]" ]]; then
                local expr
                # pathChanged() is a suffix method on the glob-pattern string itself
                # ("<pattern>".pathChanged()), not a function taking the pattern as an
                # argument - confirmed live: the inverted form parses (jq/bash don't
                # catch it) but PaC's CEL evaluator rejects it at webhook-delivery time
                # with "no matching overload for 'pathChanged' applied to '(string)'".
                expr="$(echo "${file_paths_json}" | jq -r 'map("\"" + . + "\".pathChanged()") | join(" || ")')"
                cel_line="    pipelinesascode.tekton.dev/on-cel-expression: '${expr}'"
              fi
              ;;
            pull_request)
              on_event="[pull_request]"
              if [[ -n "${branch}" ]]; then
                branch_line="    pipelinesascode.tekton.dev/on-target-branch: \"[${branch}]\""
              fi
              effective_image_repo="${image_repo}-pr"
              ;;
            branch.created)
              on_event="[push]"
              local branch_expr=""
              if [[ -n "${branch}" ]]; then
                # branch.created has no PaC on-target-branch annotation to lean on (that
                # matcher is for an existing branch's own pushes, not "was this ref just
                # created") - confirmed live the previous version of this cel_line ignored
                # trigger.branch entirely, so e.g. Example 5's `branch: "release/*"` never
                # actually filtered: ANY newly created branch fired the flow. Fold the same
                # glob syntax push/pull_request already accept via on-target-branch into
                # CEL instead: escape regex metacharacters, then turn the glob's own "*"
                # into ".*". Raw string (r"...") for the same reason as the tag case below
                # - a pattern containing a literal "." would otherwise need double-escaping.
                local branch_regex
                branch_regex="$(echo "${branch}" | sed -E 's/[.+?^${}()|\[\]\\]/\\&/g; s/\*/.*/g')"
                branch_expr=" && body.ref.matches(r\"refs/heads/${branch_regex}\")"
              fi
              cel_line="    pipelinesascode.tekton.dev/on-cel-expression: 'body.created == true && body.ref.startsWith(\"refs/heads/\")${branch_expr}'"
              ;;
            tag)
              on_event="[push]"
              local pattern="${tag_pattern:-v[0-9]+.[0-9]+.[0-9]+}"
              # A regex tagPattern legitimately contains backslash escapes (\. for a
              # literal dot, etc.) - CEL's own double-quoted string literals treat
              # backslash as their OWN escape character, so splicing the pattern into a
              # plain "..." literal breaks CEL's lexer on any backslash (confirmed live:
              # "token recognition error at: '\"refs/tags/v[0-9]+\\.'"). A CEL raw
              # string (r"...") disables CEL's escape processing so the pattern's own
              # backslashes reach RE2's matches() unmolested.
              cel_line="    pipelinesascode.tekton.dev/on-cel-expression: 'body.ref.startsWith(\"refs/tags/\") && body.ref.matches(r\"refs/tags/${pattern}\")'"
              tag_param_line="    - { name: git-tag, value: \"${GIT_TAG_VAR}\" }"
              ;;
            # No release.created case - deliberately removed. Confirmed live: PaC has no
            # support for GitHub's "release" webhook at all, at any version - a real
            # delivery came back 200 with body {"message":"skipping non supported event"},
            # filtered out before PaC's own annotation/CEL matching ever runs, so no
            # on-event/on-cel-expression combination here could ever have made this fire.
            # Publishing a GitHub Release also creates its underlying tag, which fires a
            # real, working "tag" push event instead (see above) - use that.
          esac

          # Body below is indented 8 spaces to stay inside this step's own `script: |`
          # YAML block scalar (Helm - not bash - requires that; bash heredocs don't care
          # about leading whitespace either way). Helm's own block-scalar parsing already
          # strips that common 8-space indent when it renders this Task, the same way it
          # does for every other multi-line script in this file - no extra stripping
          # needed here, and adding one would double-strip and corrupt nested indentation
          # (caught live: a bare `sed 's/^        //'` here knocked 8 more spaces off
          # every already-8-or-more-indented line, flattening volumeClaimTemplate.spec).
          # generateName is keyed by flow_name, not root_stage - PaC requires every
          # PipelineRun definition under .tekton/ to have a unique generateName/name
          # across the WHOLE repo, not just within one file. Two different flows can
          # legitimately share a root stage (e.g. a "ci" push flow and a "pr-check"
          # pull_request flow both rooted at build) - confirmed live: PaC's matcher
          # aborts the entire event with "found multiple pipelinerun in .tekton with
          # the same generateName: build-, please update" and creates NOTHING, even for
          # the annotation set that matched. flow_name is a cicd.yaml `pipelines:` map
          # key, so it's already guaranteed unique.
          cat <<YAMLEOF
        apiVersion: tekton.dev/v1
        kind: PipelineRun
        metadata:
          generateName: ${flow_name}-
          annotations:
            pipelinesascode.tekton.dev/on-event: "${on_event}"
        ${branch_line}
        ${cel_line}
            pipelinesascode.tekton.dev/max-keep-runs: "5"
        spec:
          pipelineRef:
            resolver: cluster
            params:
              - { name: kind, value: pipeline }
              - { name: name, value: ${root_stage} }
              - { name: namespace, value: platform-catalog }
          params:
            - { name: git-url, value: "${GIT_URL_VAR}" }
            - { name: git-revision, value: "${GIT_REVISION_VAR}" }
            - { name: image-repo, value: "${effective_image_repo}" }
            - { name: app-namespace, value: "${APP_NAMESPACE}" }
            - { name: app-name, value: "${APP_NAME}" }
        ${tag_param_line}${root_param_lines}
          workspaces:
            - name: source
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: ${SOURCE_VOLUME_STORAGE}
          taskRunTemplate:
            serviceAccountName: pipeline-runner
          timeouts:
            pipeline: "1h"
        YAMLEOF
        }

        flow_names="$(echo "${pipelines_json}" | jq -r 'keys[]' 2>/dev/null || true)"
        while IFS= read -r flow_name; do
          [[ -z "${flow_name}" ]] && continue
          flow_json="$(echo "${pipelines_json}" | jq -c --arg n "${flow_name}" '.[$n]')"
          [[ "$(echo "${flow_json}" | jq -r 'type')" != "object" ]] && continue

          trigger_source="$(echo "${flow_json}" | jq -r '.trigger.source // ""')"
          trigger_event="$(echo "${flow_json}" | jq -r '.trigger.event // .trigger.type // ""')"
          if [[ -z "${trigger_source}" ]]; then
            case "${trigger_event}" in
              push|pull_request|branch.created|tag) trigger_source="git" ;;
              *) trigger_source="event" ;;
            esac
          fi
          # Only a flow's git-rooted first step is generated here - event-chained flows
          # (trigger.source: event) and multi-step flows' later steps are entirely the
          # broker/flow-triggers.yaml's responsibility, not PaC's.
          [[ "${trigger_source}" != "git" ]] && continue

          branch="$(echo "${flow_json}" | jq -r '.trigger.branch // ""')"
          tag_pattern="$(echo "${flow_json}" | jq -r '.trigger.tagPattern // ""')"
          file_paths_json="$(echo "${flow_json}" | jq -c '.trigger.filePathPattern // []')"
          root_stage="$(echo "${flow_json}" | jq -r '.steps[0].stage // "build"')"
          root_env="$(echo "${flow_json}" | jq -r '.steps[0].env // ""')"
          root_suite="$(echo "${flow_json}" | jq -r '.steps[0].suite // ""')"
          root_cluster="$(echo "${flow_json}" | jq -r '.steps[0].cluster // ""')"
          root_name="$(echo "${flow_json}" | jq -r '.steps[0].name // ""')"

          generate_flow_file "${flow_name}" "${trigger_event}" "${branch}" "${tag_pattern}" "${file_paths_json}" "${root_stage}" "${root_env}" "${root_suite}" "${root_cluster}" "${root_name}" > ".tekton/flow-${flow_name}.yaml"
          echo "app repo: generated .tekton/flow-${flow_name}.yaml (${trigger_event} -> ${root_stage})"
        done <<< "${flow_names}"

        if git status --porcelain | grep -q .; then
          git config user.name "platform-cicd onboarding automation"
          git config user.email "onboarding@platform-cicd.invalid"
          branch_name="onboarding-resync-$(date +%s)"
          git checkout -b "${branch_name}"
          git add .tekton/
          git commit --quiet -m "$(printf 'Onboarding: re-sync .tekton boilerplate from the platform catalog\n\nRegenerated onboarding-resync.yaml plus one .tekton/flow-<name>.yaml per git-rooted flow declared under cicd.yaml'"'"'s pipelines: - see docs/onboarding.md. No developer action needed beyond merging.')"
          git push --quiet "${clone_url}" "${branch_name}"
          pr_body="$(jq -n \
            --arg title "Onboarding: re-sync .tekton boilerplate" \
            --arg body "Regenerated onboarding-resync.yaml from the platform catalog's onboarding templates, plus one .tekton/flow-<name>.yaml per git-rooted flow declared under cicd.yaml's pipelines: (push/pull_request/tag/branch.created) - see docs/onboarding.md. Fires automatically whenever cicd.yaml changes, or the platform's own onboarding templates change and this Application's files went stale." \
            --arg head "${branch_name}" --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base}')"
          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${owner}/${repo}/pulls" -d "${pr_body}" > /dev/null
          echo "app repo: opened onboarding-resync PR"
        else
          echo "app repo: .tekton/ already up to date, nothing to deliver"
        fi

    - name: deliver-gitops-repo-files
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: onboarding-templates-gitops-repo
          mountPath: /opt/platform/onboarding-templates/gitops-repo
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: GITOPS_REPO_URL
          value: $(params.gitops-repo-url)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ -z "${GITOPS_REPO_URL}" ]]; then
          echo "gitops repo: no gitops-repo-url param given (release stage not declared), skipping"
          exit 0
        fi
        source "${PLATFORM_LIB}/github-app.sh"

        owner="$(echo "${GITOPS_REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${GITOPS_REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"

        token="$(github_app_installation_token "${owner}" "${repo}")"
        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${repo}.git"
        git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"
        mkdir -p .tekton

        for f in /opt/platform/onboarding-templates/gitops-repo/*.yaml; do
          base="$(basename "${f}")"
          sed \
            -e "s|<APP_NAMESPACE>|${APP_NAMESPACE}|g" \
            -e "s|<APP_NAME>|${APP_NAME}|g" \
            "${f}" > ".tekton/${base}"
        done

        if git status --porcelain | grep -q .; then
          git config user.name "platform-cicd onboarding automation"
          git config user.email "onboarding@platform-cicd.invalid"
          branch="onboarding-resync-$(date +%s)"
          git checkout -b "${branch}"
          git add .tekton/
          git commit --quiet -m "$(printf 'Onboarding: re-sync .tekton governance-check boilerplate\n\nRegenerated from the platform catalog'"'"'s onboarding templates - see docs/onboarding.md. No developer action needed beyond merging.')"
          git push --quiet "${clone_url}" "${branch}"
          pr_body="$(jq -n \
            --arg title "Onboarding: re-sync governance-check boilerplate" \
            --arg body "Regenerated the 5 governance-check .tekton files from the platform catalog's onboarding templates - see docs/onboarding.md." \
            --arg head "${branch}" --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base}')"
          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${owner}/${repo}/pulls" -d "${pr_body}" > /dev/null
          echo "gitops repo: opened onboarding-resync PR"
        else
          echo "gitops repo: .tekton/ already up to date, nothing to deliver"
        fi
