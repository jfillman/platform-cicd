# templates/tasks/deliver-onboarding-files.yaml - see docs/onboarding.md.
#
# Replaces manual copy-paste onboarding: mints a fresh, single-repo-scoped GitHub App
# installation token per target repo (never a standing credential), opens a PR rather than
# pushing directly to the default branch, and lets PaC's own webhook auth decide when this
# Task runs (see files/onboarding-templates/app-repo/onboarding-resync.yaml).
#
# Not gitsign-gated: the provenance gate's gitsign verification only runs on the gitops repo's
# release PR, not on either repo's default branch, so this Task's machine commits don't
# need to be signed.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deliver-onboarding-files
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: git-url
      type: string
      description: The app repo's own git-url - only its GitHub org/owner is used.
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: app-type
      type: string
      description: >-
        platformIdentity.type ("app"/"infra"/...) - forwarded into each generated
        git-rooted PipelineRun's app-type param (deploy.yaml/release.yaml need it).
    - name: github-owner
      type: string
    - name: gitops-repo-url
      type: string
      default: ""
      description: >-
        Optional - only needed if this Application's pipeline declares a release stage
        (see the app chart's own conditional rendering). Empty skips the gitops-repo
        delivery half entirely, not an error - unless cicd.yaml itself (read fresh in
        this Task) declares a release stage, in which case the deliver-app-repo-files
        step derives it from the gitops-<app-name> convention instead of trusting a
        possibly-stale empty value forever (see that step's own 2026-08-23 header for
        the real incident this fixed).
  # Same audience-bound projected-ServiceAccount-token pattern as send-cdevent.yaml/
  # open-release-pr.yaml - no new identity or RBAC needed; runs as pipeline-runner.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
    # Rendered by the APP chart (one copy per Application), not this catalog chart -
    # a Pod can only mount a ConfigMap from its own namespace, and this Task's Pod always
    # runs in the calling Application's namespace, not platform-catalog. A fixed ConfigMap
    # name works because each Application's own copy resolves locally, so this one shared
    # Task definition transparently mounts a different copy per tenant.
    - name: onboarding-templates-app-repo
      configMap:
        name: onboarding-templates-app-repo
    - name: onboarding-templates-gitops-repo
      configMap:
        name: onboarding-templates-gitops-repo
  steps:
    - name: deliver-app-repo-files
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: onboarding-templates-app-repo
          mountPath: /opt/platform/onboarding-templates/app-repo
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: GIT_URL
          value: $(params.git-url)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
        - name: APP_TYPE
          value: $(params.app-type)
        - name: GITHUB_OWNER
          value: $(params.github-owner)
        - name: GITOPS_REPO_URL
          value: $(params.gitops-repo-url)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        image_repo="ghcr.io/${GITHUB_OWNER}/${APP_NAME}"

        # app-type is optional so a stale trigger file committed before app-type existed
        # can still fire this Task and self-heal. Derived from app-namespace when absent:
        # every namespace is <type>-<app-name>-cicd, so stripping the suffix recovers type.
        if [[ -z "${APP_TYPE}" ]]; then
          APP_TYPE="${APP_NAMESPACE%-${APP_NAME}-cicd}"
          echo "app-type not supplied - derived '${APP_TYPE}' from app-namespace=${APP_NAMESPACE}"
        fi

        token="$(github_app_installation_token "${owner}" "${repo}")"
        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${repo}.git"
        git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"
        mkdir -p .tekton

        # Read cicd.yaml BEFORE generating onboarding-resync.yaml below (not after, as
        # this used to be ordered) - gitops-repo-url's own derivation fallback needs
        # pipelines_json already in hand. Every other .tekton/ file comes from named
        # flows under cicd.yaml's `pipelines:` section too. Only a flow's git-rooted
        # first step needs a PaC file here - event-chained later steps are fired by the
        # in-cluster CDEvents broker instead.
        if [[ -f cicd.yaml ]]; then
          pipelines_json="$(yq -o=json '.pipelines // {}' cicd.yaml)"
          source_volume_size_raw="$(yq -r '.build.sourceVolume.size // "small"' cicd.yaml)"
          # env name -> cluster lookup ("" for same-cluster), mirroring
          # platform-cicd-app.upperEnvClusters. Necessarily duplicated as jq rather than
          # shared - this script runs as bash against raw cicd.yaml, outside Helm's render
          # pass. Needed so a git-rooted release step that omits cluster: still resolves the
          # right cluster instead of silently falling through to same-cluster (a real bug
          # that hit flow-triggers.yaml's Go-template equivalent too).
          upper_env_clusters_json="$(yq -o=json '.deploy.upperEnvironments // []' cicd.yaml | jq 'map(if type == "object" then {(.name): (.cluster // "")} else {(.): ""} end) | add // {}')"
        else
          pipelines_json="{}"
          source_volume_size_raw="small"
          upper_env_clusters_json="{}"
        fi

        # gitops-repo-url is optional (see this Task's own param description) so a stale
        # trigger file committed before this fallback existed can still fire this Task
        # and self-heal - same reasoning as APP_TYPE's own derivation above, just for a
        # different failure mode. Unlike APP_TYPE (a hard Tekton admission deadlock),
        # this one fails silently: deliver-gitops-repo-files below just skips, forever,
        # since nothing ever re-derives the value from anything live - confirmed live
        # 2026-08-23 against a real tenant (checkout-api) whose trigger file had carried
        # an empty gitops-repo-url since a copy-paste bootstrap from a donor app that
        # genuinely had no release stage, silently skipping every gitops delivery since.
        # Only derived when cicd.yaml actually declares a release stage SOMEWHERE in any
        # flow's steps (not just steps[0], unlike root_stage below - release is
        # typically the LAST step in a build->test->deploy->release chain, not the
        # first) - deriving it unconditionally would send an app with no gitops repo at
        # all into a hard clone failure instead of the intended clean skip.
        #
        # Only fixes the COMMITTED trigger file (onboarding-resync.yaml, via the sed
        # below), for next time - it does NOT retroactively fix THIS run's own
        # deliver-gitops-repo-files step further down, which is a separate container
        # reading $(params.gitops-repo-url) directly (Tekton steps don't share bash
        # variables). A tenant hitting this self-heals over two resync cycles: this run
        # delivers the corrected trigger file as a PR; merging it and pushing cicd.yaml
        # again fires a second run that finally has the right value from the start. Same
        # "heals eventually, not instantly" shape as APP_TYPE's own fix.
        if [[ -z "${GITOPS_REPO_URL}" ]]; then
          has_release="$(echo "${pipelines_json}" | jq -r '[.[] | .steps[]? | select(.stage == "release")] | length > 0')"
          if [[ "${has_release}" == "true" ]]; then
            GITOPS_REPO_URL="https://github.com/${GITHUB_OWNER}/gitops-${APP_NAME}"
            echo "gitops-repo-url not supplied but cicd.yaml declares a release stage - derived '${GITOPS_REPO_URL}' from the gitops-<app-name> convention"
          fi
        fi

        # onboarding-resync.yaml is the only file delivered unconditionally - the trigger
        # that re-invokes this mechanism next time cicd.yaml changes. Everything else is
        # app-specific behavior, generated below from cicd.yaml's own `pipelines:` section;
        # there's no implicit "push to main always builds" default.
        sed \
          -e "s|<APP_NAMESPACE>|${APP_NAMESPACE}|g" \
          -e "s|<APP_NAME>|${APP_NAME}|g" \
          -e "s|<APP_TYPE>|${APP_TYPE}|g" \
          -e "s|<GITHUB_OWNER>|${GITHUB_OWNER}|g" \
          -e "s|<GITOPS_REPO_URL>|${GITOPS_REPO_URL}|g" \
          "/opt/platform/onboarding-templates/app-repo/onboarding-resync.yaml" > ".tekton/onboarding-resync.yaml"

        # Regenerated fresh every run (stale removed first) so a flow deleted from
        # cicd.yaml also disappears.
        rm -f .tekton/flow-*.yaml
        # T-shirt lookup for build.sourceVolume.size, duplicated from the sourceVolumeSize
        # Helm helper since this script runs outside Helm's render pass and can't call it.
        case "${source_volume_size_raw}" in
          small) SOURCE_VOLUME_STORAGE="2Gi" ;;
          medium) SOURCE_VOLUME_STORAGE="5Gi" ;;
          large) SOURCE_VOLUME_STORAGE="10Gi" ;;
          xlarge) SOURCE_VOLUME_STORAGE="20Gi" ;;
          *) SOURCE_VOLUME_STORAGE="2Gi" ;;
        esac

        # PaC's dynamic-variable syntax uses the same double-brace delimiter Helm renders
        # this file with, so writing it literally would make Helm try to parse it instead
        # of passing it through. Built from printf hex escapes instead so no literal
        # double-brace sequence appears in this file's own source.
        OB="$(printf '\x7b\x7b')"
        CB="$(printf '\x7d\x7d')"
        GIT_URL_VAR="${OB} repo_url ${CB}"
        GIT_REVISION_VAR="${OB} revision ${CB}"
        # PaC's source_branch dynamic var carries the raw ref for a tag push (e.g.
        # refs/tags/v1.2.3), matching what build-image.yaml's version-extraction expects.
        GIT_TAG_VAR="${OB} source_branch ${CB}"

        generate_flow_file() {
          local flow_name="$1" event="$2" branch="$3" tag_pattern="$4" file_paths_json="$5" root_stage="$6"
          local root_env="$7" root_suite="$8" root_cluster="$9" root_name="${10}" is_flow_terminal="${11}"
          local on_event="" branch_line="" cel_line="" tag_param_line=""
          # deploy/release/test can all be a flow's git-rooted first step (e.g. a tag push
          # deploying straight to prod). Their Pipelines read env/suite/cluster/name as
          # regular params, only emitted when set. This quartet was previously missing
          # entirely: a git-rooted deploy declaring `env: staging` would have silently
          # deployed to "dev" (deploy.yaml's own Tekton-level default) since nothing passed
          # the declared value through.
          local root_param_lines=""
          if [[ -n "${root_env}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: env, value: \"${root_env}\" }"
          fi
          if [[ -n "${root_suite}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: suite, value: \"${root_suite}\" }"
          fi
          if [[ -n "${root_cluster}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: cluster, value: \"${root_cluster}\" }"
          fi
          if [[ -n "${root_name}" ]]; then
            root_param_lines="${root_param_lines}
            - { name: name, value: \"${root_name}\" }"
          fi
          # PR-validation builds get their own -pr image repo suffix (kept from the old
          # static pull-request.yaml template) so they never collide with a real release
          # tag in the same registry path.
          local effective_image_repo="${image_repo}"
          # pr_tag_only: build-image.yaml's own param - see that Task's comment for why a
          # PR image can't carry the normal <version>-<short-sha> tag (ArgoCD's
          # pullRequest generator, in platform-cicd-app's ephemeral-envs.yaml, has no way
          # to read package.json's version at manifest-generation time, only .head_sha).
          local pr_tag_only="false"

          case "${event}" in
            push)
              on_event="[push]"
              if [[ -n "${branch}" ]]; then
                branch_line="    pipelinesascode.tekton.dev/on-target-branch: \"[${branch}]\""
              fi
              # Guard against deploy-manifests.yaml's own commits re-triggering this flow -
              # a real infinite loop hit live on checkout-api: that Task commits to
              # platform/envs/<env>.yaml on this same branch, which is itself a push to
              # main, which re-triggered build, which deployed again, forever.
              #
              # Uses a CEL expression rather than the separate on-path-change-ignore
              # annotation: PaC's matcher takes the CEL branch entirely whenever
              # on-cel-expression is set and never evaluates on-path-change-ignore, so an
              # app that also sets trigger.paths would silently keep looping if this guard
              # were the separate annotation. One mechanism, always applied, covers both.
              #
              # !("platform/envs/**".pathChanged()), not PaC's docs-stated "skip only if
              # ALL changed files are under this path" semantics: pathChanged() actually
              # matches on ANY changed file (a real gap between docs and implementation).
              # Accepted tradeoff - deploy-manifests.yaml's commits never touch anything
              # else, and a human hand-editing platform/envs/ is expected to do it as its
              # own standalone commit anyway.
              local loop_guard='!("platform/envs/**".pathChanged())'
              if [[ "${file_paths_json}" != "[]" ]]; then
                local expr
                # pathChanged() is a suffix method on the pattern string itself, not a
                # function taking the pattern as an argument - the inverted form parses
                # but PaC's CEL evaluator rejects it at webhook-delivery time.
                expr="$(echo "${file_paths_json}" | jq -r 'map("\"" + . + "\".pathChanged()") | join(" || ")')"
                cel_line="    pipelinesascode.tekton.dev/on-cel-expression: '(${expr}) && ${loop_guard}'"
              else
                cel_line="    pipelinesascode.tekton.dev/on-cel-expression: '${loop_guard}'"
              fi
              ;;
            pull_request)
              on_event="[pull_request]"
              if [[ -n "${branch}" ]]; then
                branch_line="    pipelinesascode.tekton.dev/on-target-branch: \"[${branch}]\""
              fi
              effective_image_repo="${image_repo}-pr"
              pr_tag_only="true"
              ;;
            branch.created)
              on_event="[push]"
              local branch_expr=""
              if [[ -n "${branch}" ]]; then
                # branch.created has no PaC on-target-branch annotation to lean on (that
                # matcher is for an existing branch's pushes, not "was this ref just
                # created"). A previous version of this cel_line ignored trigger.branch
                # entirely, so e.g. `branch: "release/*"` never filtered - any newly
                # created branch fired the flow. Fold the same glob syntax push/pull_request
                # accept via on-target-branch into CEL instead. Raw string (r"...") avoids
                # double-escaping a pattern containing a literal ".".
                local branch_regex
                branch_regex="$(echo "${branch}" | sed -E 's/[.+?^${}()|\[\]\\]/\\&/g; s/\*/.*/g')"
                branch_expr=" && body.ref.matches(r\"refs/heads/${branch_regex}\")"
              fi
              cel_line="    pipelinesascode.tekton.dev/on-cel-expression: 'body.created == true && body.ref.startsWith(\"refs/heads/\")${branch_expr}'"
              ;;
            tag)
              on_event="[push]"
              local pattern="${tag_pattern:-v[0-9]+.[0-9]+.[0-9]+}"
              # A regex tagPattern legitimately contains backslash escapes (\. for a
              # literal dot). CEL's double-quoted literals treat backslash as their own
              # escape character, breaking CEL's lexer on any backslash. A CEL raw string
              # (r"...") disables that escape processing so the pattern reaches RE2 unmolested.
              cel_line="    pipelinesascode.tekton.dev/on-cel-expression: 'body.ref.startsWith(\"refs/tags/\") && body.ref.matches(r\"refs/tags/${pattern}\")'"
              tag_param_line="    - { name: git-tag, value: \"${GIT_TAG_VAR}\" }"
              ;;
            # No release.created case - PaC has no support for GitHub's "release" webhook
            # at any version (confirmed: deliveries come back "skipping non supported
            # event"). Publishing a GitHub Release also creates its underlying tag, which
            # fires the "tag" push event above instead - use that.
          esac

          # Body below is indented 8 spaces to stay inside this step's `script: |` YAML
          # block scalar - Helm strips that common indent when rendering, so don't add any
          # extra stripping here (a bare `sed 's/^        //'` previously flattened
          # volumeClaimTemplate.spec by double-stripping).
          # generateName is keyed by flow_name, not root_stage - PaC requires every
          # PipelineRun under .tekton/ to have a unique generateName across the whole repo.
          # Two flows can share a root stage (e.g. a "ci" push flow and a "pr-check"
          # pull_request flow both rooted at build), which would collide on generateName
          # and make PaC create nothing at all. flow_name (a cicd.yaml map key) is
          # guaranteed unique.
          cat <<YAMLEOF
        apiVersion: tekton.dev/v1
        kind: PipelineRun
        metadata:
          generateName: ${flow_name}-
          labels:
            platform.io/flow: "${flow_name}"
            platform.io/stage: "${root_stage}"
            platform.io/step-index: "0"
          annotations:
            pipelinesascode.tekton.dev/on-event: "${on_event}"
        ${branch_line}
        ${cel_line}
            pipelinesascode.tekton.dev/max-keep-runs: "5"
        spec:
          pipelineRef:
            resolver: cluster
            params:
              - { name: kind, value: pipeline }
              - { name: name, value: ${root_stage} }
              - { name: namespace, value: platform-catalog }
          params:
            - { name: git-url, value: "${GIT_URL_VAR}" }
            - { name: git-revision, value: "${GIT_REVISION_VAR}" }
            - { name: image-repo, value: "${effective_image_repo}" }
            - { name: pr-tag-only, value: "${pr_tag_only}" }
            - { name: app-namespace, value: "${APP_NAMESPACE}" }
            - { name: app-name, value: "${APP_NAME}" }
            - { name: app-type, value: "${APP_TYPE}" }
            - { name: is-flow-terminal, value: "${is_flow_terminal}" }
        ${tag_param_line}${root_param_lines}
          workspaces:
            - name: source
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: ${SOURCE_VOLUME_STORAGE}
          taskRunTemplate:
            serviceAccountName: pipeline-runner
          timeouts:
            pipeline: "1h"
        YAMLEOF
        }

        flow_names="$(echo "${pipelines_json}" | jq -r 'keys[]' 2>/dev/null || true)"
        while IFS= read -r flow_name; do
          [[ -z "${flow_name}" ]] && continue
          flow_json="$(echo "${pipelines_json}" | jq -c --arg n "${flow_name}" '.[$n]')"
          [[ "$(echo "${flow_json}" | jq -r 'type')" != "object" ]] && continue

          trigger_source="$(echo "${flow_json}" | jq -r '.trigger.source // ""')"
          trigger_event="$(echo "${flow_json}" | jq -r '.trigger.event // .trigger.type // ""')"
          if [[ -z "${trigger_source}" ]]; then
            case "${trigger_event}" in
              push|pull_request|branch.created|tag) trigger_source="git" ;;
              *) trigger_source="event" ;;
            esac
          fi
          # Only a flow's git-rooted first step is generated here - event-chained flows
          # and later steps are the broker/flow-triggers.yaml's responsibility, not PaC's.
          [[ "${trigger_source}" != "git" ]] && continue

          branch="$(echo "${flow_json}" | jq -r '.trigger.branch // ""')"
          tag_pattern="$(echo "${flow_json}" | jq -r '.trigger.tagPattern // ""')"
          file_paths_json="$(echo "${flow_json}" | jq -c '.trigger.filePathPattern // []')"
          root_stage="$(echo "${flow_json}" | jq -r '.steps[0].stage // "build"')"
          root_env="$(echo "${flow_json}" | jq -r '.steps[0].env // ""')"
          root_suite="$(echo "${flow_json}" | jq -r '.steps[0].suite // ""')"
          root_cluster="$(echo "${flow_json}" | jq -r '.steps[0].cluster // ""')"
          if [[ -z "${root_cluster}" && "${root_stage}" == "release" ]]; then
            root_cluster="$(jq -r --arg e "${root_env}" '.[$e] // ""' <<<"${upper_env_clusters_json}")"
          fi
          root_name="$(echo "${flow_json}" | jq -r '.steps[0].name // ""')"
          # This function only generates a flow's first step (index 0). is-flow-terminal
          # tells that step's Pipeline to close the flow-root span when it's also the
          # flow's last step (a build-only or single-step-release flow).
          step_count="$(echo "${flow_json}" | jq -r '.steps | length')"
          is_flow_terminal="false"
          [[ "${step_count}" -eq 1 ]] && is_flow_terminal="true"

          generate_flow_file "${flow_name}" "${trigger_event}" "${branch}" "${tag_pattern}" "${file_paths_json}" "${root_stage}" "${root_env}" "${root_suite}" "${root_cluster}" "${root_name}" "${is_flow_terminal}" > ".tekton/flow-${flow_name}.yaml"
          echo "app repo: generated .tekton/flow-${flow_name}.yaml (${trigger_event} -> ${root_stage})"
        done <<< "${flow_names}"

        if git status --porcelain | grep -q .; then
          git config user.name "platform-cicd onboarding automation"
          git config user.email "onboarding@platform-cicd.invalid"
          branch_name="onboarding-resync-$(date +%s)"
          git checkout -b "${branch_name}"
          git add .tekton/
          git commit --quiet -m "$(printf 'Onboarding: re-sync .tekton boilerplate from the platform catalog\n\nRegenerated onboarding-resync.yaml plus one .tekton/flow-<name>.yaml per git-rooted flow declared under cicd.yaml'"'"'s pipelines: - see docs/onboarding.md. No developer action needed beyond merging.')"
          git push --quiet "${clone_url}" "${branch_name}"
          pr_body="$(jq -n \
            --arg title "Onboarding: re-sync .tekton boilerplate" \
            --arg body "Regenerated onboarding-resync.yaml from the platform catalog's onboarding templates, plus one .tekton/flow-<name>.yaml per git-rooted flow declared under cicd.yaml's pipelines: (push/pull_request/tag/branch.created) - see docs/onboarding.md. Fires automatically whenever cicd.yaml changes, or the platform's own onboarding templates change and this Application's files went stale." \
            --arg head "${branch_name}" --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base}')"
          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${owner}/${repo}/pulls" -d "${pr_body}" > /dev/null
          echo "app repo: opened onboarding-resync PR"
        else
          echo "app repo: .tekton/ already up to date, nothing to deliver"
        fi

    - name: deliver-gitops-repo-files
      image: {{ .Values.toolboxImage }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: onboarding-templates-gitops-repo
          mountPath: /opt/platform/onboarding-templates/gitops-repo
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: GITOPS_REPO_URL
          value: $(params.gitops-repo-url)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ -z "${GITOPS_REPO_URL}" ]]; then
          echo "gitops repo: no gitops-repo-url param given (release stage not declared), skipping"
          exit 0
        fi
        source "${PLATFORM_LIB}/github-app.sh"

        owner="$(echo "${GITOPS_REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${GITOPS_REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"

        token="$(github_app_installation_token "${owner}" "${repo}")"
        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${repo}.git"
        git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"
        mkdir -p .tekton

        for f in /opt/platform/onboarding-templates/gitops-repo/*.yaml; do
          base="$(basename "${f}")"
          sed \
            -e "s|<APP_NAMESPACE>|${APP_NAMESPACE}|g" \
            -e "s|<APP_NAME>|${APP_NAME}|g" \
            "${f}" > ".tekton/${base}"
        done

        if git status --porcelain | grep -q .; then
          git config user.name "platform-cicd onboarding automation"
          git config user.email "onboarding@platform-cicd.invalid"
          branch="onboarding-resync-$(date +%s)"
          git checkout -b "${branch}"
          git add .tekton/
          git commit --quiet -m "$(printf 'Onboarding: re-sync .tekton governance-check boilerplate\n\nRegenerated from the platform catalog'"'"'s onboarding templates - see docs/onboarding.md. No developer action needed beyond merging.')"
          git push --quiet "${clone_url}" "${branch}"
          pr_body="$(jq -n \
            --arg title "Onboarding: re-sync governance-check boilerplate" \
            --arg body "Regenerated the 5 governance-check .tekton files from the platform catalog's onboarding templates - see docs/onboarding.md." \
            --arg head "${branch}" --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base}')"
          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${owner}/${repo}/pulls" -d "${pr_body}" > /dev/null
          echo "gitops repo: opened onboarding-resync PR"
        else
          echo "gitops repo: .tekton/ already up to date, nothing to deliver"
        fi
