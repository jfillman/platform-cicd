# catalog/tasks/validate-cicd-config.yaml
#
# Always the FIRST Task in every Pipeline. Reads cicd.yaml fresh from the triggering
# commit's workspace and validates it against schemas/cicd.schema.json, failing fast
# with a developer-readable error instead of surfacing a malformed-config problem as a
# cryptic failure deep inside build/deploy. There is deliberately no separate
# synced/cached copy of this config anywhere - see docs/cicd-yaml-reference.md.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-cicd-config
  labels:
    platform.io/catalog: "true"
spec:
  description: Validates the developer-facing cicd.yaml against the platform schema.
  workspaces:
    - name: source
  params:
    - name: config-path
      type: string
      default: cicd.yaml
  results:
    - name: config-json
      description: cicd.yaml converted to JSON, so downstream Tasks read it with jq instead of re-parsing YAML.
    - name: has-build-script
      description: "'true'/'false' - whether build.script is present in cicd.yaml. Drives build.yaml's when: gate on the build-source Task, for teams doing the whole build inside a multi-stage Dockerfile instead. See docs/cicd-yaml-reference.md."
  steps:
    - name: validate
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CONFIG_FILE="$(workspaces.source.path)/$(params.config-path)"

        if [[ ! -f "${CONFIG_FILE}" ]]; then
          echo "error: ${CONFIG_FILE} not found." >&2
          echo "Every app repo needs a cicd.yaml at its root - see docs/cicd-yaml-reference.md" >&2
          exit 1
        fi

        yq -o=json '.' "${CONFIG_FILE}" > /tmp/cicd.json

        if ! yajsv -s /opt/platform/schemas/cicd.schema.json /tmp/cicd.json; then
          echo "" >&2
          echo "error: cicd.yaml failed schema validation (see above)." >&2
          echo "Reference: docs/cicd-yaml-reference.md" >&2
          exit 1
        fi

        cp /tmp/cicd.json "$(results.config-json.path)"

        HAS_BUILD_SCRIPT="$(jq -r 'if .build.script != null and .build.script != "" then "true" else "false" end' /tmp/cicd.json)"
        echo -n "${HAS_BUILD_SCRIPT}" | tee "$(results.has-build-script.path)" > /dev/null

        echo "cicd.yaml is valid."
