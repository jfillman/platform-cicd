# catalog/tasks/open-release-pr.yaml
#
# Opens a PR against the Application's GitOps repo, promoting the already-built (never
# rebuilt) image to whichever upper env the release step declared (env:, validated
# against deploy.upperEnvironments - see docs/multi-cluster.md) - the actual
# GitOps-repo->cluster deploy happens later,
# driven entirely by ArgoCD once the PR merges (see platform/argocd/ manifests). This
# Task never touches the cluster directly.
#
# Ported from a real prior production pattern (analyzed live from
# gitops-main/charts/cd-pipelines' task-gitops-deploy-yq.yaml/task-create-pr.yaml - see
# docs/release.md): a surgical `yq` patch of the image field, not a full manifest
# re-render, then a plain GitHub REST API PR creation call. The credential is different
# though - the old system used a long-lived, separately-minted static-ish token; this
# uses a fresh, single-repo-scoped GitHub App installation token minted per-run via the
# shared broker (see catalog/lib/github-app.sh), so nothing this Task holds could reach
# any repo beyond the one gitops repo it was authorized for.
#
# GitOps repo is resolved by convention - gitops-<app-name>, same GitHub org as the
# app's own git-url - rather than a new cicd.yaml field, deliberately not assuming
# app-namespace == org (see charts/platform-cicd-app/templates/triggers/fire-test.yaml's
# git-url comment for why that assumption already broke once in this platform).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: open-release-pr
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: image-ref
      type: string
      description: The already-built image reference (by digest) to promote.
    - name: git-url
      type: string
      description: The app repo's git-url - only its GitHub org/owner is used, to derive the gitops repo's owner.
    - name: app-name
      type: string
    - name: git-revision
      type: string
    - name: env
      type: string
      default: "staging"
      description: >-
        The upper environment being promoted to (from the release step's own cicd.yaml
        env: field, validated against deploy.upperEnvironments - see
        docs/multi-cluster.md). Default "staging" only for direct invocation outside
        the normal flow (e.g. manual testing) - a real release always passes this
        explicitly via release.yaml's own env param.
    - name: cluster
      type: string
      default: ""
      description: >-
        Name of a cluster-registry entry (see docs/multi-cluster.md), set only when
        this env is mapped to a different physical cluster. Empty for the common
        same-cluster case. When set, this Task also writes/updates that cluster's
        GitOps-delivered Application manifest, RBAC, and outcome-reporting hook Jobs
        (since mark-release-pending.yaml can't reach a remote cluster's API) in the
        SAME commit as the image-tag patch - see the app-of-apps section below.
    - name: app-namespace
      type: string
      default: ""
      description: Only used when cluster is set - see mark-release-pending.yaml's own param of the same name for what this feeds.
    - name: app-type
      type: string
      default: ""
      description: >-
        Only used when cluster is set - platformIdentity.type, needed to construct the
        GitOps-delivered Application's destination namespace as
        <app-type>-<app-name>-<env>, matching deploy.yaml's own identical convention
        (see docs/concepts.md) rather than the shorter <app-name>-<env> this Task uses
        for the Application's own metadata.name (a different, deliberately type-less
        convention - see release-application.yaml).
    - name: flow-start-time
      type: string
      default: ""
      description: Only used when cluster is set - the Lead Time start anchor, same as mark-release-pending.yaml's own param.
    - name: config-json
      type: string
      default: "{}"
      description: >-
        Only used when cluster is set - this Pipeline's own already-resolved
        config-json (see release.yaml/resolve-notify-config.yaml), baked (as base64)
        into the outcome-reporting hook Jobs below so the eventual ArgoCD-hook -> relay
        -> broker path (docs/multi-cluster.md) can feed it straight to notify-slack
        without a second clone+resolve - it's already been resolved once, in this very
        Pipeline run.
  results:
    - name: pr-url
      description: URL of the opened (or already-open, on retry) release PR.
  # Audience-bound projected ServiceAccount token for the shared broker's GitHub
  # token-minting endpoint - see catalog/lib/github-app.sh. Same pattern as
  # send-cdevent.yaml's broker-token volume, different audience/endpoint.
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
  steps:
    - name: open-pr
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: IMAGE_REF
          value: $(params.image-ref)
        - name: GIT_URL
          value: $(params.git-url)
        - name: APP_NAME
          value: $(params.app-name)
        - name: GIT_REVISION
          value: $(params.git-revision)
        - name: ENV
          value: $(params.env)
        - name: CLUSTER
          value: $(params.cluster)
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_TYPE
          value: $(params.app-type)
        - name: FLOW_START_TIME
          value: $(params.flow-start-time)
        - name: CONFIG_JSON
          value: $(params.config-json)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        # GIT_URL is "https://github.com/<owner>/<repo>[.git]" - only the owner segment
        # is used; the gitops repo's own name is always gitops-<app-name> by convention.
        owner="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        gitops_repo="gitops-${APP_NAME}"

        token="$(github_app_installation_token "${owner}" "${gitops_repo}")"

        workdir="$(mktemp -d)"
        clone_url="https://x-access-token:${token}@github.com/${owner}/${gitops_repo}.git"
        git clone --quiet "${clone_url}" "${workdir}/repo"
        cd "${workdir}/repo"

        branch="release-${GIT_REVISION:0:8}-$(date +%s)"
        git checkout -b "${branch}"

        manifest="${APP_NAME}/${ENV}/deployment.yaml"
        yq -i -e ".spec.template.spec.containers[0].image = \"${IMAGE_REF}\"" "${manifest}"

        # GitOps app-of-apps delivery (docs/multi-cluster.md) - only when this env is
        # mapped to a different physical cluster. The Application CR is written into
        # THIS SAME repo/commit/PR rather than applied to the remote cluster directly -
        # that remote cluster's own ArgoCD (bootstrapped once, out of band, to watch
        # this path - see hack/bootstrap-upper-cluster.sh) picks it up on its own once
        # this PR merges. This is the whole point of the design: this Task never holds
        # a credential for, or makes a single API call to, the remote cluster - only
        # ever a git commit it already had rights to make.
        if [[ -n "${CLUSTER}" ]]; then
          registry_entry="$(kubectl get configmap cluster-registry -n platform-system -o jsonpath="{.data.${CLUSTER}}")"
          if [[ -z "${registry_entry}" ]]; then
            echo "error: cluster '${CLUSTER}' has no entry in the cluster-registry ConfigMap (platform-system) - see charts/platform-cicd-control-plane's clusters: values." >&2
            exit 1
          fi
          apps_path="$(jq -r '.gitopsApplicationsPath' <<<"${registry_entry}")"
          mkdir -p "${apps_path}"
          app_manifest="${apps_path}/${APP_NAME}-${ENV}.yaml"

          # Application manifest: STRUCTURAL only (name/labels/spec) - no
          # per-release annotations here. A real race condition, caught by the user
          # reviewing this design rather than by testing: this file is synced by the
          # app-of-apps ROOT Application, on its own independent reconcile loop,
          # decoupled from when the CHILD Application (watching ${APP_NAME}/${ENV}/,
          # below) actually syncs deployment.yaml. Nothing guarantees the root's
          # sync of THIS file completes before the child's deploy sync does, so any
          # per-release data written here could still be a PREVIOUS release's values
          # by the time anything downstream reads it. Fixed not by moving the data
          # somewhere the root still writes (an earlier version of this Task tried
          # that, twice), but by never putting per-release data anywhere the root
          # owns at all - see the outcome-reporting hook Jobs further down, written
          # into the path the CHILD watches instead, and docs/multi-cluster.md.
          #
          # project: default (ArgoCD's built-in, unscoped project) - this pass
          # doesn't also GitOps-deliver a matching scoped AppProject to the remote
          # cluster; a real gap, not hidden - see docs/multi-cluster.md.
          #
          # Plain public HTTPS URL, no embedded credential (unlike clone_url above,
          # which carries this Task's own short-lived, single-repo-scoped token) - the
          # remote cluster's ArgoCD needs its OWN way to read this repo, configured
          # separately at that cluster's onboarding time, out of scope for this Task.
          # Assumes a public repo for now, matching every gitops-<app> repo this
          # platform has onboarded so far (see docs/multi-cluster.md) - a private
          # gitops repo would need a repo-credential Secret configured on the target
          # cluster's ArgoCD, not handled here.
          #
          # syncOptions: [CreateNamespace=true] here, unlike the same-cluster path
          # (release-application.yaml renders an explicit Namespace object instead) -
          # this is a fresh delivery mechanism with no existing pattern to match
          # exactly, and letting ArgoCD create the destination namespace itself avoids
          # needing to author/maintain a second resource in this same generated file.
          #
          # printf with explicit \n's, one line per arg - NOT a raw multi-line heredoc.
          # This file's own commit_message/governance_text below already hit this
          # exact bug once: a block of literal, unindented multi-line content sitting
          # inside this Task's YAML `script: |` block scalar de-indents relative to it
          # and prematurely terminates the block scalar, corrupting the surrounding
          # Task's own YAML (confirmed live while building this - `helm lint` failed
          # with "could not find expected ':'" pointing at unrelated LATER lines).
          printf '%s\n' \
            'apiVersion: argoproj.io/v1alpha1' \
            'kind: Application' \
            'metadata:' \
            "  name: ${APP_NAME}-${ENV}" \
            '  namespace: argocd' \
            '  labels:' \
            "    platform.io/app: ${APP_NAME}" \
            "    platform.io/env: ${ENV}" \
            '    platform.io/subcomponent: argocd' \
            '    platform.io/dora-track: "true"' \
            'spec:' \
            '  project: default' \
            '  source:' \
            "    repoURL: https://github.com/${owner}/${gitops_repo}.git" \
            '    targetRevision: main' \
            "    path: ${APP_NAME}/${ENV}" \
            '  destination:' \
            '    server: https://kubernetes.default.svc' \
            "    namespace: ${APP_TYPE}-${APP_NAME}-${ENV}" \
            '  syncPolicy:' \
            '    automated:' \
            '      prune: true' \
            '      selfHeal: true' \
            '    syncOptions:' \
            '      - CreateNamespace=true' \
            > "${app_manifest}"

          git add "${app_manifest}"
          echo "[open-release-pr] cluster=${CLUSTER}: wrote ${app_manifest}"
        fi

        git config user.name "platform-cicd release automation"
        git config user.email "release@platform-cicd.invalid"

        # X-App-Repo/X-App-Commit trailers (Phase 3 item 2, docs/commit-signing.md) are
        # how catalog/tasks/verify-commit-signature.yaml, running as a check on THIS
        # gitops repo's own PR, finds its way back to the app-repo commit that actually
        # needs a verified human signature - the gitops commit itself is machine-
        # generated right here, never hand-signed, so there's nothing meaningful to
        # verify on it directly. Full 40-char SHA, not the 12-char truncation used
        # elsewhere for the image tag - 12 hex chars isn't reliably enough to
        # unambiguously `git fetch` one specific commit. Built with printf + \n escapes,
        # not a raw multi-line string - the exact same reason the PR body below already
        # needed this (a raw embedded-newline heredoc broke YAML parsing once this
        # session, see docs/release.md's git history for that fix).
        commit_message="$(printf 'Release: promote %s to %s @ %s\n\nX-App-Repo: %s\nX-App-Commit: %s' \
          "${APP_NAME}" "${ENV}" "${IMAGE_REF}" "${GIT_URL}" "${GIT_REVISION}")"
        git commit --quiet -am "${commit_message}"
        git push --quiet "${clone_url}" "${branch}"

        # Field vocabulary/ordering matches docs/design-language.md (App/Repo/Commit/
        # Image) - the same shared language as the Slack notifications
        # (catalog/tasks/notify-slack.yaml), applied here in GitHub-flavored markdown.
        # No color here (unlike Slack) - GitHub PR bodies can't carry inline color
        # without an embedded badge image, which would itself be the kind of flashy the
        # design language explicitly isn't going for. Tenant/Run are Slack-only fields -
        # not meaningful to an external PR reviewer. Repo-short derived with the exact
        # same sed pattern notify-slack.yaml uses, not a second, differently-behaved
        # technique - the two should never diverge for the same input.
        repo_short="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/([^/.]+).*#\1/\2#')"
        commit_short="${GIT_REVISION:0:12}"
        # Governance section (Phase 3 item 8.6): explains what each of the four
        # independent, required GitHub Checks on this PR actually does and how to
        # re-trigger one that fails - PaC's own `/retest <name>` comment mechanism
        # already exists natively (see docs/release.md), this just writes it down where
        # a developer will actually see it. sast/image-scan/policy-check are real as of
        # Phase 3 items 8.4/8.5/item 2; sbom is still a stub pending 8.7 - stated plainly,
        # not glossed over, same "make stub-ness structurally loud" principle this
        # platform has held since Phase 1. Built with the same printf+\n-escape technique
        # already used for commit_message above, not a raw heredoc - a raw multi-line
        # string broke this file's own YAML parsing once already, see docs/release.md.
        governance_text="$(printf '\n\n## Governance checks\n\n| Check | What it verifies | Status |\n|---|---|---|\n| `sast` | Static analysis (Semgrep) of the promoted commit'"'"'s source | real |\n| `image-scan` | Vulnerability scan (Trivy) of the promoted image | real |\n| `policy-check` | Commit signature (gitsign) + SLSA provenance (Conforma) | real |\n| `sbom` | Software bill of materials | not yet real - see docs/governance-stubs.md |\n\n**If a check fails**: comment `/retest <check-name>` on this PR to re-run just that one (e.g. `/retest sast`), or `/retest` alone to re-run all of them. Fix the underlying issue first if the failure is real - re-running does not bypass a check, it only re-evaluates it.')"
        pr_body_text="$(printf '**App**: %s\n**Env**: %s\n**Repo**: [%s](%s)\n**Commit**: [`%s`](%s/commit/%s)\n**Image**: `%s`\n\nMerging this PR triggers ArgoCD to sync it to %s. See docs/release.md.%s' \
          "${APP_NAME}" "${ENV}" "${repo_short}" "${GIT_URL}" "${commit_short}" "${GIT_URL}" "${GIT_REVISION}" "${IMAGE_REF}" "${ENV}" "${governance_text}")"
        pr_body="$(jq -n \
          --arg title "Release: ${APP_NAME} @ ${GIT_REVISION}" \
          --arg body "${pr_body_text}" \
          --arg head "${branch}" \
          --arg base "main" \
          '{title: $title, body: $body, head: $head, base: $base}')"

        pr_response="$(curl --fail --silent --show-error \
          -X POST -H "Authorization: Bearer ${token}" \
          -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${owner}/${gitops_repo}/pulls" \
          -d "${pr_body}")"
        pr_url="$(jq -r '.html_url' <<<"${pr_response}")"

        # Outcome-reporting: tracking annotations on deployment.yaml itself, plus
        # RBAC and two ArgoCD sync-hook Jobs - deliberately a SECOND commit on this
        # same branch, pushed only now, AFTER the PR above already exists. Both the
        # annotations and the hook Jobs carry this PR's own URL (pr_url, just
        # resolved), and a PR's URL/number don't exist until GitHub actually creates
        # it - there's no way to have included them in the first commit. A second
        # commit on an already-open PR's branch is ordinary: GitHub just shows it as
        # one more commit already part of the same PR, nothing to re-open.
        if [[ -n "${CLUSTER}" ]]; then
          # Deployment annotations are pure operator visibility - NOT part of the
          # outcome-reporting mechanism itself (the hook Jobs below carry the data
          # ArgoCD actually reports with, independently). This just lets a human
          # doing `kubectl describe deployment`/`get -o yaml` on the live upper-env
          # cluster see which build/commit/PR produced what's running, without
          # cross-referencing pipeline logs. Redundant with the hook payload by
          # design - different reader, same underlying facts. platform.io/dora-
          # prefix matches mark-release-pending.yaml's own same-cluster annotation
          # convention, even though the DORA exporter itself doesn't read these (it
          # gets its own copy via the hook Jobs) - same namespace, same intent, one
          # convention rather than two.
          yq -i -e "
            .metadata.annotations[\"platform.io/dora-git-revision\"] = \"${GIT_REVISION}\" |
            .metadata.annotations[\"platform.io/dora-image\"] = \"${IMAGE_REF}\" |
            .metadata.annotations[\"platform.io/dora-flow-start-time\"] = \"${FLOW_START_TIME}\" |
            .metadata.annotations[\"platform.io/dora-gitops-pr-url\"] = \"${pr_url}\"
          " "${manifest}"
          git add "${manifest}"

          # Two ArgoCD sync-hook Jobs, deliberately in ${APP_NAME}/${ENV}/ alongside
          # deployment.yaml (NOT ${apps_path} alongside the Application manifest
          # above) - this is the path the CHILD Application actually syncs, so these
          # hooks run as part of the exact same sync operation as the image-tag
          # change, with no dependency on the app-of-apps ROOT Application's own,
          # independently-timed reconcile at all.
          #
          # This replaced an ArgoCD-Notifications-based design entirely, not just its
          # data source - see docs/multi-cluster.md for the two real, live-confirmed
          # reasons: Notifications fired on ANY completed sync (including pure
          # selfHeal drift-correction with zero release involved), and per-release
          # data read off the Application object's own metadata was racy against the
          # root's reconcile timing. A hook only runs when the resources in ITS OWN
          # sync actually needed reapplying, and PostSync specifically only fires once
          # those resources are deployed AND healthy (both confirmed live) - so there
          # is no live object to read here at all, only env vars baked in below, at
          # the exact moment this Task already has the real values in hand.
          #
          # hook-delete-policy: BeforeHookCreation is load-bearing, not cleanup - a
          # Job with unchanged content across releases wouldn't be re-applied at all
          # (nothing for ArgoCD to diff), so without this the hook would only ever
          # fire on the FIRST release to this env and silently never again.
          #
          # PHASE is the one thing that differs between the two Jobs - which hook ran
          # already tells us the outcome, no live status read needed. PR_URL rides
          # along purely so the eventual release-outcome Slack message can link back
          # to this PR - see notify-slack.yaml's own pr-url param.
          #
          # config-json travels as base64, not raw JSON - the one field here that can
          # contain real quotes/braces, and base64 sidesteps any risk of this
          # printf-per-line approach mis-escaping it (catalog/lib/argocd-outcome-hook.sh
          # only decodes it at the very end, right before sending). Every other field
          # is a plain flat string, safe as-is.
          registry_relay_url="$(jq -r '.outcomeRelayURL' <<<"${registry_entry}")"
          CONFIG_JSON_B64="$(printf '%s' "${CONFIG_JSON}" | base64 | tr -d '\n')"

          rbac="${APP_NAME}/${ENV}/platform-outcome-rbac.yaml"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: ServiceAccount' \
            'metadata:' \
            '  name: platform-outcome-hook' \
            '---' \
            'apiVersion: rbac.authorization.k8s.io/v1' \
            'kind: Role' \
            'metadata:' \
            '  name: platform-outcome-hook' \
            'rules:' \
            '  - apiGroups: [""]' \
            '    resources: ["secrets"]' \
            '    resourceNames: ["platform-outcome-relay-token"]' \
            '    verbs: ["get"]' \
            '---' \
            'apiVersion: rbac.authorization.k8s.io/v1' \
            'kind: RoleBinding' \
            'metadata:' \
            '  name: platform-outcome-hook' \
            'roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-outcome-hook }' \
            'subjects:' \
            '  - kind: ServiceAccount' \
            '    name: platform-outcome-hook' \
            > "${rbac}"
          git add "${rbac}"

          for hook_variant in "postsync:PostSync:Succeeded" "syncfail:SyncFail:Failed"; do
            hook_file="${hook_variant%%:*}"; rest="${hook_variant#*:}"
            hook_type="${rest%%:*}"; hook_phase="${rest#*:}"
            hook_manifest="${APP_NAME}/${ENV}/platform-outcome-${hook_file}.yaml"
            printf '%s\n' \
              'apiVersion: batch/v1' \
              'kind: Job' \
              'metadata:' \
              "  name: platform-outcome-${hook_file}" \
              '  annotations:' \
              "    argocd.argoproj.io/hook: ${hook_type}" \
              '    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation' \
              '  labels:' \
              "    platform.io/app: ${APP_NAME}" \
              '    platform.io/subcomponent: outcome-hook' \
              'spec:' \
              '  backoffLimit: 2' \
              '  activeDeadlineSeconds: 60' \
              '  template:' \
              '    spec:' \
              '      serviceAccountName: platform-outcome-hook' \
              '      restartPolicy: Never' \
              '      containers:' \
              '        - name: notify' \
              '          image: ghcr.io/jfillman/platform-cicd-toolbox:latest' \
              '          command: ["/opt/platform/lib/argocd-outcome-hook.sh"]' \
              '          env:' \
              '            - name: POD_NAMESPACE' \
              '              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }' \
              "            - { name: RELAY_URL, value: \"${registry_relay_url}\" }" \
              "            - { name: APP_NAMESPACE, value: \"${APP_NAMESPACE}\" }" \
              "            - { name: APP_NAME, value: \"${APP_NAME}\" }" \
              "            - { name: ENV, value: \"${ENV}\" }" \
              "            - { name: PHASE, value: \"${hook_phase}\" }" \
              "            - { name: GIT_URL, value: \"${GIT_URL}\" }" \
              "            - { name: GIT_REVISION, value: \"${GIT_REVISION}\" }" \
              "            - { name: FLOW_START_TIME, value: \"${FLOW_START_TIME}\" }" \
              "            - { name: PR_URL, value: \"${pr_url}\" }" \
              "            - { name: CONFIG_JSON_B64, value: \"${CONFIG_JSON_B64}\" }" \
              > "${hook_manifest}"
            git add "${hook_manifest}"
            echo "[open-release-pr] cluster=${CLUSTER}: wrote ${hook_manifest}"
          done

          git commit --quiet -m "Add outcome-reporting hooks for ${ENV} (see ${pr_url})"
          git push --quiet "${clone_url}" "${branch}"
        fi

        echo "${pr_url}" | tee "$(results.pr-url.path)"
