# catalog/tasks/detect-bypass-merge.yaml
#
# Break-glass audit, Phase 3 item 8.6. Policy decided with the user: bypass access is a
# dedicated platform role/group (a manual GitHub branch-protection setting - see
# docs/release.md, not something this platform's own code can grant), and every bypass
# merge gets a real Slack alert in addition to GitHub's own audit trail (branch
# protection bypass is already visible on the PR/commit, but a security-relevant event
# like this shouldn't rely on someone thinking to go look).
#
# Fires on a gitops-repo PR closing (merged or not - see the new
# pull-request-merged.yaml trigger's own on-cel-expression). Detection mechanism: fetch
# the four governance check-runs (sast/image-scan/policy-check/sbom) for the PR's own
# head commit (its state at the moment of merge, not the merge commit itself, which has
# no check-runs of its own) - if the PR was actually merged AND any of those four isn't
# a real "success", that combination could only happen via a branch-protection bypass,
# since a normal merge requires all required checks green. A merged PR where every check
# succeeded is the overwhelmingly common case and produces no alert - this is a
# not-a-bypass detector as much as a bypass one, deliberately quiet otherwise.
#
# Always alerts (does not check notifications.slack.enabled the way notify-slack.yaml
# does) - a security bypass event shouldn't be silenceable via a routine notification
# preference. Uses the same per-tenant slack-webhook-url Secret notify-slack.yaml
# already established (Phase 3 item 3) and the same design-language visual conventions
# (docs/design-language.md), since this PipelineRun executes under the same tenant
# namespace/ServiceAccount as every other gitops-repo governance check.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: detect-bypass-merge
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  description: Checks whether a just-closed gitops-repo PR merged despite a non-passing required governance check, and alerts Slack if so.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's `repo_url`.
    - name: pr-number
      type: string
      description: PaC's `pull_request_number` (or equivalent raw body field - see the trigger file's own comment on how this is sourced).
    - name: merged
      type: string
      description: "'true'/'false' - whether the PR actually merged (vs. just closed unmerged, which is never a bypass and skips this check entirely)."
  volumes:
    - name: github-token-broker-token
      projected:
        sources:
          - serviceAccountToken:
              path: github-token-broker-token
              audience: github-installation-token
              expirationSeconds: 600
    - name: slack-webhook
      secret:
        secretName: slack-webhook-url
        optional: true
  steps:
    - name: check
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      volumeMounts:
        - name: github-token-broker-token
          mountPath: /var/run/secrets/platform
          readOnly: true
        - name: slack-webhook
          mountPath: /var/run/secrets/slack
          readOnly: true
      env:
        - name: GITHUB_TOKEN_BROKER_URL
          value: http://cdevents-broker-auth.platform-system.svc.cluster.local:8080/github-installation-token
        - name: REPO_URL
          value: $(params.repo-url)
        - name: PR_NUMBER
          value: $(params.pr-number)
        - name: MERGED
          value: $(params.merged)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/github-app.sh"

        if [[ "${MERGED}" != "true" ]]; then
          echo "PR closed without merging - not a bypass candidate, nothing to check."
          exit 0
        fi

        owner="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/([^/]+)/.*#\1#')"
        repo="$(echo "${REPO_URL}" | sed -E 's#https?://github\.com/[^/]+/([^/.]+).*#\1#')"
        token="$(github_app_installation_token "${owner}" "${repo}")"

        pr_json="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${owner}/${repo}/pulls/${PR_NUMBER}")"
        head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
        merged_by="$(jq -r '.merged_by.login // "unknown"' <<<"${pr_json}")"
        pr_title="$(jq -r '.title' <<<"${pr_json}")"
        pr_url="$(jq -r '.html_url' <<<"${pr_json}")"

        checks_json="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${owner}/${repo}/commits/${head_sha}/check-runs")"

        # The four governance gates every gitops repo's .tekton/pull-request-*.yaml
        # establishes (docs/release.md) - checked by name, not "were all check-runs
        # green", so an unrelated future Check some other tool adds doesn't produce a
        # false positive/negative here.
        failed_checks=""
        for gate in sast image-scan policy-check sbom; do
          conclusion="$(jq -r --arg name "Pipelines as Code CI / ${gate}" \
            '[.check_runs[] | select(.name == $name)][0].conclusion // "missing"' <<<"${checks_json}")"
          if [[ "${conclusion}" != "success" ]]; then
            failed_checks="${failed_checks}${failed_checks:+, }${gate} (${conclusion})"
          fi
        done

        if [[ -z "${failed_checks}" ]]; then
          echo "All governance checks passed on ${head_sha} - normal merge, no bypass detected."
          exit 0
        fi

        echo "BYPASS DETECTED: PR #${PR_NUMBER} merged by ${merged_by} despite: ${failed_checks}" >&2

        WEBHOOK_URL="$(cat /var/run/secrets/slack/slack-webhook-url 2>/dev/null || true)"
        if [[ -z "${WEBHOOK_URL}" ]]; then
          echo "warn: no slack-webhook-url secret mounted for this tenant - bypass detected but could not alert Slack (see the log line above)" >&2
          exit 0
        fi

        # Same blue/red design language as notify-slack.yaml (docs/design-language.md) -
        # a bypass is always the red case, no success branch needed here.
        payload="$(jq -n \
          --arg headerText "⚠ ${owner}/${repo} · Break-glass merge" \
          --arg prTitle "${pr_title}" \
          --arg prUrl "${pr_url}" \
          --arg mergedBy "${merged_by}" \
          --arg failedChecks "${failed_checks}" \
          --arg footer "platform-cicd · $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '
          def field(fieldLabel; fieldValue): {type: "mrkdwn", text: ("*" + fieldLabel + "*\n" + fieldValue)};
          {
            attachments: [{
              color: "#B91C1C",
              blocks: [
                {type: "header", text: {type: "plain_text", text: $headerText, emoji: true}},
                {type: "section", fields: [
                  field("PR"; "<" + $prUrl + "|" + $prTitle + ">"),
                  field("Merged by"; $mergedBy),
                  field("Failing checks"; $failedChecks)
                ]},
                {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
              ]
            }]
          }
          ')"

        curl --fail --silent --show-error --max-time 10 \
          -X POST "${WEBHOOK_URL}" \
          -H 'Content-Type: application/json' \
          -d "${payload}"
