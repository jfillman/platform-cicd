# catalog/tasks/extract-promoted-image.yaml
#
# Clones a tenant's gitops-repo PR head commit and reads the image reference
# open-release-pr.yaml's yq patch put into the staging Deployment manifest - the actual
# image about to be promoted. Used by image-scan-check.yaml (Phase 3 item 8.5); intended
# for reuse by any future gate that needs "which image is this PR actually promoting"
# rather than app-repo source (see resolve-app-commit.yaml for the source-code
# equivalent, used by sast-check.yaml - a deliberately different resolution mechanism,
# not reused here: this needs the image the manifest points at, not a source checkout).
#
# Finds the manifest via `find ... -path '*/staging/deployment.yaml'` rather than a
# hardcoded <app-name>/staging/deployment.yaml path - works regardless of exactly how
# deep the app's own subdirectory nesting is inside the gitops repo (confirmed live
# against the real gitops-nodejs-demo-app layout: nodejs-demo-app/staging/deployment.yaml,
# one level deeper than a naive staging/deployment.yaml guess would have assumed).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-promoted-image
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  description: Clones a tenant's gitops-repo PR head commit and reads the promoted image reference from its staging Deployment manifest.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's `repo_url`.
    - name: revision
      type: string
      description: The gitops PR's head commit - PaC's `revision`.
  results:
    - name: image-ref
  steps:
    - name: extract
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        workdir="$(mktemp -d)"
        git clone --quiet "${REPO_URL}" "${workdir}/gitops"
        cd "${workdir}/gitops"
        git checkout --quiet "${REVISION}"

        manifest="$(find . -path '*/staging/deployment.yaml' | head -1)"
        if [[ -z "${manifest}" ]]; then
          echo "error: no */staging/deployment.yaml found in ${REPO_URL}@${REVISION}" >&2
          exit 1
        fi
        image_ref="$(yq -r '.spec.template.spec.containers[0].image' "${manifest}")"
        if [[ -z "${image_ref}" || "${image_ref}" == "null" ]]; then
          echo "error: no spec.template.spec.containers[0].image found in ${manifest}" >&2
          exit 1
        fi
        echo "Resolved promoted image: ${image_ref} (from ${manifest})"
        echo -n "${image_ref}" | tee "$(results.image-ref.path)"
