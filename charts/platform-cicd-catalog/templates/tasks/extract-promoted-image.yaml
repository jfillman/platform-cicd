# catalog/tasks/extract-promoted-image.yaml
#
# Clones an Application's gitops-repo PR head commit and reads the image reference
# open-release-pr.yaml's yq patch put into the promoted env's Deployment manifest - the
# actual image about to be promoted. Used by image-scan-check.yaml (Phase 3 item 8.5);
# intended for reuse by any future gate that needs "which image is this PR actually
# promoting" rather than app-repo source (see resolve-app-commit.yaml for the
# source-code equivalent, used by sast-check.yaml - a deliberately different resolution
# mechanism, not reused here: this needs the image the manifest points at, not a source
# checkout).
#
# Finds the manifest via `git diff --name-only HEAD~1` rather than a hardcoded
# <cluster>/<env>/values.yaml (or even */values.yaml) path - this Task is invoked
# directly by PaC off the gitops repo's own PR webhook (repo-url/revision only, no
# env/cluster param in that path at all - see docs/multi-cluster.md), so it can't know
# the cluster/env names up front the way release.yaml's own Pipeline now can. What it
# CAN rely on: open-release-pr.yaml always produces exactly one commit, one file
# changed (a single surgical yq patch) - so the file HEAD~1..HEAD touched IS the
# promoted env's manifest, whatever that cluster/env is named. Generalizes to any depth
# for the same reason `find`'s glob used to.
#
# values.yaml, not deployment.yaml - the gitops-<app-name> repo is now scaffolded by
# idp-service-catalog's ApplicationEnvironment composition (idp-application's own Helm
# values file), not a raw Deployment manifest - see open-release-pr.yaml's own header
# for the live-confirmed schema this reads back (repository/tag split fields, not a
# single image: string).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-promoted-image
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  description: Clones an Application's gitops-repo PR head commit and reads the promoted image reference from its Deployment manifest.
  params:
    - name: repo-url
      type: string
      description: The gitops repo's own URL - PaC's `repo_url`.
    - name: revision
      type: string
      description: The gitops PR's head commit - PaC's `revision`.
  results:
    - name: image-ref
  steps:
    - name: extract
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        workdir="$(mktemp -d)"
        git clone --quiet "${REPO_URL}" "${workdir}/gitops"
        cd "${workdir}/gitops"
        git checkout --quiet "${REVISION}"

        manifest="$(git diff --name-only HEAD~1 HEAD -- '*/values.yaml' | head -1)"
        if [[ -z "${manifest}" ]]; then
          echo "error: no */values.yaml changed between HEAD~1 and ${REVISION} in ${REPO_URL} - expected open-release-pr.yaml's single surgical image-tag commit" >&2
          exit 1
        fi
        image_repo="$(yq -r '.rollout.image.repository' "${manifest}")"
        image_tag="$(yq -r '.rollout.image.tag' "${manifest}")"
        if [[ -z "${image_repo}" || "${image_repo}" == "null" || -z "${image_tag}" || "${image_tag}" == "null" ]]; then
          echo "error: no rollout.image.repository/tag found in ${manifest}" >&2
          exit 1
        fi
        image_ref="${image_repo}:${image_tag}"
        echo "Resolved promoted image: ${image_ref} (from ${manifest})"
        echo -n "${image_ref}" | tee "$(results.image-ref.path)"
