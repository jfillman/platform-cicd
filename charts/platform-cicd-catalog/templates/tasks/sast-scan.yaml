# catalog/tasks/sast-scan.yaml
#
# Real (not stub) SAST via Semgrep - Phase 3 item 8.4. Replaces governance-gate-stub for
# the `sast` gate in build.yaml. The gitops repo's PR-triggered sast Check
# (catalog/pipelines/sast-check.yaml) does NOT call this Task - it looks up this Task's
# own attested outcome from the promoted image's SLSA provenance instead of re-running
# Semgrep against unchanged source, see verify-sast-attestation.yaml's own header for
# why (a real redundancy caught by the user, not the original design).
#
# Semgrep, not CodeQL: broad multi-language support matching this platform's multi-agent
# (nodejs/java, more later) ambition, no license server/GitHub-Advanced-Security
# dependency. Runs on the OFFICIAL semgrep/semgrep image directly as this Task's step
# image, not baked into the shared toolbox image - checked live before deciding this:
# Semgrep's GitHub releases ship ZERO downloadable binary assets (confirmed via the
# GitHub API - `.assets` is an empty array on the latest release), so the toolbox's usual
# pinned-static-binary pattern (gitsign/ec/cosign) doesn't apply here at all. A dedicated
# step image is the same deliberate exception already established in this codebase for
# kaniko (see build-image.yaml's own header) - confirmed the official image is genuinely
# multi-arch (linux/arm64 included) via `docker manifest inspect` before committing to it,
# not assumed.
#
# `--config p/ci --config p/security-audit`: both free, no-login-required registry
# rulesets (`--config auto` needs a Semgrep App token for its full behavior, which this
# platform doesn't have or want to depend on for a build-blocking gate). p/ci alone was
# tried first and found genuinely insufficient for a SECURITY gate, not just assumed
# adequate: a deliberately-planted command-injection snippet (child_process.exec with
# unsanitized input) scanned clean under p/ci (only 16 JS rules, more a general-quality
# bundle than a security one), then correctly flagged as a blocking finding
# (javascript.lang.security.detect-child-process) once p/security-audit was added -
# confirmed live via a throwaway pod before committing to this config, not guessed from
# Semgrep's own naming.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sast-scan
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  description: Runs Semgrep (p/ci ruleset) against the source workspace; fails closed on real findings.
  workspaces:
    - name: source
  params:
    - name: flow-traceparent
      type: string
      default: ""
      description: Leave empty when there's no flow/stage context (e.g. a PR-triggered GitOps-repo check) - see governance-stub.yaml for the same convention.
    - name: stage-span-id
      type: string
      default: ""
      description: The calling stage's own span id - this scan's span is parented to it. Ignored when flow-traceparent is empty.
    - name: config-json
      type: string
      default: ""
      description: Output of validate-cicd-config's config-json result - read for notifications.slack.* only (same as notify-slack.yaml). Left empty in the gitops-repo PR-check context, same as flow-traceparent above - this Task isn't called there anyway, but keeping the default makes it safe if that ever changes.
    - name: app-name
      type: string
      default: ""
    - name: git-url
      type: string
      default: ""
    - name: git-revision
      type: string
      default: ""
  results:
    - name: outcome
      description: "'passed'/'failed' - a real result, never 'stub' (this is a real implementation, not governance-gate-stub)."
    - name: span-start-time
    - name: span-end-time
      description: Set only if the scan step itself ran to completion (pass or fail) - see emit-span's own comment. Task-level (not step-level), like outcome above - all three are written and read within this same self-contained Task, matching build-source.yaml's own proven pattern for this shape.
    - name: findings-summary
      description: 'Total finding count plus up to 8 real findings (severity/rule-id/file:line), extracted from Semgrep''s own JSON output for the shift-left Slack notification below - not just the "Findings: N (M blocking)" summary line, a real gap the user caught live.'
  volumes:
    - name: slack-webhook
      secret:
        secretName: slack-webhook-url
        optional: true
  steps:
    # onError: continue - a real bug found live (see image-scan.yaml's identical fix,
    # found first): Tekton's DEFAULT behavior is to skip every subsequent step once one
    # fails ("Skipping step because a previous step failed" in the pod logs), not run
    # them regardless. The comment below (pre-existing, now corrected) originally
    # believed emit-span already ran unconditionally - untrue without this. notify-slack
    # below re-raises this step's real failure explicitly (reading the outcome result) -
    # onError: continue means this step no longer fails the Task on its own.
    - name: scan
      onError: continue
      image: semgrep/semgrep:1.172.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        # Not set -e: semgrep's own exit code (0=clean, 1=findings under --error) is the
        # real pass/fail signal this Task reports - a script-level early exit would skip
        # writing the `outcome` result entirely, turning a real failure into a silent gap.
        set -uo pipefail
        # Plain `date`, not catalog/lib/otel.sh - this step runs in semgrep's own image
        # (neither otel-cli nor $PLATFORM_LIB present), same handoff-to-a-later-toolbox-
        # step pattern as build-source.yaml/run-tests.yaml's own agent-image steps.
        #
        # Whole-second precision (%SZ), not %N (nanoseconds) like those other agent-image
        # steps use - a real bug found live: semgrep/semgrep is Alpine WITHOUT GNU
        # coreutils (unlike every build-agent image in build-agents.env, deliberately
        # chosen to be full/Debian-based since Alpine lacks bash), so its `date` is
        # BusyBox's, which doesn't support %N and silently truncates the whole format
        # string right after it - `date -u +"%Y-%m-%dT%H:%M:%S.%NZ"` produced
        # "2026-08-05T18:57:11." with the fractional seconds AND the trailing Z both
        # missing, a malformed timestamp that reached otel-cli and the span simply never
        # showed up in Tempo (no error, confirmed live, not assumed). A real Semgrep scan
        # takes seconds, so whole-second precision loses nothing meaningful here.
        date -u +"%Y-%m-%dT%H:%M:%SZ" | tee "$(results.span-start-time.path)"

        # --json --output (a FILE, not stdout) alongside the normal human-readable run -
        # confirmed live this keeps stdout human-readable (unlike Trivy, which needed a
        # genuinely separate second invocation for this - --format fully replaces its
        # stdout) while also writing real structured findings to parse below.
        semgrep scan --config p/ci --config p/security-audit --error --json --output /tmp/scan-results.json . 2>&1 | tee /tmp/scan-output.txt
        EXIT_CODE=${PIPESTATUS[0]}

        date -u +"%Y-%m-%dT%H:%M:%SZ" | tee "$(results.span-end-time.path)"

        # Real findings, not just Semgrep's own "Findings: N (M blocking)" summary line -
        # the same real gap the user caught in image-scan.yaml's own first version,
        # fixed the same way here. Confirmed live (not assumed) via `semgrep --json`'s
        # real schema: .results[] with check_id/path/start.line/extra.severity.
        TOTAL_COUNT="$(jq -r '.results | length' /tmp/scan-results.json 2>/dev/null || echo 0)"
        TOP_FINDINGS="$(jq -r '
          .results[:8]
          | map("*" + .extra.severity + "* " + .check_id + " - " + .path + ":" + (.start.line | tostring))
          | join("\n")
          ' /tmp/scan-results.json 2>/dev/null || echo "")"
        {
          echo "${TOTAL_COUNT} finding(s)"
          if [[ -n "${TOP_FINDINGS}" ]]; then
            echo "${TOP_FINDINGS}"
            [[ "${TOTAL_COUNT}" -gt 8 ]] && echo "_+$((TOTAL_COUNT - 8)) more - see the full report in this Task's own log_"
          fi
        } | tee "$(results.findings-summary.path)"

        if [[ "${EXIT_CODE}" -eq 0 ]]; then
          echo -n "passed" | tee "$(results.outcome.path)"
        else
          echo "sast-scan: semgrep reported blocking findings (exit ${EXIT_CODE})" >&2
          echo -n "failed" | tee "$(results.outcome.path)"
          exit 1
        fi

    # Reached whether the scan passed OR failed (unlike build-source/run-tests' own
    # emit-span, which only runs on success) - because `scan` above has onError:
    # continue, not because of anything about its own exit-1 timing (a stale belief
    # this comment used to state as fact - see that step's own comment for the real
    # explanation, found live).
    - name: emit-span
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      env:
        - name: FLOW_TRACEPARENT
          value: $(params.flow-traceparent)
        - name: STAGE_SPAN_ID
          value: $(params.stage-span-id)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [[ -z "${FLOW_TRACEPARENT}" ]]; then
          echo "no flow-traceparent provided - skipping span emission (expected for PR-triggered GitOps-repo checks)" >&2
          exit 0
        fi
        source "${PLATFORM_LIB}/otel.sh"
        # outcome/span-start-time/span-end-time are all TASK-level results written by an
        # earlier step (scan) - a cross-step templated reference to a task-level result
        # silently resolves to the literal unresolved placeholder string (the same real
        # bug found live in build-image.yaml's emit-image-ref-result - see that file's
        # own comment). Read the stable, well-documented /tekton/results/<name> path
        # directly instead, same proven workaround.
        OUTCOME_VALUE="$(cat /tekton/results/outcome 2>/dev/null || echo unknown)"
        SPAN_START="$(cat /tekton/results/span-start-time 2>/dev/null || echo "")"
        SPAN_END="$(cat /tekton/results/span-end-time 2>/dev/null || echo "")"
        TEKTON_STATUS="Succeeded"
        [[ "${OUTCOME_VALUE}" != "passed" ]] && TEKTON_STATUS="Failed"
        otel_task_span_send "sast-scan" "${FLOW_TRACEPARENT}" "${STAGE_SPAN_ID}" \
          "${SPAN_START}" "${SPAN_END}" "${TEKTON_STATUS}" "sast.outcome=${OUTCOME_VALUE}"

    # Shift-left visibility (prompted directly by the user): tells developers about a
    # real SAST result the moment the build produces it, not just via the pipeline's own
    # generic pass/fail notification later. Same reliably-runs-regardless-of-scan-
    # outcome placement as emit-span above, for the same reason - a Tekton `finally`
    # task referencing a failed task's result gets skipped entirely (see notify-
    # slack.yaml's own image-repo comment for the established precedent), so this lives
    # inside the Task itself rather than as a separate pipeline-level notify step.
    - name: notify-slack
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      volumeMounts:
        - name: slack-webhook
          mountPath: /var/run/secrets/platform
          readOnly: true
      env:
        - name: APP_NAME
          value: $(params.app-name)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Read this first, and re-check it at the very end regardless of what happens
        # in between - scan (above) has onError: continue, so a real failure there no
        # longer fails this Task on its own; every early-exit path below must fall
        # through to that final check rather than `exit 0` directly, or a real scan
        # failure would silently report as a passing Task.
        OUTCOME_VALUE="$(cat /tekton/results/outcome 2>/dev/null || echo unknown)"

        CFG='$(params.config-json)'
        if [[ -z "${CFG}" ]]; then
          echo "no config-json provided - skipping notification (expected for PR-triggered GitOps-repo checks, this Task isn't called there)" >&2
        elif [[ "$(jq -r '.notifications.slack.enabled // false' <<< "${CFG}")" != "true" ]]; then
          echo "slack notifications disabled in cicd.yaml, skipping"
        elif [[ "$(jq -r 'if .notifications.slack.scanResults == false then "false" else "true" end' <<< "${CFG}")" != "true" ]]; then
          echo "notifications.slack.scanResults is false in cicd.yaml - shift-left scan notifications disabled for this tenant (general per-stage notifications are unaffected), skipping"
        else
          CHANNEL="$(jq -r '.notifications.slack.channel // empty' <<< "${CFG}")"
          WEBHOOK_URL="$(cat /var/run/secrets/platform/slack-webhook-url 2>/dev/null || true)"
          if [[ -z "${WEBHOOK_URL}" ]]; then
            echo "warn: notifications.slack.enabled=true but no slack-webhook-url secret is mounted for this tenant - skipping, not failing the pipeline" >&2
          else
            FINDINGS="$(cat /tekton/results/findings-summary 2>/dev/null || echo "")"

            # Same docs/design-language.md conventions as notify-slack.yaml: one blue
            # accent, muted red only on failure, a single ⚠ on the header only when the
            # outcome isn't success.
            if [[ "${OUTCOME_VALUE}" == "passed" ]]; then
              COLOR="#2563EB"
              HEADER_TEXT="${APP_NAME} · SAST Passed"
            else
              COLOR="#B91C1C"
              HEADER_TEXT="⚠ ${APP_NAME} · SAST Failed"
            fi
            REPO_SHORT="$(echo "${GIT_URL}" | sed -E 's#https?://github\.com/([^/]+)/([^/.]+).*#\1/\2#')"
            SHORT_SHA="${GIT_REVISION:0:12}"
            COMMIT_URL="${GIT_URL}/commit/${GIT_REVISION}"
            # Scan parameters are fixed platform policy right now, same reasoning as
            # image-scan.yaml's own SCAN_PARAMS.
            SCAN_PARAMS="config: p/ci, p/security-audit"

            payload="$(jq -n \
              --arg channel "${CHANNEL}" \
              --arg color "${COLOR}" \
              --arg headerText "${HEADER_TEXT}" \
              --arg app "${APP_NAME}" \
              --arg repoShort "${REPO_SHORT}" \
              --arg repoUrl "${GIT_URL}" \
              --arg shortSha "${SHORT_SHA}" \
              --arg commitUrl "${COMMIT_URL}" \
              --arg scanParams "${SCAN_PARAMS}" \
              --arg findings "${FINDINGS:-no summary available}" \
              --arg footer "platform-cicd · $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '
              def field(fieldLabel; fieldValue): {type: "mrkdwn", text: ("*" + fieldLabel + "*\n" + fieldValue)};
              {
                channel: $channel,
                attachments: [{
                  color: $color,
                  blocks: [
                    {type: "header", text: {type: "plain_text", text: $headerText, emoji: true}},
                    {type: "section", fields: [
                      field("App"; $app),
                      field("Repo"; "<" + $repoUrl + "|" + $repoShort + ">"),
                      field("Commit"; "<" + $commitUrl + "|" + $shortSha + ">"),
                      field("Scan parameters"; $scanParams)
                    ]},
                    {type: "section", text: {type: "mrkdwn", text: ("*Findings*\n" + $findings)}},
                    {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
                  ]
                }]
              }
              ')"

            curl --fail --silent --show-error --max-time 10 \
              -X POST "${WEBHOOK_URL}" \
              -H 'Content-Type: application/json' \
              -d "${payload}"
          fi
        fi

        # Re-raise scan's own real failure - see that step's onError: continue comment.
        if [[ "${OUTCOME_VALUE}" != "passed" ]]; then
          exit 1
        fi
