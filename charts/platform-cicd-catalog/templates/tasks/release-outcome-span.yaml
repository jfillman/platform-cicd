# catalog/tasks/release-outcome-span.yaml
#
# Sends one real, standalone span reporting a cluster-mapped release's confirmed
# ArgoCD-sync outcome (docs/multi-cluster.md) - the missing half of "close the loop"
# that release-outcome-notify.yaml only did for Slack until now (real gap, found live
# 2026-08-12: this Pipeline had no tracing task at all).
#
# Deliberately its OWN standalone trace, not a child appended to the original flow's
# trace - the flow-root span for that original trace is already closed by the time a
# human reviews, approves, and merges this release's PR (release.yaml's own end-flow
# finally task, gated on is-flow-terminal, fires at PR-open time). Appending a child
# span here - potentially minutes to days later - would reproduce the exact bug
# release.yaml's own header already documents fixing: a span sent after its trace's
# root already closed shows up with a start/end time AFTER the trace's supposed end.
# Human review/merge/ArgoCD-sync time is unbounded process time, not pipeline
# execution time, and was already deliberately excluded from the original trace for
# that reason - see release.yaml's header.
#
# Correlation instead comes from chain-id (CDEvents' own causal-sequence correlator,
# distinct from the OTel trace/span ids - see otel.sh's file header), carried as a
# span ATTRIBUTE (platform.chain_id) rather than a structural parent - the same
# chain-id the original flow's build/release spans already carry, so
# `{ platform.chain_id = "..." }` in Tempo/Grafana surfaces this span alongside them
# even though it lives in a different trace. chain-id arrives here via
# open-release-pr.yaml (baked into the outcome-reporting hook Job at PR-open time) ->
# argocd-outcome-hook.sh -> argocd-outcome-relay -> release-outcome-trigger.yaml - see
# each of those files' own comments. Empty (backward-compatible) for an app onboarded
# before this field existed; the span still sends, just without that attribute.
#
# start-time is pr-created-at (when open-release-pr.yaml's own API call actually
# created this release PR), not flow-start-time and not "when this PipelineRun itself
# started". Real design choice, changed 2026-08-12 at the user's request ("connect the
# PR release and the release outcome so we can see how long it takes between creating
# the PR and application deployment"): flow-start-time covers commit -> PR-open, which
# is this platform's own automated build/test/deploy/release execution time - already
# fully visible as the "stage:release" span's own end time in the ORIGINAL flow trace
# (docs/tracing.md). Anchoring THIS span there too would double-count that segment
# inside "release lead time" instead of isolating the actually-interesting, previously
# invisible segment: how long the human-review-plus-ArgoCD-sync gap itself took.
# flow-start-time is still carried as a span ATTRIBUTE (platform.flow_start_time,
# below) for anyone who wants full commit-to-deploy DORA lead time instead - it's a
# strict superset of this span's own start/end, derivable without re-instrumenting
# anything. Falls back to flow-start-time (then otel_now) as the actual start-time if
# pr-created-at is empty, for an app onboarded before that field existed.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-outcome-span
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: env
      type: string
    - name: status
      type: string
      description: "Succeeded or Failed - see release-outcome-notify.yaml's own status param."
    - name: chain-id
      type: string
      default: ""
      description: The original flow's chain-id, when the reporting app/release predates this field - see this file's own header.
    - name: flow-start-time
      type: string
      default: ""
      description: >-
        The original flow's own start time - carried as a span attribute (full DORA
        lead-time anchor) and used as the start-time fallback when pr-created-at is
        empty. See this file's own header.
    - name: pr-created-at
      type: string
      default: ""
      description: >-
        When this release's PR was actually created - the real start-time for this
        span. See this file's own header for why, not flow-start-time.
  steps:
    - name: send-span
      image: ghcr.io/jfillman/platform-cicd-toolbox:latest
      imagePullPolicy: IfNotPresent  # pushed to ghcr.io/jfillman (public), not kind-loaded - see hack/bootstrap.sh 4/6
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
        - name: APP_NAMESPACE
          value: $(params.app-namespace)
        - name: APP_NAME
          value: $(params.app-name)
        - name: ENV_NAME
          value: $(params.env)
        - name: STATUS
          value: $(params.status)
        - name: CHAIN_ID
          value: $(params.chain-id)
        - name: FLOW_START_TIME
          value: $(params.flow-start-time)
        - name: PR_CREATED_AT
          value: $(params.pr-created-at)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source "${PLATFORM_LIB}/otel.sh"

        # A standalone one-span trace (own fresh trace-id, own root span) - see this
        # file's own header for why it's deliberately NOT parented under the original
        # flow's already-closed root.
        read -r traceparent _ <<< "$(otel_flow_root_begin)"
        # pr-created-at is the real start anchor (see this file's own header); fall
        # back to flow-start-time, then otel_now, for an app onboarded before
        # pr-created-at existed.
        start_time="${PR_CREATED_AT}"
        [[ -z "${start_time}" ]] && start_time="${FLOW_START_TIME}"
        [[ -z "${start_time}" ]] && start_time="$(otel_now)"

        attrs="platform.app_namespace=${APP_NAMESPACE},platform.app_name=${APP_NAME},platform.env=${ENV_NAME}"
        [[ -n "${CHAIN_ID}" ]] && attrs="${attrs},platform.chain_id=${CHAIN_ID}"
        [[ -n "${FLOW_START_TIME}" ]] && attrs="${attrs},platform.flow_start_time=${FLOW_START_TIME}"

        # Outcome baked directly into the span's own name (not just its OTel status
        # code) - 2026-08-12, real bug found live: Tempo's TraceQL search API has no
        # way to promote a matched span's own attribute/status to a trace-level field
        # (the ONLY fields a search result exposes flat, without a nested per-row
        # sub-frame Grafana can't render as a plain value - confirmed live via
        # Grafana's own /api/ds/query). The span's NAME is one of those flat fields
        # (Tempo's own rootTraceName), so this is the one place status can land
        # somewhere the dashboard's Release outcomes panel can show directly, no
        # nested-table rendering involved at all.
        otel_span_send "release-outcome:${APP_NAME}/${ENV_NAME} [${STATUS}]" "${traceparent}" "" "${start_time}" "$(otel_now)" "${STATUS}" "${attrs}"
