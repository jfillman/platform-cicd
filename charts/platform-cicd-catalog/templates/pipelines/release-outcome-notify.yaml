# catalog/pipelines/release-outcome-notify.yaml (Phase 3 item 4, docs/multi-cluster.md)
#
# The downstream consumer of the environment.deployed CDEvent the argocd-outcome-relay
# forwards (platform/broker/cmd/argocd-outcome-relay) once a cluster-mapped release
# actually confirms success/failure on its own upper-env cluster - this is what "closes
# the loop" in a way a human notices, not just a CDEvent landing unseen. Two tasks,
# deliberately independent of each other (no runAfter): `notify` reuses notify-
# slack.yaml as-is rather than duplicating its message formatting, `span` sends a real,
# standalone trace span reporting the outcome (see release-outcome-span.yaml's own
# header for why it's a separate trace, not appended to the original flow's - added
# 2026-08-12, a real gap found live: this Pipeline had no tracing task at all before).
# No resolve-notify-config/clone/workspace needed here (unlike
# deploy.yaml/release.yaml) - config-json arrives pre-resolved: open-release-pr.yaml
# base64-encodes it into the PostSync/SyncFail hook Job's own CONFIG_JSON_B64 env var at
# PR-open time, the hook script forwards it to argocd-outcome-relay, and the relay
# decodes it straight into the CDEvent's body.subject.content.configJson this Pipeline's
# own Trigger binds from (see release-outcome-trigger.yaml) - no live fetch, no
# ConfigMap, no Application-manifest annotation involved (an earlier design used each of
# those in turn; see docs/multi-cluster.md for why both were replaced).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-outcome-notify
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: env
      type: string
    - name: cluster
      type: string
    - name: status
      type: string
      description: "Succeeded or Failed - mapped from ArgoCD's own operationState.phase by the Trigger's own CEL/binding, see the app chart's release-outcome-trigger.yaml."
    - name: git-url
      type: string
      default: ""
    - name: git-revision
      type: string
      default: ""
    - name: pr-url
      type: string
      default: ""
    - name: config-json
      type: string
      default: "{}"
    - name: chain-id
      type: string
      default: ""
      description: The original flow's chain-id, for span correlation - see release-outcome-span.yaml.
    - name: flow-start-time
      type: string
      default: ""
      description: The original flow's own start time (DORA lead-time anchor) - see release-outcome-span.yaml.
    - name: pr-created-at
      type: string
      default: ""
      description: >-
        When open-release-pr.yaml's own API call actually created this release PR - the
        real start anchor for release-outcome-span.yaml's span (falls back to
        flow-start-time there if empty, for an app onboarded before this field existed).
  tasks:
    - name: notify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: notify-slack }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(params.config-json) }
        # A dedicated stage-name, not "release" - reusing that label would read as
        # "the release Pipeline itself ran again", which is misleading (this
        # PipelineRun never opens a PR or touches an image; it only relays a
        # confirmation). notify-slack.yaml's own stage_display switch falls back to
        # printing the raw value verbatim for anything it doesn't recognize - already
        # exercised by every OTHER stage name, no change needed there.
        - { name: stage-name, value: "release-outcome" }
        - { name: status, value: $(params.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: pr-url, value: $(params.pr-url) }
        - { name: env, value: $(params.env) }

    # See release-outcome-span.yaml's own header for why this is a standalone span/
    # trace, not a child of the original flow's (already-closed) trace.
    - name: span
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: release-outcome-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: env, value: $(params.env) }
        - { name: status, value: $(params.status) }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: pr-created-at, value: $(params.pr-created-at) }
