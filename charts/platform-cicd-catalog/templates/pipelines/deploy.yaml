# catalog/pipelines/deploy.yaml
#
# Third stage of the flow (of four - see release.yaml). Fired by the shared broker on
# the test Pipeline's dev.cdevents.testcaserun.finished (outcome=success) event. Deploys
# to a single lower environment (dev) via direct kubectl - deliberately not GitOps/PR-
# gated, unlike release.yaml's promotion to staging: dev is optimized for fast inner-loop
# feedback, not governance. See catalog/tasks/deploy-manifests.yaml and docs/release.md.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: image-ref
      type: string
    - name: env
      type: string
      default: dev
    - name: tenant
      type: string
    - name: app-name
      type: string
    - name: flow-traceparent
      type: string
    - name: chain-id
      type: string
    - name: flow-start-time
      type: string
  workspaces:
    - name: source
  tasks:
    - name: clone-repo
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: git-clone }
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: version, value: "1.7.0" }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }

    # Deeper CDEvents coverage (Phase 3 item 1, see docs/chaining.md): a generic
    # pipelinerun.started signal, independent of deploy's own domain-specific
    # service.deployed event below. No runAfter - chain-id/traceparent/flow-start-time
    # already arrive as incoming params.
    - name: pipelinerun-started
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"deploy\"}" }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    - name: validate-config
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: validate-cicd-config }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }

    - name: start-deploy-stage-span
      runAfter: [validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-traceparent, value: $(params.flow-traceparent) }

    - name: extract-governance-flags
      runAfter: [validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-governance-flags }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }

    - name: policy-check
      runAfter: [extract-governance-flags]
      when:
        - { input: $(tasks.extract-governance-flags.results.policy-check), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: governance-gate-stub }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: gate-name, value: policy-check }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: stage-span-id, value: $(tasks.start-deploy-stage-span.results.span-id) }

    - name: deploy
      runAfter: [policy-check, start-deploy-stage-span]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: deploy-manifests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: tenant, value: $(params.tenant) }
        - { name: app-name, value: $(params.app-name) }

  finally:
    - name: end-deploy-stage-span
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: deploy }
        - { name: flow-traceparent, value: $(params.flow-traceparent) }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: span-id, value: $(tasks.start-deploy-stage-span.results.span-id) }
        - { name: start-time, value: $(tasks.start-deploy-stage-span.results.start-time) }
        - { name: status, value: $(tasks.status) }

    - name: notify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: notify-slack }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: stage-name, value: deploy }
        - { name: status, value: $(tasks.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tenant, value: $(params.tenant) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }

    - name: send-cdevent
      when:
        - { input: $(tasks.status), operator: in, values: ["Succeeded", "Completed"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.service.deployed.0.3.0" }
        - { name: subject-type, value: "service" }
        - name: subject-content-json
          value: >-
            {"environment": {"id": "$(params.env)"}, "artifactId": "$(params.image-ref)", "git-url": "$(params.git-url)", "revision": "$(params.git-revision)"}
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # Deeper CDEvents coverage (Phase 3 item 1) - generic completion signal, deliberately
    # NOT gated on success like the domain-specific event above. See docs/chaining.md.
    - name: pipelinerun-finished
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.finished.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"deploy\"}" }
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
        - { name: namespace, value: $(params.tenant) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tekton-status, value: $(tasks.status) }
