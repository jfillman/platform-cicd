# catalog/pipelines/deploy.yaml
#
# Third stage of the flow (of four - see release.yaml), normally event-chained - fired
# by the shared broker on the test Pipeline's dev.cdevents.testcaserun.finished
# (outcome=success) event. Deploys to a single lower environment (dev) via direct
# kubectl - deliberately not GitOps/PR-gated, unlike release.yaml's promotion to
# staging: dev is optimized for fast inner-loop feedback, not governance. See
# catalog/tasks/deploy-manifests.yaml and docs/release.md.
#
# Can also be git-rooted directly (e.g. a tag push deploying straight to prod with no
# build/test in this run) - start-flow's idempotent generate-or-pass-through behavior
# (see start-flow-root-span.yaml) and resolve-image-ref's analogous behavior (see that
# Task's own header, shared with release.yaml) make both cases uniform.
#
# Performance note (see docs/release.md): the source workspace is only actually needed
# for the git-rooted case (nothing else in this Pipeline touches the app repo's source
# tree - deploy-manifests.yaml patches a Deployment via kubectl, it never reads from the
# workspace). It's `optional: true` and left unbound by flow-triggers.yaml for the
# common event-chained case, skipping PVC provisioning entirely - there's no dedicated
# clone-repo task here any more, only resolve-notify-config.yaml's own internal clone
# (only when its workspace is actually bound); see that Task's own header for why a
# separate clone-repo task alongside an optional Pipeline workspace doesn't work
# (a real, admission-time-checked Tekton constraint, confirmed live).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "false"
      description: "true if this is a git-rooted deploy flow (new trace root); false if event-chained from test"
    - name: is-flow-terminal
      type: string
      default: "false"
      description: "true if this step is the LAST step in its flow's steps: list (computed at generation time - see deliver-onboarding-files.yaml/flow-triggers.yaml); this stage's finally block closes the flow-root span iff true. See docs/tracing.md."
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for a git-rooted deploy (e.g. refs/tags/v1.2.3). Used to construct image-ref alongside image-repo. Empty for event-chained deploy."
    - name: image-repo
      type: string
      default: ""
      description: "Destination registry/repo, e.g. ghcr.io/<org>/<app>. Only needed for the git-rooted case (paired with git-tag to reconstruct image-ref)."
    - name: image-ref
      type: string
      default: ""
      description: "Event-chained image-ref from test's testcaserun.finished event. Empty for a git-rooted deploy."
    - name: env
      type: string
      default: dev
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: app-type
      type: string
      description: >-
        platformIdentity.type ("app"/"infra"/...) - needed (alongside app-name) to
        construct the deploy-target namespace directly as <app-type>-<app-name>-<env>,
        a PEER of app-namespace (<app-type>-<app-name>-cicd) under the same flat
        pattern, not a suffix built on top of it. See docs/concepts.md.
    - name: flow-traceparent
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: chain-id
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: config-json
      type: string
      default: "{}"
      description: >-
        Event-chained: cicd.yaml's already-validated content, forwarded from test's
        testcaserun.finished event (test always validates its own config - see
        test.yaml). "{}" for a git-rooted deploy - resolve-notify-config reads cicd.yaml
        itself instead. See resolve-notify-config.yaml.
  workspaces:
    - name: source
      optional: true
      description: >-
        Only bound for a git-rooted deploy (see flow-triggers.yaml), left unbound for
        the common event-chained case. No dedicated clone-repo task here any more - a
        Pipeline-level optional workspace is only valid Tekton when every task that
        references it also declares that workspace optional (a real, admission-time-
        checked constraint, confirmed live - see resolve-notify-config.yaml's own
        header), which the shared hub-resolved git-clone Task's required workspace
        can't satisfy. resolve-notify-config does its own clone instead, only when
        this workspace is actually bound.
  tasks:
    - name: start-flow
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
      # Idempotent: passes the incoming values through unchanged when event-chained
      # (the normal case), or generates new root span data when they arrive empty
      # (git-rooted deploy) - see start-flow-root-span.yaml.

    - name: resolve-image-ref
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-image-ref }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(params.image-ref) }
        - { name: image-repo, value: $(params.image-repo) }
        - { name: git-tag, value: $(params.git-tag) }
        - { name: git-revision, value: $(params.git-revision) }

    # Deep CDEvents coverage (see docs/chaining.md): a generic
    # pipelinerun.started signal, independent of deploy's own domain-specific
    # service.deployed event below. References start-flow results (either generated
    # for a git-rooted deploy, or passed through event-chained).
    - name: pipelinerun-started
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"deploy\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # Never when-gated/skipped and has no result-dependency on clone-repo - see this
    # Task's own header for why that's load-bearing (notify below must always be able
    # to reference its result, regardless of git-rooted vs event-chained).
    - name: resolve-notify-config
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: resolve-notify-config }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(params.config-json) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }

    - name: start-deploy-stage-span
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }

    - name: deploy
      runAfter: [start-deploy-stage-span, resolve-image-ref]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: deploy-manifests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: app-name, value: $(params.app-name) }
        - { name: app-type, value: $(params.app-type) }

  finally:
    - name: end-deploy-stage-span
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: deploy }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: span-id, value: $(tasks.start-deploy-stage-span.results.span-id) }
        - { name: start-time, value: $(tasks.start-deploy-stage-span.results.start-time) }
        - { name: status, value: $(tasks.status) }

    # Closes the flow-root span iff deploy happens to be the LAST step of its flow (the
    # common case - deploy with no release configured) - see is-flow-terminal above and
    # docs/tracing.md. Every stage Pipeline carries an identical copy of this task,
    # gated the same way; whichever one is actually terminal for THIS flow instance is
    # the one that fires.
    - name: end-flow
      when:
        - { input: $(params.is-flow-terminal), operator: in, values: ["true"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-name, value: "$(params.app-namespace)/$(params.app-name)" }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: status, value: $(tasks.status) }

    - name: notify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: notify-slack }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(tasks.resolve-notify-config.results.config-json) }
        - { name: stage-name, value: deploy }
        - { name: status, value: $(tasks.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: image-ref, value: $(tasks.resolve-image-ref.results.image-ref) }
        - { name: env, value: $(params.env) }

    - name: send-cdevent
      when:
        - { input: $(tasks.status), operator: in, values: ["Succeeded", "Completed"] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.service.deployed.0.3.0" }
        - { name: subject-type, value: "service" }
        - name: subject-content-json
          value: >-
            {"environment": {"id": "$(params.env)"}, "artifactId": "$(tasks.resolve-image-ref.results.image-ref)", "git-url": "$(params.git-url)", "revision": "$(params.git-revision)"}
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        # Forwarded so release can skip its own clone+validate-config too - same
        # reasoning as test's own testcaserun.finished event, see resolve-notify-config.
        # resolve-notify-config is never skipped, so this reference is always safe.
        - { name: config-json, value: $(tasks.resolve-notify-config.results.config-json) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # Deeper CDEvents coverage - generic completion signal, deliberately
    # NOT gated on success like the domain-specific event above. See docs/chaining.md.
    - name: pipelinerun-finished
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.finished.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"deploy\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tekton-status, value: $(tasks.status) }
