# catalog/pipelines/sbom-check.yaml
#
# Real (not stub) SBOM governance check - Phase 3 item 8.7. Runs as a PR-triggered Check
# on an Application's gitops repo, generating+attesting an SBOM for the actual image about to
# be promoted - same image-resolution mechanism as image-scan-check.yaml (they scan the
# same artifact, just doing different things with it).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sbom-check
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  description: Resolves the promoted image from a gitops PR's staging manifest, then generates+attests a real SBOM for it.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
  tasks:
    - name: extract-promoted-image
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: extract-promoted-image }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: generate-sbom
      runAfter: [extract-promoted-image]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: generate-sbom }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: image-ref, value: $(tasks.extract-promoted-image.results.image-ref) }
