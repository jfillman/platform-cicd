# catalog/pipelines/governance-check.yaml
#
# Minimal single-task Pipeline wrapping governance-gate-stub, referenced from an
# Application's GitOps repo's own .tekton/pull_request-*.yaml files (one file per gate: sast,
# image-scan, policy-check, sbom - see docs/release.md) so PaC reports each as its own
# independently-required, independently-re-triggerable GitHub Check (confirmed live:
# each matching .tekton/*.yaml file gets its own Check, keyed by the PipelineRun/file,
# not by Task). A shared Pipeline kept generic by gate-name rather than four
# near-duplicate Pipelines, matching governance-gate-stub's own "one Task, parameterized"
# precedent.
#
# No flow-traceparent/stage-span-id params - PR-triggered checks have no flow/stage
# context (they're not part of the CDEvents-chained PipelineRun sequence at all, just an
# independent, human-paced PR review) - governance-gate-stub already treats both as
# optional for exactly this case.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: governance-check
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
    platform.io/stub: "true"
spec:
  params:
    - name: gate-name
      type: string
      description: One of sast, image-scan, policy-check, sbom.
  tasks:
    - name: check
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: governance-gate-stub }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: gate-name, value: $(params.gate-name) }
