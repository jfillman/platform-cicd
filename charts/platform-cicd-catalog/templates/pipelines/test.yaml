# catalog/pipelines/test.yaml
#
# Second stage of the flow, normally event-chained - fired by the shared broker in
# response to the build Pipeline's dev.cdevents.artifact.published event (see
# platform/broker/). Can also be git-rooted directly (e.g. a "test-only" flow on push
# to a scratch branch, with no build stage at all) - start-flow's idempotent generate-
# or-pass-through behavior (see start-flow-root-span.yaml) makes both cases uniform:
# every downstream task references start-flow's results, never the incoming params
# directly. See docs/tracing.md and docs/chaining.md.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: is-flow-root
      type: string
      default: "false"
      description: "true if this is a git-rooted test-only flow (new trace root); false if event-chained from build"
    - name: git-url
      type: string
    - name: git-revision
      type: string
    - name: git-tag
      type: string
      default: ""
      description: "Git tag passed by PaC for a tag-triggered test-only flow. Accepted for param-list consistency with the other three stages (any of which deliver-onboarding-files.yaml may generate a git-rooted .tekton file for) - not otherwise used, since test has nothing to version."
    - name: image-repo
      type: string
      default: ""
      description: "Destination registry/repo. Accepted for the same reason as git-tag above - not otherwise used."
    - name: image-ref
      type: string
      default: ""
      description: "Event-chained image-ref from build's artifact.published event. Empty for a git-rooted test-only flow with nothing built yet."
    - name: env
      type: string
      description: "Which environment's build this test run is exercising - required by validateFlows on every test step, since a test result is meaningless without knowing what it ran against."
    - name: suite
      type: string
      description: "Test suite name - the step's own `suite`, or cicd.yaml's top-level test.suite. validateFlows requires one of the two to resolve."
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: flow-traceparent
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: chain-id
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
    - name: flow-start-time
      type: string
      default: ""
      description: "Inherited from upstream stage (event-chained) or generated by start-flow (git-rooted)"
  workspaces:
    - name: source
  tasks:
    - name: clone-repo
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: git-clone }
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: version, value: "1.7.0" }
      workspaces:
        - { name: output, workspace: source }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }

    - name: start-flow
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-flow-root-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: chain-id, value: $(params.chain-id) }
        - { name: traceparent, value: $(params.flow-traceparent) }
        - { name: flow-start-time, value: $(params.flow-start-time) }
      # Idempotent: passes the incoming values through unchanged when event-chained
      # (the normal case), or generates new root span data when they arrive empty
      # (git-rooted test-only flow) - see start-flow-root-span.yaml.

    # Deeper CDEvents coverage (Phase 3 item 1, see docs/chaining.md): a generic
    # pipelinerun.started signal, independent of test's own domain-specific
    # testcaserun.finished event below. References start-flow results (either
    # generated for a git-rooted test-only flow, or passed through event-chained).
    - name: pipelinerun-started
      runAfter: [start-flow]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.started.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"test\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    - name: validate-config
      runAfter: [clone-repo]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: validate-cicd-config }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }

    - name: start-test-stage-span
      runAfter: [start-flow, validate-config]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: start-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }

    - name: integration-test
      runAfter: [validate-config, start-test-stage-span]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: run-integration-tests }
          - { name: namespace, value: {{ .Release.Namespace }} }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: agent-image, value: $(tasks.validate-config.results.agent-image) }
        - { name: image-ref, value: $(params.image-ref) }
        - { name: env, value: $(params.env) }
        - { name: suite, value: $(params.suite) }

  finally:
    - name: end-test-stage-span
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: end-stage-span }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: stage-name, value: test }
        - { name: flow-traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: span-id, value: $(tasks.start-test-stage-span.results.span-id) }
        - { name: start-time, value: $(tasks.start-test-stage-span.results.start-time) }
        - { name: status, value: $(tasks.status) }

    - name: notify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: notify-slack }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: stage-name, value: test }
        - { name: status, value: $(tasks.status) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }
        - { name: git-url, value: $(params.git-url) }
        - { name: git-revision, value: $(params.git-revision) }
        - { name: image-ref, value: $(params.image-ref) }

    - name: send-cdevent
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.testcaserun.finished.0.3.0" }
        - { name: subject-type, value: "testCaseRun" }
        - name: subject-content-json
          value: >-
            {"outcome": "$(tasks.status)", "image": "$(params.image-ref)", "revision": "$(params.git-revision)", "git-url": "$(params.git-url)", "env": "$(params.env)", "suite": "$(params.suite)"}
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        # Forwarded to deploy so it can skip its own clone+validate-config just to get
        # notify-slack's config-json - test always validates its own config already (see
        # integration-test above), so this is free. validate-config is a plain (never
        # when-gated) task in this Pipeline, so referencing its result from a finally
        # task here is always safe - see resolve-notify-config.yaml's own header for why
        # that safety property matters and doesn't hold for deploy/release themselves.
        - { name: config-json, value: $(tasks.validate-config.results.config-json) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }

    # Deeper CDEvents coverage (Phase 3 item 1) - generic completion signal, deliberately
    # NOT gated on success like the domain-specific event above. See docs/chaining.md.
    - name: pipelinerun-finished
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: send-cdevent }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: event-type, value: "dev.cdevents.pipelinerun.finished.0.3.0" }
        - { name: subject-type, value: "pipelineRun" }
        - { name: subject-content-json, value: "{\"pipelineName\": \"test\"}" }
        - { name: chain-id, value: $(tasks.start-flow.results.chain-id) }
        - { name: traceparent, value: $(tasks.start-flow.results.traceparent) }
        - { name: flow-start-time, value: $(tasks.start-flow.results.start-time) }
        - { name: namespace, value: $(params.app-namespace) }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: tekton-status, value: $(tasks.status) }
