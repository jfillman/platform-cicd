# catalog/pipelines/policy-check.yaml
#
# Wraps two independent real gates (Phase 3 item 2) - the real (not stub) policy-check
# check. Referenced from an Application's GitOps repo's own .tekton/pull-request-policy-
# check.yaml, matching the exact structural shape governance-check.yaml already
# established for the three still-stub gates (sast/image-scan/sbom) - one Check per file,
# dedicated Pipeline per real gate, not a shared do-everything Pipeline.
#
# `verify` (sub-item 1, docs/commit-signing.md) checks the human's gitsign commit
# signature against the Application's allowed-emails list. `verify-provenance` (sub-item 3,
# docs/provenance-policy.md) is a genuinely separate, additive gate: the promoted
# *image*'s own signature + SLSA provenance attestation, checked against Conforma's
# policy engine - it doesn't re-check emails (deliberate, see that doc). Both must pass;
# neither `runAfter`s the other - independent checks, not a pipeline.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: policy-check
  labels:
    {{- include "platform-cicd-catalog.labels" . | nindent 4 }}
    platform.io/catalog: "true"
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: app-namespace
      type: string
    - name: app-name
      type: string
    - name: pr-number
      type: string
      default: ""
      description: "PaC's raw pull_request.number webhook body field - only used to post the PR comment in this Pipeline's finally block."
  tasks:
    - name: verify
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-commit-signature }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }

    - name: verify-provenance
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: verify-image-provenance }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: app-namespace, value: $(params.app-namespace) }
        - { name: app-name, value: $(params.app-name) }

  finally:
    - name: comment-pr
      when:
        - { input: $(params.pr-number), operator: notin, values: [""] }
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: comment-pr-check-result }
          - { name: namespace, value: {{ .Release.Namespace }} }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: pr-number, value: $(params.pr-number) }
        - { name: gate-name, value: policy-check }
        - { name: pipeline-run-name, value: $(context.pipelineRun.name) }
        - { name: status, value: $(tasks.status) }
