# charts/platform-cicd-catalog/values.yaml
#
# Deliberately minimal - every Task/Pipeline/StepAction under templates/ is unparameterized
# by design (see Chart.yaml). The only real values knob is which RBAC group gets read
# access, kept as a value rather than hardcoded so a canary install (see
# docs/admin/catalog-versioning.md) can, if ever needed, bind a narrower group than
# system:serviceaccounts instead of the cluster-wide default every Application already relies on.

rbac:
  readOnlyGroup: system:serviceaccounts

# The shared toolbox image (catalog/toolbox/Dockerfile) every bash-based catalog step
# runs in. Defaults to this repo's own published image - real, public, and pullable by
# anyone, so it's a working default (unlike a repo URL or secret, sharing a public tool
# image is normal). Override if you've built and published your own copy - see
# catalog/toolbox/Dockerfile's own build command.
toolboxImage: ghcr.io/jfillman/platform-cicd-toolbox:latest

# Cluster-agnostic namespace derivation: which namespace Tekton Chains runs in -
# matters here because verify-image-provenance.yaml/verify-sast-attestation.yaml
# verify the Chains controller's own signing identity by SERVICE ACCOUNT NAMESPACE
# (certificate-identity-regexp), a security-critical check, not cosmetic. Defaults to
# tektoncd/operator's single-targetNamespace convention (see
# gitops-cluster-dev/50-platform-cicd/tekton-operator/) - the sole install path now.
tektonChainsNamespace: tekton-pipelines
