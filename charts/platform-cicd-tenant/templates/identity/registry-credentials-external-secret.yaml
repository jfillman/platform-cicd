# templates/identity/registry-credentials-external-secret.yaml (Phase 3 item 7 - see
# docs/secrets-management.md)
#
# Replaces the manual `kubectl create secret docker-registry registry-credentials -n
# <tenant> ...` onboarding step with a real ExternalSecret, synced from the control-
# plane chart's ClusterSecretStore (its `kubernetes` provider - see that chart's own
# values.yaml). The underlying real credential is still created by hand exactly once,
# by the user, via kubectl - now in the ONE shared platform-secrets namespace instead of
# once per tenant, since every tenant currently pushes to the same ghcr.io/jfillman
# registry. No credential is ever pasted through this chart or committed anywhere.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-credentials
  namespace: {{ .Values.platformIdentity.tenantNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: registry-credentials
