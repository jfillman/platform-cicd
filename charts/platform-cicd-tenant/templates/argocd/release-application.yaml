{{- if eq (include "platform-cicd-tenant.hasStage" (dict "stages" .Values.pipeline "name" "release")) "true" }}
# templates/argocd/release-application.yaml (from tenant-release-argocd-template.yaml -
# rendered only if cicd.yaml's pipeline: declares a "release" stage)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.platformIdentity.tenantNamespace }}-staging
---
# No pipeline-runner RBAC needed in this namespace, unlike <tenant>-<env> for dev - the
# release Pipeline never touches the cluster directly for this tier, only ArgoCD's own
# (already cluster-capable) identity does, once a human has approved the GitOps PR.
#
# platform.io/dora-track: "true" - a stable, explicit marker the DORA exporter's
# informer filters on, so it only ever processes Applications that are actually part of
# this platform's tenant model - the argocd namespace also holds unrelated Applications
# this exporter has no business reading.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.platformIdentity.appName }}-staging
  namespace: argocd
  labels:
    platform.io/dora-track: "true"
spec:
  project: {{ .Values.platformIdentity.tenantNamespace }}
  source:
    repoURL: {{ .Values.platformIdentity.gitopsRepoUrl }}
    targetRevision: main
    path: {{ .Values.platformIdentity.appName }}/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.platformIdentity.tenantNamespace }}-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Lets this tenant's own pipeline-runner SA (mark-release-pending.yaml) stamp/clear DORA
# tracking annotations on exactly its own <app-name>-staging Application - resourceNames-
# scoped. No access to any other tenant's Application, and no access to anything else
# Application-shaped in argocd at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-dora-tracking-{{ .Values.platformIdentity.appName }}
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["{{ .Values.platformIdentity.appName }}-staging"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-dora-tracking-{{ .Values.platformIdentity.appName }}
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: allow-dora-tracking-{{ .Values.platformIdentity.appName }} }
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{ .Values.platformIdentity.tenantNamespace }}
{{- end }}
