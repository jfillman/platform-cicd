<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#222">deploy vs. release - different questions, different rigor</text>

  <rect x="40" y="60" width="380" height="290" rx="10" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="230" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#12324a">deploy - fast inner loop</text>
  <text x="230" y="130" text-anchor="middle" font-size="11" fill="#12324a">commits platform/envs/&lt;env&gt;.yaml</text>
  <text x="230" y="150" text-anchor="middle" font-size="11" fill="#12324a">ArgoCD syncs it</text>
  <text x="230" y="190" text-anchor="middle" font-size="11" fill="#12324a">no PR, no required reviewers,</text>
  <text x="230" y="210" text-anchor="middle" font-size="11" fill="#12324a">no governance gate</text>
  <text x="230" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#12324a">optimized for:</text>
  <text x="230" y="270" text-anchor="middle" font-size="12" fill="#12324a">"did my change work at all?"</text>

  <rect x="480" y="60" width="380" height="290" rx="10" fill="#fef3e2" stroke="#d9954a" stroke-width="1.5"/>
  <text x="670" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a1c">release - governed promotion</text>
  <text x="670" y="120" text-anchor="middle" font-size="11" fill="#8a5a1c">opens a PR against gitops-&lt;app&gt;</text>
  <text x="670" y="145" text-anchor="middle" font-size="11" fill="#8a5a1c">4 required checks: sast / image-scan /</text>
  <text x="670" y="163" text-anchor="middle" font-size="11" fill="#8a5a1c">policy-check / sbom</text>
  <text x="670" y="188" text-anchor="middle" font-size="11" fill="#8a5a1c">branch protection requires 2 human reviewers</text>
  <text x="670" y="213" text-anchor="middle" font-size="11" fill="#8a5a1c">ArgoCD's sync is the ONLY thing that</text>
  <text x="670" y="231" text-anchor="middle" font-size="11" fill="#8a5a1c">ever touches the target cluster</text>
  <text x="670" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a1c">optimized for:</text>
  <text x="670" y="290" text-anchor="middle" font-size="12" fill="#8a5a1c">"is this safe for real users?"</text>

  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#777">Both stages ship an image somewhere - they answer different questions on purpose, not by oversight.</text>
</svg>
