<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="480" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Multi-cluster topology</text>

  <!-- dev cluster -->
  <rect x="40" y="70" width="380" height="330" rx="10" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="230" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#12324a">dev cluster (one, always)</text>

  <rect x="65" y="120" width="330" height="55" rx="6" fill="#ffffff" stroke="#4a90d9"/>
  <text x="230" y="142" text-anchor="middle" font-size="12" fill="#12324a">Tekton + Pipelines-as-Code</text>
  <text x="230" y="158" text-anchor="middle" font-size="10" fill="#3a5a75">build / test / deploy-to-dev</text>

  <rect x="65" y="188" width="330" height="55" rx="6" fill="#ffffff" stroke="#4a90d9"/>
  <text x="230" y="210" text-anchor="middle" font-size="12" fill="#12324a">CDEvents broker</text>
  <text x="230" y="226" text-anchor="middle" font-size="10" fill="#3a5a75">only place chaining happens</text>

  <rect x="65" y="256" width="330" height="55" rx="6" fill="#ffffff" stroke="#4a90d9"/>
  <text x="230" y="278" text-anchor="middle" font-size="12" fill="#12324a">ArgoCD #1 (this cluster)</text>
  <text x="230" y="294" text-anchor="middle" font-size="10" fill="#3a5a75">syncs dev's own manifests only</text>

  <rect x="65" y="324" width="330" height="55" rx="6" fill="#fff7e6" stroke="#c99a2e"/>
  <text x="230" y="346" text-anchor="middle" font-size="12" fill="#7a5a10">DORA exporter + outcome relay</text>
  <text x="230" y="362" text-anchor="middle" font-size="10" fill="#8a6a2a">receives outcomes, never pushes creds out</text>

  <!-- upper cluster -->
  <rect x="500" y="70" width="380" height="200" rx="10" fill="#e9f7ef" stroke="#4ab97e" stroke-width="1.5"/>
  <text x="690" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#1f7a4d">staging/prod cluster (N of these)</text>

  <rect x="525" y="120" width="330" height="55" rx="6" fill="#ffffff" stroke="#4ab97e"/>
  <text x="690" y="142" text-anchor="middle" font-size="12" fill="#1f7a4d">its own ArgoCD instance</text>
  <text x="690" y="158" text-anchor="middle" font-size="10" fill="#2a6a45">watches the same gitops repo</text>

  <rect x="525" y="188" width="330" height="55" rx="6" fill="#ffffff" stroke="#4ab97e"/>
  <text x="690" y="210" text-anchor="middle" font-size="12" fill="#1f7a4d">ArgoCD Notifications</text>
  <text x="690" y="226" text-anchor="middle" font-size="10" fill="#2a6a45">sync outcome -&gt; webhook -&gt; CDEvent</text>

  <rect x="500" y="320" width="380" height="90" rx="10" fill="#fde8e8" stroke="#c1584a" stroke-width="1.5"/>
  <text x="690" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#7a2418">no credential ever flows this direction</text>
  <text x="690" y="365" text-anchor="middle" font-size="11" fill="#8a4a3a">dev never holds a cluster-admin/impersonation</text>
  <text x="690" y="381" text-anchor="middle" font-size="11" fill="#8a4a3a">credential for staging/prod - ever</text>

  <!-- arrows -->
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4ab97e"/></marker>
  </defs>
  <path d="M395,286 C450,286 460,150 500,146" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="430" y="130" font-size="10" fill="#666" text-anchor="middle">GitOps PR opened by release stage</text>

  <path d="M690,243 C690,270 690,290 690,320" fill="none" stroke="#4ab97e" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M500,360 C450,370 420,360 396,352" fill="none" stroke="#4ab97e" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="450" y="405" font-size="11" fill="#2a6a45" text-anchor="middle">outcome flows back as an event, not a push</text>

  <text x="550" y="450" text-anchor="middle" font-size="11" fill="#777">Each cluster gets its own ArgoCD. Sync outcomes flow dev-ward as CDEvents, never the reverse as credentials.</text>
</svg>
