# Example cicd.yaml - this is the ONLY file a developer edits to control their
# pipelines. Copy this to your repo root. Validated against schemas/cicd.schema.json by
# the validate-cicd-config Task, which runs first in every pipeline and fails fast with
# a readable error if something's wrong here - see docs/cicd-yaml-reference.md.
apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false

test:
  enabled: true
  suite: integration

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
    patterns: ["preview/*"]
  pullRequest:
    enabled: false
    labels: ["preview"]
  ttl: 5d

governance:
  sast: true
  imageScan: true
  policyCheck: false
  sbom: true

notifications:
  slack:
    enabled: true
    channel: "#team-deploys"

pipeline:
  - stage: build
  - stage: test
    after: build
  - stage: deploy
    after: test
    env: dev
