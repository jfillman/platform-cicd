# SYNCED COPY, not the source of truth - the real, developer-owned cicd.yaml lives at
# https://github.com/jfillman/nodejs-demo-app/blob/main/cicd.yaml. Kept in sync here by
# hand for now; wiring the existing, already-trusted onboarding-resync/
# deliver-onboarding-files.yaml mechanism (which already mints a fresh per-repo GitHub
# App token on every cicd.yaml push) to PR an update to this file automatically is the
# natural next step, not built in this pass - see tenants/cicd-flow-test-app/identity.yaml
# for why this doesn't just read cicd.yaml live from the app repo instead.
apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false
  cache:
    enabled: true

test:
  suite: integration # runs ./integration-test.sh, see that file

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: false
  ttl: 5d

governance:
  sast: true
  imageScan: false
  policyCheck: false
  sbom: false
  allowedCommitSigners:
    - crossfader@gmail.com
    - 7268337+jfillman@users.noreply.github.com

notifications:
  slack:
    enabled: true

# Migrated from the legacy `pipeline:` (singular) list form - removed from the schema
# in an earlier session (both `pipeline:` itself and each step's `after:` field, which
# never did anything: chaining was always positional). Same build->test->deploy(dev)
# shape as before, just expressed the current way - see docs/user-guide/cicd-yaml-reference.md.
pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: test
        env: dev
      - stage: deploy
        env: dev
