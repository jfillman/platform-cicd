# tenants/cicd-flow-test-app/identity.yaml
#
# Operator-owned tenant identity for cicd-flow-test-app - consumed only by the
# tenant-onboarding ApplicationSet (charts/platform-cicd-control-plane/templates/argocd/
# tenant-onboarding-applicationset.yaml), never by the pipeline itself. This is the exact
# same platformIdentity shape docs/onboarding.md used to have developers write as a local,
# untracked platform-identity.yaml passed to `helm upgrade -f` by hand - now git-tracked
# here instead, so ArgoCD can own the sync. Deliberately NOT in the app repo's own
# cicd.yaml (schemas/cicd.schema.json has no platformIdentity property, on purpose - see
# docs/onboarding.md's isolation note): a developer's own commits must never be able to
# influence this file.
#
# Lives in its own per-tenant directory alongside cicd.yaml (a tracked copy, NOT a live
# ArgoCD read of the app repo - see that file's own header for why: this platform already
# considered and rejected an ArgoCD-multi-source Application reading cicd.yaml live, since
# it would need standing ArgoCD read access to every app repo as a new credential class -
# see charts/platform-cicd-app/files/onboarding-templates/app-repo/onboarding-resync.yaml's
# header). The ApplicationSet's generator only scans `tenants/*/identity.yaml` - this
# directory's cicd.yaml is a values file input, not a second generator source.
#
# Values below are the real, live values this tenant was already running under via the
# manual helm upgrade path (confirmed via `helm get values app-cicd-flow-test-app-cicd -n
# app-cicd-flow-test-app-cicd`) - this file adopts the existing Helm release, it doesn't
# change its identity.
platformIdentity:
  appName: cicd-flow-test-app
  type: app
  gitopsRepoUrl: https://github.com/jfillman/gitops-cicd-flow-test-app
  appRepoUrl: https://github.com/jfillman/cicd-flow-test-app
  githubOwner: jfillman
  catalogNamespace: platform-catalog
