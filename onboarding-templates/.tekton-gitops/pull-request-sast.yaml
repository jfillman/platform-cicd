# .tekton/pull-request-sast.yaml
#
# BOILERPLATE - real (not stub) as of Phase 3 item 8.4. See also
# pull-request-image-scan.yaml, pull-request-policy-check.yaml, pull-request-sbom.yaml -
# still stubs (governance-check Pipeline, governance-gate-stub Task) until 8.5/8.7 land.
# References platform-cicd's dedicated sast-check Pipeline, which resolves the promoted
# app-repo commit (via the X-App-Repo/X-App-Commit trailers open-release-pr.yaml embeds)
# and runs a real Semgrep scan against it - see platform-cicd's docs/cicd-yaml-
# reference.md and catalog/tasks/sast-scan.yaml's own header for the full design.
#
# No <TENANT>/<APP_NAME> substitution needed - repo-url/revision come from PaC's own
# template vars, and the app-repo is resolved dynamically from the commit trailers, not
# hand-substituted per tenant.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sast
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: sast-check }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: repo-url, value: "{{ repo_url }}" }
    - { name: revision, value: "{{ revision }}" }
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
