# onboarding-templates/.tekton/push.yaml
#
# BOILERPLATE - generated once into an app repo's .tekton/push.yaml at onboarding time.
# Developers never hand-write or edit this file; all developer-facing pipeline behavior
# lives in the app repo's own cicd.yaml instead (see schemas/cicd.schema.json). This
# file's only job is telling Pipelines-as-Code "on a push to main, run the platform's
# `build` Pipeline" - the Pipeline itself is resolved from the shared catalog via
# Tekton's cluster resolver, never duplicated per repo.
#
# <TENANT>, <APP_NAME> and <IMAGE_REPO> below are filled in by the onboarding process
# (hand-substituted for Phase 1 pilots; a small script/Crossplane composition in later
# phases - see docs/onboarding.md) from the tenant's Application registration. If the
# platform catalog changes what params the `build` Pipeline requires, this template -
# and every already-onboarded repo's copy of it - needs a re-sync; see
# docs/cicd-yaml-reference.md "staleness" note.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: build }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: git-url, value: "{{ repo_url }}" }
    - { name: git-revision, value: "{{ revision }}" }
    - { name: image-repo, value: "<IMAGE_REPO>" }
    - { name: tenant, value: "<TENANT>" }
    - { name: app-name, value: "<APP_NAME>" }
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  taskRunTemplate:
    # Tenant's own least-privilege, namespace-scoped ServiceAccount - created at
    # onboarding. Never a shared/elevated identity. See platform/onboarding/.
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "1h"
